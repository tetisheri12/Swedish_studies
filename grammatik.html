button{border:1.5px solid var(--ink);border-radius:10px;background:var(--card);color:var(--ink);font-weight:600}button:hover{background:var(--wash)}
button.primary,button.selected{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:none;transform:none}button.primary:hover{filter:brightness(1.05)}button.primary:active{transform:translateY(1px)}
button.good{box-shadow:none}
.tabs button{border-radius:10px}.tabs button.on{background:var(--ink);color:#fff;box-shadow:none}
/* dashed peach dividers like the FAQ */
.srow{border-bottom:1.5px dashed var(--line)}section,hr{border-color:var(--line)}
h2::after{content:none}
.tabbar{background:rgba(252,250,248,.96);border-top:1px solid var(--line)}.tabbar a[aria-current=page]{color:var(--accent)}
a{color:var(--accent)}
/* handwritten notes */
.note{background:none;border:0;border-radius:0;padding:0;box-shadow:none;transform:rotate(-1deg);font-family:var(--hand);font-size:1.3em;color:var(--accent)}
.hand{font-family:var(--hand);color:var(--accent);font-size:1.25em;display:inline-block;transform:rotate(-3deg)}
/* roman-numeral rows (the "magic paper" list) */
ol.roman{list-style:none;counter-reset:r;padding:0;margin:0;border:1.5px solid var(--ink);border-radius:var(--r);background:#fff;overflow:hidden}
ol.roman li{counter-increment:r;display:flex;justify-content:space-between;padding:11px 18px;border-top:1px solid var(--line)}ol.roman li:first-child{border-top:0}
ol.roman li::after{content:counter(r,upper-roman);font-family:var(--serif);color:var(--muted)}
ol.roman li.on{color:var(--good)}
.meter{background:var(--wash)}

<script>
const LESSONS=[{"id": "adj", "title": "Matching adjectives to nouns", "level": "A2", "hook": "You will be able to describe things correctly: <i>en stor bil<\/i>, <i>ett stort hus<\/i>, <i>två stora bilar<\/i>. In Swedish the describing word changes its ending to fit the noun, and getting this right makes you sound much more natural.", "steps": [{"h": "What is an adjective?", "t": "An <b>adjective<\/b> is a describing word, like <i>big<\/i>, <i>red<\/i> or <i>old<\/i>. It tells you something about a noun (a thing, person or animal). English adjectives never change: <i>a big car<\/i>, <i>a big house<\/i>, <i>two big cars<\/i>. Swedish adjectives <b>do<\/b> change. They have to “match” the noun they describe, a bit like two socks that must go together."}, {"h": "Three forms: en, ett, plural", "t": "Every Swedish noun is an <b>en-word<\/b> or an <b>ett-word<\/b>, and it can be <b>singular<\/b> (one) or <b>plural<\/b> (more than one). With an en-word you use the basic form of the adjective: <i>en stor bil<\/i>. With an ett-word you add <b>-t<\/b>: <i>ett stor<b>t<\/b> hus<\/i>. In the plural you add <b>-a<\/b>: <i>två stor<b>a<\/b> bilar<\/i>. The same rules apply when the adjective stands after “is”: <i>Bilen är stor<\/i>, <i>Huset är stort<\/i>, <i>Bilarna är stora<\/i>."}, {"h": "After den, det, de: add -a", "t": "When you say “<i>the<\/i> big car”, you use <i>den<\/i> (for en-words), <i>det<\/i> (for ett-words) or <i>de<\/i> (plural), and the adjective always gets <b>-a<\/b>: <i>den stor<b>a<\/b> bilen<\/i>, <i>det stor<b>a<\/b> huset<\/i>, <i>de stor<b>a<\/b> bilarna<\/i>. The noun also gets its “the” ending, as in the last lesson, so “the” appears twice. That is normal in Swedish. The same -a appears after <i>min<\/i>, <i>din<\/i>, <i>vår<\/i> and similar words: <i>min stora bil<\/i>."}, {"h": "Adjectives that change spelling", "t": "Some adjectives are not quite regular. A final <b>-d<\/b> or a vowel often turns into a double <b>-tt<\/b>: <i>röd → rött<\/i>, <i>ny → nytt<\/i>, <i>blå → blått<\/i>. Adjectives ending in <b>-sk<\/b> or <b>-ig<\/b> just add -t: <i>svenskt<\/i>, <i>roligt<\/i>. The word <i>gammal<\/i> loses an m in the plural: <i>gamla<\/i>. The most irregular one is <b>liten<\/b> (small): <i>en liten bil<\/i>, <i>ett litet hus<\/i>, <i>små bilar<\/i>, and after den/det/de it becomes <i>den lilla bilen<\/i>."}, {"h": "The pattern in one sentence", "t": "Look at the noun and ask two questions: is it en or ett, and is it one or many? En gives the basic form, ett gives <b>-t<\/b>, many gives <b>-a<\/b>, and anything after den/det/de or <i>min/din<\/i> gives <b>-a<\/b>. If you are unsure of an adjective, look it up, because the irregular ones are the common ones."}], "tables": [{"caption": "The basic pattern with stor (big)", "head": ["", "form", "example"], "rows": [["en-word", "basic form", "en <b>stor<\/b> bil"], ["ett-word", "+ <b>t<\/b>", "ett <b>stort<\/b> hus"], ["plural", "+ <b>a<\/b>", "två <b>stora<\/b> bilar"], ["den / det / de ...", "+ <b>a<\/b>", "den <b>stora<\/b> bilen"]]}, {"caption": "Common adjectives that do not follow the pattern", "head": ["en-word", "ett-word", "plural / the ...", "meaning"], "rows": [["liten", "litet", "<b>små<\/b> / <b>lilla<\/b>", "small"], ["gammal", "gammalt", "<b>gamla<\/b>", "old"], ["röd", "<b>rött<\/b>", "röda", "red"], ["ny", "<b>nytt<\/b>", "nya", "new"], ["blå", "<b>blått<\/b>", "blå", "blue"]]}], "examples": [["Jag har en stor hund och en liten katt.", "I have a big dog and a small cat."], ["Vi bor i ett gammalt hus nära skogen.", "We live in an old house near the forest."], ["Hon har på sig en röd jacka.", "She is wearing a red jacket."], ["Ett rött hus ligger vid sjön.", "A red house stands by the lake."], ["Min kompis har en ny cykel och ett nytt spel.", "My friend has a new bike and a new game."], ["Den stora bilen står utanför skolan.", "The big car is parked outside the school."], ["Det lilla barnet sover i en liten säng.", "The little child sleeps in a small bed."], ["Vi fick ett svårt prov i matematik idag.", "We got a hard test in maths today."], ["De gamla böckerna står högst upp i hyllan.", "The old books are on the top shelf."]], "mistakes": [{"wrong": "Vi bor i ett stor hus.", "right": "Vi bor i ett stort hus.", "why": "In English “a” never affects the adjective. In Swedish <i>ett<\/i> means the adjective needs <b>-t<\/b>."}, {"wrong": "Jag har två stor bilar.", "right": "Jag har två stora bilar.", "why": "Plural nouns need the plural adjective, which ends in <b>-a<\/b>."}, {"wrong": "Den stor bilen är min.", "right": "Den stora bilen är min.", "why": "After <i>den/det/de<\/i> the adjective always ends in -a."}, {"wrong": "Huset är stor.", "right": "Huset är stort.", "why": "The matching also works after “is”. <i>Huset<\/i> is an ett-word, so you need <i>stort<\/i>."}], "trick": "Match the noun like a coat: en gives nothing extra, ett gives <b>-t<\/b>, many gives <b>-a<\/b>. And after den/det/de, always <b>-a<\/b>.", "check": [{"q": "ett ___ hus (stor)", "a": "stort", "why": "ett-word: add -t."}, {"q": "två ___ bilar (röd)", "a": "röda", "why": "Plural: add -a."}, {"q": "två ___ pojkar (liten)", "a": "små", "why": "The plural of liten is irregular: små."}, {"q": "den ___ katten (gammal)", "a": "gamla", "why": "After den the adjective ends in -a, and gammal becomes gamla."}, {"q": "Huset är ___ (ny)", "a": "nytt", "why": "Huset is an ett-word, and ny becomes nytt."}]}, {"id": "adverb", "title": "Adverbs: where, when, how often", "level": "B1", "hook": "You will be able to describe how, when, where and how often with little words like snabbt, igår, här and ofta, put them in the right spot, and use hem instead of hemma when you go home. These words add detail to every sentence.", "steps": [{"h": "What is an adverb?", "t": "An <b>adverb<\/b> is a word that adds detail to a verb: <i>when?<\/i> (nu, igår), <i>where?<\/i> (här, där), <i>how?<\/i> (snabbt, bra) or <i>how often?<\/i> (alltid, ofta, ibland, aldrig). Adverbs do not change with gender or number. Many 'how' adverbs are just the adjective with <b>-t<\/b>: <i>snabb<\/i> (fast) becomes <i>snabbt<\/i>. Exceptions: <i>bra<\/i> and <i>dålig/dåligt<\/i> follow their own paths, and <i>gärna<\/i> means 'gladly'."}, {"h": "Place or direction?", "t": "Swedish uses two different words for 'where' depending on whether you stay or move. <b>Hemma<\/b> = at home (staying), <b>hem<\/b> = to home (going). The same split happens in <i>här/hit, där/dit, inne/in, ute/ut, uppe/upp, nere/ner, borta/bort<\/i>. English uses one word for both. Swedish says <i>Jag är hemma<\/i> but <i>Jag går hem<\/i>."}, {"h": "Where in the sentence?", "t": "In a normal main clause, short sentence adverbs such as <i>inte, aldrig, alltid, ofta, redan<\/i> go <b>right after the verb<\/b>: <i>Jag äter ofta fisk<\/i>. With a helper verb they sit between the helper and the main verb: <i>Jag har aldrig varit där<\/i>. Place and time adverbs usually come at the end, place before time: <i>Jag ska träffa henne på kaféet imorgon<\/i>."}, {"h": "In a side clause the order flips", "t": "A <b>subordinate clause<\/b> is a clause that starts with a word like <i>att<\/i> (that), <i>om<\/i> (if), <i>eftersom<\/i> (because). There the adverb goes <b>before<\/b> the verb: <i>Jag tror att han ofta äter fisk<\/i>, <i>...att jag aldrig har varit där<\/i>. Compare the main clause <i>Jag har aldrig varit där<\/i>."}, {"h": "Starting with an adverb", "t": "You can move a time or place adverb to the front for emphasis. Then the verb must come next and the doer after it: <i>Igår köpte jag skor<\/i>, <i>Här bor jag<\/i>. English would say 'Yesterday I bought...' with the doer first. In Swedish the verb stays in second place."}], "tables": [{"caption": "Kinds of adverbs", "head": ["Kind", "Question", "Examples"], "rows": [["time", "when?", "nu, igår, snart, sedan, redan"], ["place", "where?", "här, där, ute, inne, hemma"], ["manner", "how?", "snabbt, långsamt, bra, gärna"], ["frequency", "how often?", "alltid, ofta, ibland, sällan, aldrig"]]}, {"caption": "Place (staying) or direction (moving)?", "head": ["Staying", "Moving", "Example"], "rows": [["här", "hit", "Kom <b>hit<\/b>! / Jag är <b>här<\/b>."], ["där", "dit", "Vi åker <b>dit<\/b>. / Hon bor <b>där<\/b>."], ["hemma", "hem", "Jag går <b>hem<\/b>. / Jag är <b>hemma<\/b>."], ["inne", "in", "Katten går <b>in<\/b>. / Den är <b>inne<\/b>."], ["ute", "ut", "Vi går <b>ut<\/b>. / Barnen är <b>ute<\/b>."], ["uppe", "upp", "Gå <b>upp<\/b>! / Hon är <b>uppe<\/b>."]]}], "examples": [["Jag är hemma, men jag ska gå hem till dig imorgon.", "I am at home, but I am going to your home tomorrow."], ["Kom hit, jag är här i köket!", "Come here, I am here in the kitchen!"], ["Barnen leker ute och vill inte komma in.", "The children are playing outside and do not want to come in."], ["Hon pratar alltid snabbt när hon är nervös.", "She always talks fast when she is nervous."], ["Vi äter ofta middag ute på fredagar.", "We often eat dinner out on Fridays."], ["Jag har aldrig varit där.", "I have never been there."], ["Han sa att han ibland känner sig ensam.", "He said that he sometimes feels lonely."], ["Idag är det soligt, men igår regnade det.", "Today it is sunny, but yesterday it rained."], ["Vi går dit klockan sex.", "We are going there at six o'clock."], ["Sedan åkte vi hem och sov länge.", "Then we went home and slept for a long time."], ["Vill du gärna följa med?", "Would you like to come along?"], ["Katten sitter uppe på skåpet.", "The cat is sitting up on the cupboard."]], "mistakes": [{"wrong": "Jag går hemma efter jobbet.", "right": "Jag går hem efter jobbet.", "why": "You are moving, so use the direction word <i>hem<\/i>."}, {"wrong": "Jag ofta äter fisk.", "right": "Jag äter ofta fisk.", "why": "In a main clause the adverb comes right after the verb."}, {"wrong": "Hon läser snabb.", "right": "Hon läser snabbt.", "why": "A 'how' adverb usually takes -t. <i>Snabb<\/i> is for describing a noun."}, {"wrong": "Jag vet att jag har aldrig varit där.", "right": "Jag vet att jag aldrig har varit där.", "why": "In a side clause the adverb comes before the verb."}], "trick": "Staying or going? Staying = hemma, här, ute. Going = hem, hit, ut. In a main clause the adverb is right behind the verb; in a side clause it is in front.", "check": [{"q": "Jag är ___. (at home)", "a": "hemma", "why": "Staying: hemma."}, {"q": "Kom ___! (here, moving)", "a": "hit", "why": "Direction: hit."}, {"q": "Barnen går ___. (out)", "a": "ut", "why": "Moving out: ut."}, {"q": "Hon talar ___. (fast)", "a": "snabbt", "why": "Adverb = adjective + -t."}, {"q": "Jag äter ___ fisk. (often)", "a": "ofta", "why": "In a main clause the adverb comes after the verb."}, {"q": "Jag tror att han ___ kommer. (never, side clause)", "a": "aldrig", "why": "Before the verb in a side clause."}]}, {"id": "basics", "title": "Grammar words in plain English", "level": "A1", "hook": "After this lesson you will understand the grammar words (noun, verb, subject, clause...) that every Swedish lesson uses, and you will know the three big ways Swedish works differently from English.", "steps": [{"h": "Nouns and pronouns", "t": "A <b>noun<\/b> is a word for a person, animal, thing or place: <i>syster<\/i> (sister), <i>katt<\/i> (cat), <i>skola<\/i> (school), <i>Göteborg<\/i>. A <b>pronoun<\/b> is a small word that stands in for a noun so you do not have to repeat it: <i>jag<\/i> (I), <i>du<\/i> (you), <i>hon<\/i> (she), <i>vi<\/i> (we). Example: <i>Min syster bor i Lund. Hon älskar staden.<\/i> Here <i>hon<\/i> replaces <i>min syster<\/i>."}, {"h": "Verbs, adjectives and adverbs", "t": "A <b>verb<\/b> is an action or state word, like <i>spela<\/i> (play), <i>gå<\/i> (go), <i>bo<\/i> (live) or <i>vara<\/i> (be). An <b>adjective<\/b> describes a noun: <i>en röd bil<\/i> (a red car), <i>glad<\/i> (happy). An <b>adverb<\/b> tells you how, when or where something happens, or how much: <i>snabbt<\/i> (quickly), <i>idag<\/i> (today), <i>här<\/i> (here), <i>mycket<\/i> (very/much). <i>Hon springer snabbt<\/i> = she runs (verb) quickly (adverb)."}, {"h": "Subject, object and preposition", "t": "The <b>subject<\/b> is who or what does the verb. The <b>object<\/b> is who or what the verb happens to. Find them by asking: who does it? (subject), and what/whom does it happen to? (object). <i>Pojken kastar bollen.<\/i> The boy (subject) throws the ball (object). A <b>preposition<\/b> is a small word that sits before a noun and shows place, time or connection: <i>i<\/i> (in), <i>på<\/i> (on), <i>till<\/i> (to), <i>med<\/i> (with), <i>från<\/i> (from). <i>Boken ligger på bordet.<\/i>"}, {"h": "Conjunctions and clauses", "t": "A <b>conjunction<\/b> is a glue word that joins words or sentences: <i>och<\/i> (and), <i>men<\/i> (but), <i>eller<\/i> (or), <i>att<\/i> (that), <i>eftersom<\/i> (because). A <b>clause<\/b> is a group of words with a subject and a verb. A <b>main clause<\/b> can stand alone as a sentence: <i>Jag är hemma.<\/i> A <b>subordinate clause<\/b> (Swedish: <b>bisats<\/b>) cannot stand alone; it hangs on a main clause and starts with a word like <i>att<\/i>, <i>eftersom<\/i> or <i>när<\/i>: <i>Jag är hemma eftersom jag är sjuk.<\/i> Bisatser get their own word order, which later lessons cover."}, {"h": "Tense and infinitive", "t": "<b>Tense<\/b> is the verb form that shows when something happens: now (<i>jag spelar<\/i>), in the past (<i>jag spelade<\/i>), or 'have done' (<i>jag har spelat<\/i>). The <b>infinitive<\/b> is the basic dictionary form of a verb, the one that means 'to ...' in English. In Swedish it usually ends in -a: <i>spela<\/i> (to play), <i>laga<\/i> (to cook). You use it after helper verbs: <i>Jag vill spela.<\/i> (I want to play.) and after <i>att<\/i>: <i>Det är kul att spela.<\/i>"}, {"h": "Three big ideas that make Swedish different from English", "t": "<b>1. The verb goes in place 2.<\/b> In a normal statement the verb is the second item, even if something other than the subject comes first: <i>Idag spelar jag fotboll<\/i> (not <i>Idag jag spelar<\/i>). <b>2. Every noun is en or ett.<\/b> English has only 'a'; Swedish has <i>en bil<\/i> and <i>ett hus<\/i>, and you must learn which one goes with each noun. <b>3. Endings are glued on the end.<\/b> English adds a separate word ('the car'); Swedish adds an ending: <i>bil<\/i> → <i>bilen<\/i> (the car), <i>bilar<\/i> (cars), <i>bilarna<\/i> (the cars)."}], "tables": [{"caption": "The grammar words at a glance", "head": ["Word", "In plain words", "Swedish example"], "rows": [["noun", "person, animal, thing, place", "<b>katt<\/b>, <b>skola<\/b>"], ["pronoun", "stands in for a noun", "<b>hon<\/b>, <b>vi<\/b>"], ["verb", "action or state", "<b>spela<\/b>, <b>bo<\/b>"], ["adjective", "describes a noun", "en <b>röd<\/b> bil"], ["adverb", "how / when / where", "<b>idag<\/b>, <b>snabbt<\/b>"], ["preposition", "small word before a noun", "<b>på<\/b> bordet"], ["conjunction", "glue word", "<b>och<\/b>, <b>men<\/b>, <b>att<\/b>"], ["infinitive", "'to ...' form", "<b>spela<\/b> (to play)"]]}, {"caption": "English versus Swedish: the big ideas", "head": ["Idea", "English", "Swedish"], "rows": [["verb in place 2", "Today I play football.", "Idag <b>spelar<\/b> jag fotboll."], ["en / ett", "a car, a house", "<b>en<\/b> bil, <b>ett<\/b> hus"], ["glued endings", "the car", "bil<b>en<\/b>"]]}], "examples": [["Min syster spelar fotboll varje helg.", "My sister plays football every weekend."], ["Hon är väldigt glad idag.", "She is very happy today."], ["Vi bor i en liten stad.", "We live in a small town."], ["Jag gillar pizza, men min bror gillar pasta.", "I like pizza, but my brother likes pasta."], ["Jag vet att du är hemma.", "I know that you are at home."], ["Igår spelade jag fotboll i skolan.", "Yesterday I played football at school."], ["Vill du spela schack efter middagen?", "Do you want to play chess after dinner?"], ["Min mormor bakar goda bullar varje söndag.", "My grandmother bakes tasty buns every Sunday."], ["Idag har vi gympa i skolan.", "Today we have PE at school."], ["Barnen leker i trädgården medan vi lagar mat.", "The children play in the garden while we cook."]], "mistakes": [{"wrong": "Idag jag spelar fotboll.", "right": "Idag spelar jag fotboll.", "why": "English lets the subject follow the time word; Swedish does not. The verb must stay in place 2 of the sentence."}], "trick": "Verb = second. Always ask: what is the second item in my sentence? If it is not the verb, rearrange it.", "check": [{"q": "In 'Hon springer snabbt', which word is the verb?", "a": "springer", "why": "It is the action word."}, {"q": "In 'en röd bil', which word is the adjective?", "a": "röd", "why": "It describes the noun bil."}, {"q": "Put in order: Idag / spelar / jag / fotboll", "a": "Idag spelar jag fotboll.", "why": "The verb must be in place 2."}, {"q": "The word 'spela' (to play) is the ___ form of the verb.", "a": "infinitive", "why": "It is the basic 'to ...' form."}, {"q": "In 'Jag är hemma eftersom jag är sjuk', the part after 'eftersom' is a ___ clause.", "a": "subordinate clause (bisats)", "why": "It cannot stand alone and starts with a conjunction."}]}, {"id": "bisats", "title": "Where does inte go in a tail clause?", "level": "B1", "hook": "You will know exactly where to put inte, aldrig, alltid and similar words after words like att, eftersom and om. This one small rule is a huge giveaway of how natural your Swedish sounds.", "steps": [{"h": "Main clauses and tail clauses", "t": "A <b>main clause<\/b> is a clause that can stand on its own as a full sentence: <i>Han kommer inte.<\/i> A <b>subordinate clause<\/b> (Swedish: <b>bisats<\/b>) cannot stand alone. It hangs on a main clause after a word like <i>att<\/i> (that), <i>eftersom<\/i> (because), <i>om<\/i> (if or whether), <i>när<\/i> (when) or <i>som<\/i> (who, which, that). <i>… att han inte kommer<\/i> is a bisats, because by itself it feels unfinished."}, {"h": "In a main clause: verb first, then inte", "t": "In an ordinary main clause the verb (the action word, like <i>kommer<\/i> = comes) takes its place first and then <i>inte<\/i> (not) follows. <i>Han kommer <b>inte<\/b>.<\/i> <i>Vi har <b>aldrig<\/b> varit där.<\/i> This is the order you learned first, and it is quite close to English, where the helper word comes first: <i>he does not come<\/i>."}, {"h": "In a bisats: inte jumps in front of the verb", "t": "Inside a bisats the little word moves <b>before<\/b> the verb. The pattern is <b>subject, little word, verb<\/b>. <i>Jag vet att han <b>inte<\/b> kommer.<\/i> <i>Jag blev glad eftersom hon <b>inte<\/b> var arg.<\/i> If the subject is a noun it works the same way: <i>att Anna <b>inte<\/b> kommer<\/i>."}, {"h": "When there are two verbs", "t": "Many sentences have two verbs, such as <i>har varit<\/i> (have been) or <i>kan simma<\/i> (can swim). The little word goes in front of the <b>first<\/b> of them, the one that changes with tense. <i>… eftersom vi <b>aldrig<\/b> har varit där.<\/i> <i>… att hon <b>inte<\/b> kan simma.<\/i> It does not go after <i>har<\/i>, which is where English speakers instinctively put it."}, {"h": "Which words behave this way", "t": "The rule is not only for <i>inte<\/i>. It works for the whole group of small adverbs (words that add detail to a verb): <b>aldrig<\/b> (never), <b>alltid<\/b> (always), <b>ofta<\/b> (often), <b>redan<\/b> (already), <b>också<\/b> (also), <b>bara<\/b> (only), <b>nog<\/b> (probably) and <b>inte<\/b>. <i>Jag tror att han <b>nog<\/b> kommer.<\/i> <i>Hon säger att hon <b>ofta<\/b> spelar piano.<\/i> Whenever you see a word like <i>att<\/i> or <i>eftersom<\/i>, get ready to put the little word before the verb."}], "tables": [{"caption": "Main clause versus bisats", "head": ["Main clause (verb, then inte)", "Bisats (inte, then verb)"], "rows": [["Han kommer <b>inte<\/b>.", "Jag vet att han <b>inte<\/b> kommer."], ["Vi har <b>aldrig<\/b> varit där.", "… eftersom vi <b>aldrig<\/b> har varit där."], ["Hon spelar <b>ofta<\/b> piano.", "Jag hör att hon <b>ofta<\/b> spelar piano."], ["Han äter <b>alltid<\/b> frukost.", "Jag undrar om han <b>alltid<\/b> äter frukost."]]}, {"caption": "The little words that jump", "head": ["Word", "Meaning"], "rows": [["<b>inte<\/b>", "not"], ["<b>aldrig<\/b>", "never"], ["<b>alltid<\/b>", "always"], ["<b>ofta<\/b>", "often"], ["<b>redan<\/b>", "already"], ["<b>också<\/b>", "also"], ["<b>bara<\/b>", "only, just"], ["<b>nog<\/b>", "probably"]]}], "examples": [["Jag vet att han inte kommer imorgon.", "I know that he is not coming tomorrow."], ["Hon sa att hon aldrig har varit i Norge.", "She said that she has never been to Norway."], ["Vi stannar hemma eftersom det inte är varmt ute.", "We are staying home because it is not warm outside."], ["Jag undrar om Erik alltid äter frukost så sent.", "I wonder if Erik always eats breakfast that late."], ["Det här är boken som jag inte har läst.", "This is the book that I have not read."], ["När barnen inte är trötta leker de ute länge.", "When the children are not tired, they play outside for a long time."], ["Tror du att de ofta spelar fotboll på lördagar?", "Do you think they often play football on Saturdays?"], ["Jag blev ledsen därför att de inte ringde.", "I became sad because they did not call."], ["Han säger att han redan har ätit middag.", "He says that he has already eaten dinner."], ["Läraren vet att vi inte gjorde läxan.", "The teacher knows that we did not do the homework."]], "mistakes": [{"wrong": "Jag vet att han kommer inte.", "right": "Jag vet att han inte kommer.", "why": "After <i>att<\/i> the little word goes before the verb. People copy the main-clause order, which is why it feels natural."}, {"wrong": "Jag tror att hon har inte sett filmen.", "right": "Jag tror att hon inte har sett filmen.", "why": "With two verbs, <i>inte<\/i> goes before the first one (<i>har<\/i>), not between the two verbs."}, {"wrong": "Hon berättade att hon går aldrig dit.", "right": "Hon berättade att hon aldrig går dit.", "why": "<i>Aldrig<\/i>, <i>alltid<\/i> and <i>ofta<\/i> follow the same rule as <i>inte<\/i>."}, {"wrong": "Jag blev hemma eftersom jag var inte frisk.", "right": "Jag blev hemma eftersom jag inte var frisk.", "why": "<i>Eftersom<\/i> starts a bisats, and English never changes the order of its words here, so we forget to do it in Swedish."}], "trick": "Main clause: the verb goes first and <i>inte<\/i> follows. Bisats: <i>inte<\/i> is shy and hides in front of the verb. Pattern to remember: <b>subject, inte, verb<\/b>.", "check": [{"q": "Make it negative: Jag vet att han kommer.", "a": "Jag vet att han inte kommer.", "why": "In a bisats <i>inte<\/i> comes before the verb."}, {"q": "Hon sa att hon ___ ___ ätit sushi. (aldrig, har)", "a": "aldrig har", "why": "<i>Aldrig<\/i> goes before the first verb, <i>har<\/i>."}, {"q": "Main clause: Han kommer inte. Now with eftersom: … eftersom han ___ ___.", "a": "inte kommer", "why": "Little word first, then verb."}, {"q": "Correct it: Jag undrar om hon är alltid så glad.", "a": "Jag undrar om hon alltid är så glad.", "why": "<i>Alltid<\/i> moves in front of the verb in the bisats."}, {"q": "Translate: I think that we do not have time.", "a": "Jag tror att vi inte har tid.", "why": "<i>Att<\/i> makes a bisats, so <i>inte<\/i> comes before <i>har<\/i>."}]}, {"id": "def", "title": "Putting “the” on the end: bestämd form", "level": "A2", "hook": "You will be able to say “the book”, “the house” and “the cars” the Swedish way, by gluing a small ending onto the noun. Without it you can only talk about things in general, never about a specific thing.", "steps": [{"h": "English has a word, Swedish has an ending", "t": "A <b>noun<\/b> is a word for a thing, person or animal, like <i>book<\/i>, <i>girl<\/i> or <i>house<\/i>. In English we put the little word “the” in front of a noun when we mean one particular thing: <i>the book<\/i>. Swedish does something different. It sticks “the” onto the <b>end<\/b> of the noun: <i>bok<\/i> becomes <i>bok<b>en<\/b><\/i>. The Swedish name for this is <i>bestämd form<\/i>, which means “definite form”: the form you use for a specific, known thing."}, {"h": "First, remember en and ett", "t": "Every Swedish noun is an <b>en-word<\/b> or an <b>ett-word<\/b>: <i>en bok<\/i> (a book), <i>ett hus<\/i> (a house). This is the word for “a”. It matters here because it decides which ending you get: en-words take <b>-en<\/b> and ett-words take <b>-et<\/b>. So <i>en bil<\/i> becomes <i>bil<b>en<\/b><\/i>, and <i>ett hus<\/i> becomes <i>hus<b>et<\/b><\/i>. Notice that <i>en<\/i> and <i>ett<\/i> disappear: you never say “en bilen”."}, {"h": "If the noun already ends in a vowel, shorten the ending", "t": "A <b>vowel<\/b> is one of the letters a, e, i, o, u, y, å, ä, ö. A <b>consonant<\/b> is any other letter. If a noun already ends in a vowel, you only add the last letter of the ending, so you do not get two vowels in a row: <i>en flicka<\/i> becomes <i>flicka<b>n<\/b><\/i>, and <i>ett äpple<\/i> becomes <i>äpple<b>t<\/b><\/i>. Words ending in unstressed <i>-el<\/i>, <i>-en<\/i> or <i>-er<\/i> usually follow this too: <i>en cykel<\/i> becomes <i>cykel<b>n<\/b><\/i>."}, {"h": "The plural: more than one", "t": "The <b>plural<\/b> means “more than one”. To say “the cars” you take the plural noun (<i>bilar<\/i>) and add <b>-na<\/b>: <i>bilar<b>na<\/b><\/i>. Plurals ending in -or, -ar or -er work like this: <i>flickor<\/i> becomes <i>flickor<b>na<\/b><\/i>, <i>pojkar<\/i> becomes <i>pojkar<b>na<\/b><\/i>. Some ett-words have a plural ending in -n (<i>äpplen<\/i>), and for those the ending is <b>-a<\/b> instead: <i>äpplen<b>a<\/b><\/i>. Other ett-words do not change in the plural at all (<i>ett hus, två hus<\/i>). Those take <b>-en<\/b>: <i>husen<\/i> means “the houses”."}, {"h": "When to use it", "t": "Use the definite form when you and the listener both know which thing you mean: <i>Boken ligger på bordet<\/i>, “The book is on the table”. Use <i>en bok<\/i> when you mention something for the first time or in general: <i>Jag har en bok<\/i>. Careful: <i>husen<\/i> is plural (“the houses”) and <i>huset<\/i> is singular (“the house”). One letter changes the meaning, so check it."}], "tables": [{"caption": "One thing: the ending depends on en/ett and on the last letter", "head": ["", "en-word", "ett-word"], "rows": [["noun ends in a consonant", "en bil → bil<b>en<\/b>", "ett hus → hus<b>et<\/b>"], ["noun ends in a vowel", "en flicka → flicka<b>n<\/b>", "ett äpple → äpple<b>t<\/b>"], ["ends in -el / -en / -er", "en cykel → cykel<b>n<\/b>", "ett fönster → fönstr<b>et<\/b>"]]}, {"caption": "More than one: “the” in the plural", "head": ["plural type", "a / some", "the"], "rows": [["en-words with -or", "flickor", "flickor<b>na<\/b>"], ["en-words with -ar", "bilar", "bilar<b>na<\/b>"], ["en-words with -er", "böcker", "böcker<b>na<\/b>"], ["ett-words ending in -n", "äpplen", "äpplen<b>a<\/b>"], ["ett-words that do not change", "hus", "hus<b>en<\/b>"]]}], "examples": [["Boken ligger på bordet i köket.", "The book is lying on the table in the kitchen."], ["Huset ligger nära skolan.", "The house is close to the school."], ["Flickan spelar fotboll med kompisarna efter lektionen.", "The girl plays football with her friends after the lesson."], ["Bilen är röd, men cykeln är blå.", "The car is red, but the bike is blue."], ["Min syster lagar maten i köket.", "My sister makes the food in the kitchen."], ["Barnen leker i parken varje eftermiddag.", "The children play in the park every afternoon."], ["Läraren ger eleverna läxan på fredag.", "The teacher gives the pupils the homework on Friday."], ["Hunden sover under bordet.", "The dog is sleeping under the table."], ["Äpplet är gott, men päronen är för hårda.", "The apple is tasty, but the pears are too hard."]], "mistakes": [{"wrong": "Den bil är röd.", "right": "Bilen är röd.", "why": "English puts “the” first, so we reach for <i>den<\/i>. In plain Swedish you glue the ending onto the noun instead."}, {"wrong": "Jag ser husena.", "right": "Jag ser husen.", "why": "<i>hus<\/i> does not change in the plural, so “the houses” is <i>husen<\/i>. The ending <i>-na<\/i> is for plurals with -or, -ar or -er."}, {"wrong": "Flickaen är glad.", "right": "Flickan är glad.", "why": "The noun already ends in a vowel (<i>flicka<\/i>), so you add only <i>-n<\/i>. Two vowels in a row is not allowed here."}, {"wrong": "Jag cyklar på cykelen.", "right": "Jag cyklar på cykeln.", "why": "Nouns ending in -el, -en or -er just add <i>-n<\/i> (or <i>-et<\/i> for ett-words, with the e dropped)."}], "trick": "Think of “the” as a sticker on the back of the word: <b>-en<\/b> for en-words, <b>-et<\/b> for ett-words, <b>-na<\/b> for most plurals. If the word already ends in a vowel, use just the last letter.", "check": [{"q": "en stol → the chair: ___", "a": "stolen", "why": "en-word ending in a consonant: add -en."}, {"q": "ett äpple → the apple: ___", "a": "äpplet", "why": "ett-word ending in a vowel: add only -t."}, {"q": "en flicka → the girl: ___", "a": "flickan", "why": "Ends in a vowel, so only -n is added."}, {"q": "ett hus (plural) → the houses: ___", "a": "husen", "why": "hus does not change in the plural, so the ending is -en."}, {"q": "bilar → the cars: ___", "a": "bilarna", "why": "Plural in -ar takes -na."}]}, {"id": "enett", "title": "En or ett: the two kinds of noun", "level": "A2", "hook": "You will know why Swedish has both en and ett, how to guess the right one for many nouns, and how to learn each new noun so you never have to guess again. Getting this right shapes the rest of your sentence.", "steps": [{"h": "Two kinds of 'a'", "t": "A <b>noun<\/b> is a word for a person, animal, thing or place. English has one little word for 'a' or 'an'. Swedish has two: <b>en<\/b> and <b>ett<\/b>. Every noun belongs to one of the two, and it has nothing to do with male or female: <i>en bil<\/i> (a car), <i>ett hus<\/i> (a house). About three out of four nouns are <b>en-words<\/b>, the rest are <b>ett-words<\/b>."}, {"h": "Why it matters", "t": "The choice does not stop at the little word. It also changes other words around the noun. The word for 'the' is glued on the end: <i>bilen<\/i> but <i>huset<\/i>. Words like 'my' and 'big' change as well: <i>min bil<\/i> but <i>mitt hus<\/i>, <i>en stor bil<\/i> but <i>ett stort hus<\/i>. The ending of the definite form is a handy clue: if a noun ends in <b>-en<\/b> when it means 'the ...', it is an en-word, if it ends in <b>-et<\/b>, it is an ett-word."}, {"h": "Clues for en-words", "t": "There is no perfect rule, but there are good helpers. <b>People and animals<\/b> are usually en-words: <i>en lärare<\/i>, <i>en flicka<\/i>, <i>en katt<\/i> (exceptions: <i>ett barn<\/i> and <i>ett djur<\/i>). Words ending in <b>-ning, -het, -else<\/b> and <b>-are<\/b> are always en-words: <i>en förklaring<\/i> (explanation), <i>en möjlighet<\/i> (chance), <i>en upplevelse<\/i> (experience), <i>en lärare<\/i>. Words ending in <b>-ion<\/b> are en-words too: <i>en station<\/i>. Days, weeks and seasons are en-words: <i>en dag, en vecka, en sommar<\/i>."}, {"h": "Clues for ett-words", "t": "Many ett-words end in <b>-um, -ment<\/b> or <b>-eri<\/b>: <i>ett museum, ett dokument, ett bageri<\/i> (bakery). Many short everyday words for things are ett-words too: <i>ett hus, ett bord, ett ord, ett land, ett äpple, ett fönster<\/i>. These are only tendencies, so treat them as tips, not rules."}, {"h": "The only safe way: learn the article with the noun", "t": "Because the helpers do not cover everything, always learn a new noun together with its article: say <i>en bil<\/i>, never just <i>bil<\/i>. Good dictionaries list it, and the definite form will check your memory (<i>bilen<\/i> vs <i>huset<\/i>). When you really do not know, guess <b>en<\/b>: you will be right about 75% of the time. If you have to guess, ett only needs to be remembered when it is an exception."}], "tables": [{"caption": "What en or ett changes", "head": ["", "en-word", "ett-word"], "rows": [["a ...", "<b>en<\/b> bil", "<b>ett<\/b> hus"], ["the ...", "bil<b>en<\/b>", "hus<b>et<\/b>"], ["my ...", "min bil", "mitt hus"], ["a big ...", "en stor bil", "ett stort hus"]]}, {"caption": "Helpers for the article", "head": ["Clue", "Article", "Example"], "rows": [["people and animals", "<b>en<\/b>", "en lärare, en katt (but ett barn, ett djur)"], ["-ning, -het, -else, -are, -ion", "<b>en<\/b>", "en förklaring, en möjlighet, en station"], ["-um, -ment, -eri", "<b>ett<\/b> (often)", "ett museum, ett dokument, ett bageri"]]}], "examples": [["Jag har en ny cykel och ett nytt tält.", "I have a new bike and a new tent."], ["Läraren skrev ett ord på tavlan.", "The teacher wrote a word on the board."], ["Det finns ett bageri vid stationen.", "There is a bakery by the station."], ["En katt sover på ett mjukt täcke.", "A cat is sleeping on a soft blanket."], ["Vi besökte ett museum och en park.", "We visited a museum and a park."], ["Min lärare har ett stort hus och en liten trädgård.", "My teacher has a big house and a small garden."], ["Barnet fick en bok och ett pussel i present.", "The child got a book and a puzzle as a present."], ["Det är en bra idé att ta en paus.", "It is a good idea to take a break."], ["Hon skickade en inbjudan och ett kort.", "She sent an invitation and a card."], ["Det röda huset ligger bredvid bilen på gatan.", "The red house is next to the car on the street."]], "mistakes": [{"wrong": "Vi har en hus.", "right": "Vi har ett hus.", "why": "English 'a' never changes, so it is easy to use en everywhere. Hus is an ett-word."}, {"wrong": "Jag har en stor hus.", "right": "Jag har ett stort hus.", "why": "The adjective has to match the noun: ett-words need -t on the adjective (stor → stort)."}, {"wrong": "En barn leker på gården.", "right": "Ett barn leker på gården.", "why": "People are usually en-words, so barn (child) is a surprise. Learn the exceptions: ett barn, ett djur."}, {"wrong": "Vi gick till en museum.", "right": "Vi gick till ett museum.", "why": "The ending -um is a typical sign of an ett-word."}], "trick": "Think 'en is the default': if the word is a person, an animal or ends in -ning, -het, -else or -are, it is en. If it ends in -um, -ment or -eri, it is probably ett. And check by saying the definite form: -en or -et.", "check": [{"q": "___ bageri (a bakery)", "a": "ett", "why": "Words in -eri are ett-words."}, {"q": "___ lärare (a teacher)", "a": "en", "why": "People and words ending in -are are en-words."}, {"q": "What is the definite form of 'ett hus'?", "a": "huset", "why": "Ett-words get -et."}, {"q": "Jag har ett ___ hus. (stor)", "a": "stort", "why": "Adjectives with ett-words take -t."}, {"q": "___ förklaring (an explanation)", "a": "en", "why": "Words in -ning are en-words."}]}, {"id": "fraga", "title": "Asking questions: vad, vem, var, vart", "level": "A2", "hook": "You will be able to ask for information, ask yes/no questions and answer them the Swedish way: 'Ja, det gör jag.' You will also stop mixing up var and vart.", "steps": [{"h": "Question words", "t": "The main question words are <i>vad<\/i> (what), <i>vem<\/i> (who), <i>var<\/i> (where), <i>hur<\/i> (how), <i>när<\/i> (when) and <i>varför<\/i> (why). Put them first in the sentence and then put the verb straight after them, before the doer: <i>Vad gör du?<\/i> (not <i>Vad du gör?<\/i>). The verb is always the second item."}, {"h": "Which one: vilken, vilket, vilka", "t": "<b>Vilken<\/b>, <b>vilket<\/b> and <b>vilka<\/b> mean 'which' or 'what kind of'. Like many Swedish words, they match the noun: <i>vilken<\/i> for an en-word (<i>Vilken bil?<\/i>), <i>vilket<\/i> for an ett-word (<i>Vilket hus?<\/i>) and <i>vilka<\/i> for plurals (<i>Vilka skor?<\/i>). Remember <i>vem<\/i> asks about a person and <i>vad<\/i> about a thing."}, {"h": "var, vart and varifrån", "t": "Swedish splits 'where' into three. <b>Var<\/b> asks about a place where you stay: <i>Var bor du?<\/i> <b>Vart<\/b> asks where you are going to: <i>Vart ska du?<\/i> <b>Varifrån<\/b> asks where you come from: <i>Varifrån kommer du?<\/i> Think: position, direction, origin."}, {"h": "Yes/no questions", "t": "If there is no question word, put the verb first: <i>Bor du här?<\/i> <i>Har du en penna?<\/i> The answer is <b>ja<\/b> or <b>nej<\/b>. But if the question has <i>inte<\/i> in it, say <b>jo<\/b> to mean yes: <i>Gillar du inte fisk? Jo, det gör jag.<\/i> (Yes, I do like it.) Say <i>nej<\/i> to agree with the 'not'."}, {"h": "Short answers with det", "t": "Swedish likes to repeat the helper verb: <i>Kan du simma? Ja, det kan jag.<\/i> For most other verbs use <b>gör<\/b> (does): <i>Gillar du kaffe? Ja, det gör jag.<\/i> For the past use <b>gjorde<\/b>: <i>Åt du? Ja, det gjorde jag.<\/i> And for 'have done' use <b>har<\/b>: <i>Har du ätit? Ja, det har jag.<\/i> Never answer with 'jag gör' only."}], "tables": [{"caption": "Question words", "head": ["Word", "Meaning", "Example"], "rows": [["vad", "what", "<b>Vad<\/b> heter du?"], ["vem", "who", "<b>Vem<\/b> ringde?"], ["vilken / vilket / vilka", "which", "<b>Vilken<\/b> färg gillar du?"], ["var", "where (staying)", "<b>Var<\/b> är stationen?"], ["vart", "where to", "<b>Vart<\/b> går bussen?"], ["varifrån", "where from", "<b>Varifrån<\/b> kommer hon?"], ["hur", "how", "<b>Hur<\/b> mår du?"], ["när", "when", "<b>När<\/b> börjar filmen?"], ["varför", "why", "<b>Varför<\/b> är du sen?"]]}, {"caption": "Short answers", "head": ["Question", "Answer", "Why"], "rows": [["Är du hungrig?", "Ja, det är jag.", "verb repeated"], ["Gillar du glass?", "Ja, det gör jag.", "gör replaces a normal verb"], ["Kan hon simma?", "Nej, det kan hon inte.", "kan repeated"], ["Har du inte ätit?", "Jo, det har jag.", "jo = yes to a not-question"]]}], "examples": [["Vad gör du på helgen?", "What are you doing at the weekend?"], ["Vem har tagit min penna?", "Who has taken my pen?"], ["Vilket hus bor ni i, det gula eller det vita?", "Which house do you live in, the yellow or the white?"], ["Var är mina nycklar?", "Where are my keys?"], ["Vart ska du åka i sommar?", "Where are you going this summer?"], ["Varifrån kommer din man?", "Where does your husband come from?"], ["Hur många barn har du?", "How many children do you have?"], ["När kommer tåget?", "When does the train come?"], ["Varför grät flickan?", "Why did the girl cry?"], ["Spelar du gitarr? Ja, det gör jag.", "Do you play guitar? Yes, I do."], ["Är det inte kallt ute? Jo, det är det.", "Isn't it cold outside? Yes, it is."], ["Hur gammal är din syster?", "How old is your sister?"]], "mistakes": [{"wrong": "Var går du imorgon?", "right": "Vart går du imorgon?", "why": "You are asking about movement to a place, so you need <i>vart<\/i>."}, {"wrong": "Vad du vill äta?", "right": "Vad vill du äta?", "why": "In a question the verb comes straight after the question word, before the doer."}, {"wrong": "Gillar du fisk? Ja, jag gör.", "right": "Gillar du fisk? Ja, det gör jag.", "why": "The short answer needs <i>det<\/i> first: <i>det gör jag<\/i>."}, {"wrong": "Vilken hus är ditt?", "right": "Vilket hus är ditt?", "why": "<i>Hus<\/i> is an ett-word, so use <i>vilket<\/i>."}], "trick": "Var = Where (I stay), Vart = where To (I go). And in every question the verb is next to the question word: Vad GÖR du?", "check": [{"q": "___ bor du? (where, position)", "a": "Var", "why": "Staying in a place: var."}, {"q": "___ ska du åka? (where to)", "a": "Vart", "why": "Direction: vart."}, {"q": "___ bil är din, den röda? (which, en-word)", "a": "Vilken", "why": "Bil is an en-word."}, {"q": "Har du inte ätit? ___, det har jag.", "a": "Jo", "why": "Jo means yes to a question that has inte in it."}, {"q": "Röker du? Nej, det ___ jag inte.", "a": "gör", "why": "gör replaces the verb in short answers."}, {"q": "Vad ___ du? (gör / du gör)", "a": "gör du", "why": "Verb second: Vad gör du?"}]}, {"id": "framtid", "title": "Talking about the future", "level": "A2", "hook": "You will be able to say what you will do, what will happen and what you plan, even though Swedish has no special future form. You will know when to use ska, kommer att, tänker or just the plain present.", "steps": [{"h": "No future tense", "t": "English has 'will'. Swedish has no real future form of the verb, but four easy ways to talk about what comes next. Which one you choose depends on <b>why<\/b> you speak: a plan, a prediction, a timetable or an intention. Look at the table for the overview."}, {"h": "ska + infinitive: plans and promises", "t": "<b>Ska<\/b> followed by the infinitive (the 'to ...' form, without att) is the most common way to say what you have decided or arranged: <i>Jag ska resa till Skåne i sommar.<\/i> It is also good for promises and offers: <i>Jag ska hjälpa dig<\/i>. <i>Ska<\/i> never changes with who does it: <i>jag ska, han ska, vi ska<\/i>."}, {"h": "kommer att: what will happen", "t": "<b>Kommer att<\/b> + infinitive is more like a prediction, or something that will happen regardless of anyone's plan: <i>Det kommer att regna imorgon<\/i>, <i>Du kommer att gilla den<\/i>. Here the <i>att<\/i> is needed in writing. (In speech it is often dropped.) <i>Kommer<\/i> alone just means 'comes'."}, {"h": "The plain present with a time word", "t": "For something fixed, like a timetable or an arranged plan, the present tense is enough if there is a time word: <i>Tåget går klockan åtta<\/i>, <i>Vi åker imorgon<\/i>. The time word does the job of the future. Useful words: <i>imorgon, ikväll, nästa vecka, i sommar, snart<\/i>, and <b>om<\/b> for 'in': <i>om tre dagar<\/i> (in three days)."}, {"h": "tänker: I intend to", "t": "<b>Tänker<\/b> + infinitive says you are planning or thinking of doing something, a bit less certain than ska: <i>Jag tänker köpa en cykel<\/i>. As a verb on its own, <i>tänka<\/i> also means 'think': <i>Jag tänker på dig<\/i> (I am thinking of you). After <i>tänker<\/i> meaning 'plan', no att."}], "tables": [{"caption": "Four ways to talk about the future", "head": ["Way", "Use", "Example"], "rows": [["ska + infinitive", "plan, decision, promise", "Jag <b>ska<\/b> flytta."], ["kommer att + infinitive", "prediction", "Det <b>kommer att<\/b> bli kallt."], ["present + time word", "timetable, arrangement", "Vi <b>åker<\/b> imorgon."], ["tänker + infinitive", "intention", "Jag <b>tänker<\/b> sova länge."]]}, {"caption": "Future time words", "head": ["Swedish", "English"], "rows": [["imorgon", "tomorrow"], ["ikväll", "this evening"], ["nästa vecka", "next week"], ["i sommar", "this summer"], ["om tre dagar", "in three days"], ["snart", "soon"]]}], "examples": [["Imorgon ska vi träffa läraren.", "Tomorrow we are going to meet the teacher."], ["Jag ska handla mat efter jobbet.", "I am going to buy food after work."], ["Det kommer att bli en varm sommar.", "It will be a warm summer."], ["Hon kommer att bli en bra läkare.", "She will be a good doctor."], ["Tåget till Stockholm går om tio minuter.", "The train to Stockholm leaves in ten minutes."], ["Vi åker till farmor nästa helg.", "We are going to Grandma's next weekend."], ["Jag tänker ringa honom ikväll.", "I intend to call him this evening."], ["Vad ska du göra i sommar?", "What are you going to do this summer?"], ["Jag ska hjälpa dig att flytta.", "I will help you move."], ["Snart kommer det att bli mörkt.", "Soon it will get dark."], ["Butiken öppnar klockan nio imorgon.", "The shop opens at nine tomorrow."], ["Jag kommer tillbaka om en vecka.", "I will be back in a week."]], "mistakes": [{"wrong": "Imorgon jag ska resa.", "right": "Imorgon ska jag resa.", "why": "If something other than the doer starts the sentence, the verb must come second. Then the doer."}, {"wrong": "Jag kommer tillbaka i tre dagar. (in three days)", "right": "Jag kommer tillbaka om tre dagar.", "why": "For 'in' a future time use <i>om<\/i>. <i>I tre dagar<\/i> means 'for three days'."}, {"wrong": "Jag tänker att köpa en cykel.", "right": "Jag tänker köpa en cykel.", "why": "For a plan, <i>tänker<\/i> takes the bare verb, no att."}, {"wrong": "Det kommer regna imorgon.", "right": "Det kommer att regna imorgon.", "why": "In writing, <i>kommer<\/i> needs <i>att<\/i> to be the future."}], "trick": "Plan = ska. Prediction = kommer att. Timetable = present + time word. Intention = tänker. And a time word first pushes the verb to second place.", "check": [{"q": "Imorgon ___ jag städa. (ska)", "a": "ska", "why": "Plan: ska + infinitive."}, {"q": "Det ___ att snöa i natt. (kommer)", "a": "kommer", "why": "Prediction."}, {"q": "Tåget går ___ tio minuter. (in)", "a": "om", "why": "om = in (future)."}, {"q": "Jag tänker ___ en cykel. (köpa)", "a": "köpa", "why": "Infinitive after tänker."}, {"q": "Nästa vecka ___ vi. (åker)", "a": "åker", "why": "Present with a time word."}, {"q": "Nästa år ___ vi flytta till Göteborg. (ska)", "a": "ska", "why": "Plan: ska + infinitive."}]}, {"id": "gen", "title": "Compound words and the -s: Annas bil", "level": "B1", "hook": "You will be able to build long Swedish words like fotbollsmatch from smaller ones, and to say 'Anna's car' with just one -s, no apostrophe needed. This is how Swedish makes new words all the time.", "steps": [{"h": "Glue words together", "t": "In English you often write two words ('football match', 'train station'). Swedish glues them into <b>one<\/b> word: <i>fotbollsmatch<\/i>, <i>tågstation<\/i>. This is called a <b>compound noun<\/b> ('noun' = a word for a thing or person). The <b>last<\/b> part is the main word and decides the gender: <i>en match<\/i>, so <i>en fotbollsmatch<\/i>; <i>ett hus<\/i>, so <i>ett skolhus<\/i>. The first part only describes it."}, {"h": "The joining -s", "t": "Sometimes a little <b>-s-<\/b> sits in the middle: <i>fotbollsmatch<\/i>, <i>tidningsartikel<\/i>. It is a join, not a possessive. There is no perfect rule, but it is common after words ending in <i>-ing, -ion, -het, -skap, -else<\/i> and after many words that end in a consonant, and rare after words ending in a vowel (<i>skolbok, kaffekopp<\/i>). When unsure, look the word up, and notice what is used by others."}, {"h": "Sometimes letters change or disappear", "t": "Some first parts lose their last vowel or add a vowel: <i>flicka<\/i> and <i>skola<\/i> but <i>flickvän, skolbok<\/i>. You do not need to learn every case now. Just remember: write it as one word, and put the main word last."}, {"h": "The genitive: Annas bil", "t": "To show who owns something, add <b>-s<\/b> to the owner and put it before the thing: <i>Annas bil<\/i> (Anna's car), <i>pojkens cykel<\/i> (the boy's bike), <i>barnens leksaker<\/i> (the children's toys). Swedish never uses an apostrophe here. This -s attaches to the whole owner word, including the ending: <i>bilens färg<\/i> (the car's colour)."}, {"h": "Names ending in s, and no 'of'", "t": "If a name already ends in -s, add nothing: <i>Lars bil<\/i>. You may also see <i>Lars' bil<\/i>. Swedish rarely says 'the colour of the car'. It prefers <i>bilens färg<\/i>. You can also say <i>färgen på bilen<\/i>, which is also common, especially in speech."}], "tables": [{"caption": "Compounds: last word decides the gender", "head": ["Parts", "Compound", "English"], "rows": [["fotboll + match", "<b>en<\/b> fotbollsmatch", "football match"], ["tåg + station", "<b>en<\/b> tågstation", "train station"], ["skola + bok", "<b>en<\/b> skolbok", "school book"], ["tidning + artikel", "<b>en<\/b> tidningsartikel", "newspaper article"], ["hund + mat", "<b>en<\/b> hundmat", "dog food"], ["sommar + lov", "<b>ett<\/b> sommarlov", "summer holiday"]]}, {"caption": "The possessive -s", "head": ["Owner", "With -s", "Example"], "rows": [["Anna", "Annas", "Annas bil är röd."], ["Johan", "Johans", "Johans bok är ny."], ["Lars", "Lars", "Lars hund är snäll."], ["pojken", "pojkens", "Pojkens cykel är trasig."], ["barnen", "barnens", "Barnens skor står här."]]}], "examples": [["Annas bil står utanför huset.", "Anna's car is parked outside the house."], ["Vi såg en fotbollsmatch på lördagen.", "We watched a football match on Saturday."], ["Barnens leksaker ligger på golvet.", "The children's toys are on the floor."], ["Min brors lägenhet ligger i centrum.", "My brother's flat is in the centre."], ["Läraren rättade elevernas prov.", "The teacher marked the students' tests."], ["Hon läste en intressant tidningsartikel.", "She read an interesting newspaper article."], ["Hundens svans viftade glatt.", "The dog's tail wagged happily."], ["Sommarlovet börjar i juni.", "The summer holiday begins in June."], ["Lars kaffekopp är tom.", "Lars's coffee cup is empty."], ["Jag glömde mobilladdaren hemma.", "I forgot the phone charger at home."], ["Stadens bibliotek har öppet till nio.", "The town's library is open until nine."], ["Kan du hämta tågbiljetterna åt mig?", "Can you pick up the train tickets for me?"]], "mistakes": [{"wrong": "Anna's bil är ny.", "right": "Annas bil är ny.", "why": "Swedish never uses an apostrophe before the possessive -s (except sometimes after a name ending in s)."}, {"wrong": "Han tittar på fotbollmatch.", "right": "Han tittar på fotbollsmatch.", "why": "Many compounds need a joining -s: fotbolls-match."}, {"wrong": "Jag väntar på tåg stationen.", "right": "Jag väntar på tågstationen.", "why": "Compounds are written as one word."}, {"wrong": "Bilen färg är röd.", "right": "Bilens färg är röd.", "why": "The owner needs the -s: bilens."}], "trick": "One thing = one word. Main word last, possessor first with -s. If it looks like two English words in a row, Swedish probably glues them.", "check": [{"q": "Anna's car:", "a": "Annas bil", "why": "No apostrophe."}, {"q": "the children's room: barnen___ rum", "a": "s", "why": "Add -s to the owner: barnens."}, {"q": "train + ticket = ___ (one word)", "a": "tågbiljett", "why": "Written as one word, main word last."}, {"q": "Football + match: fotboll___match", "a": "s", "why": "The joining -s."}, {"q": "Lars' book:", "a": "Lars bok", "why": "A name ending in -s gets no extra s."}, {"q": "Is 'skolbok' en or ett? (answer en/ett)", "a": "en", "why": "The last part, bok, is an en-word."}]}, {"id": "grupp", "title": "The five verb groups", "level": "A2", "hook": "You will be able to build the past tense of most Swedish verbs correctly, because you will know which of the five groups a verb belongs to. That turns random-looking endings into a system.", "steps": [{"h": "Why verbs come in groups", "t": "Swedish verbs follow a few patterns, called <b>groups<\/b> (<i>grupp 1, 2, 3, 4<\/i>). The <b>stem<\/b> of a verb is the infinitive with the final -a removed: <i>spela<\/i> → stem <i>spel<\/i>, <i>stänga<\/i> → stem <i>stäng<\/i>. Each group adds different endings to the stem. The clue to the group is the ending you see: -ar in the present means group 1, -er means group 2 or 4, a bare -r means group 3. The past tense then confirms it."}, {"h": "Group 1: the big, easy group", "t": "Group 1 is by far the largest group, and new verbs from other languages almost always join it. Pattern: <b>-ar<\/b> (now), <b>-ade<\/b> (past), <b>-at<\/b> (have): <i>spela, spelar, spelade, spelat<\/i>. Also <i>laga, lagar, lagade, lagat<\/i> and <i>jobba, jobbar, jobbade, jobbat<\/i>. There are no exceptions to worry about: even a stem ending in p or k, like <i>hoppa<\/i>, still gives <i>hoppade<\/i>."}, {"h": "Group 2: -de or -te", "t": "Group 2 verbs have <b>-er<\/b> in the present. In the past they add <b>-de<\/b> or <b>-te<\/b>, and in the supinum <b>-t<\/b>. To choose, look at the last letter of the stem. If it is <b>k, p, s, t or x<\/b> (sounds made without your voice box, so they are called voiceless) use <b>-te<\/b>: <i>köp → köpte, läs → läste, tänk → tänkte, res → reste<\/i>. Otherwise use <b>-de<\/b>: <i>stäng → stängde, ring → ringde, bygg → byggde<\/i>."}, {"h": "Group 3: the short verbs", "t": "Group 3 verbs are short and already end in a vowel, such as <i>bo<\/i> (live), <i>tro<\/i> (believe), <i>sy<\/i> (sew) and <i>nå<\/i> (reach). The present is just <b>-r<\/b>, the past is <b>-dde<\/b> and the supinum is <b>-tt<\/b>: <i>bo, bor, bodde, bott<\/i>. There are not many of them, but they are very common."}, {"h": "Group 4: vowel changes", "t": "Group 4 verbs do not add -de or -te. Instead the vowel inside the verb changes in the past, and the supinum often ends in -it or -tt: <i>skriva, skriver, skrev, skrivit<\/i>. There is no rule that predicts the new vowel, so you must learn each verb as a set of forms, preferably out loud. The good news is that the common ones show up again and again, so they stick quickly."}, {"h": "Detective method for a new verb", "t": "Look at the present tense in the dictionary. -ar? Group 1: add -ade. -er? It is group 2 (check the last letter of the stem for k, p, s, t, x) or group 4 if the dictionary shows a vowel change. Just -r, and the verb is short with a vowel at the end? Group 3: -dde. If you are not sure, a group 1 guess is right more often than any other, and Swedes will still understand you."}], "tables": [{"caption": "The five groups", "head": ["Group", "nu", "igår", "har ...", "example"], "rows": [["1", "-ar", "-ade", "-at", "spelar → spelade → spelat"], ["2a", "-er", "-de", "-t", "stänger → stängde → stängt"], ["2b", "-er", "-te", "-t", "köper → köpte → köpt"], ["3", "-r", "-dde", "-tt", "bor → bodde → bott"], ["4", "-er / -r", "vowel change", "often -it", "skriver → skrev → skrivit"]]}, {"caption": "-de or -te? Check the last letter of the stem", "head": ["Stem ends in", "Ending", "Example"], "rows": [["k, p, s, t, x", "<b>-te<\/b>", "köp → köp<b>te<\/b>, läs → läs<b>te<\/b>"], ["anything else", "<b>-de<\/b>", "stäng → stäng<b>de<\/b>, ring → ring<b>de<\/b>"]]}, {"caption": "Common group 4 verbs", "head": ["infinitiv", "presens", "preteritum", "supinum"], "rows": [["skriva", "skriver", "skrev", "skrivit"], ["dricka", "dricker", "drack", "druckit"], ["springa", "springer", "sprang", "sprungit"], ["äta", "äter", "åt", "ätit"], ["komma", "kommer", "kom", "kommit"], ["ta", "tar", "tog", "tagit"]]}], "examples": [["Hon spelade piano hela eftermiddagen.", "She played the piano all afternoon."], ["Barnen byggde ett högt torn av klossar.", "The children built a tall tower out of blocks."], ["Pappa köpte bröd och mjölk i affären.", "Dad bought bread and milk at the shop."], ["Jag läste tidningen medan jag åt frukost.", "I read the paper while I ate breakfast."], ["De bodde i Lund när jag var liten.", "They lived in Lund when I was little."], ["Hon trodde att bussen var försenad.", "She thought that the bus was late."], ["Igår skrev jag ett kort till min kusin.", "Yesterday I wrote a card to my cousin."], ["Min lillebror drack upp all saft själv.", "My little brother drank all the squash himself."], ["Vi har lagat middag tillsammans hela veckan.", "We have cooked dinner together all week."], ["Hunden sprang fort genom parken.", "The dog ran fast through the park."]], "mistakes": [{"wrong": "Igår skrivde jag ett brev.", "right": "Igår skrev jag ett brev.", "why": "English speakers want to add an ending, as in 'walked'. Strong verbs (group 4) change the vowel instead: skriva, skrev."}, {"wrong": "Pappa köpade en tidning.", "right": "Pappa köpte en tidning.", "why": "Only group 1 uses -ade. Köpa is group 2 and its stem ends in p, so it takes -te."}, {"wrong": "Vi boade i Malmö.", "right": "Vi bodde i Malmö.", "why": "Bo is a short group 3 verb: the past is -dde, not -ade."}, {"wrong": "Han stängte dörren.", "right": "Han stängde dörren.", "why": "The stem stäng ends in g, which is not one of k, p, s, t, x, so the ending is -de."}], "trick": "K-P-S-T-X: 'Kiss Pretty Soft Teddy bears eXtra' - if the stem ends in one of these letters, the past gets -te.", "check": [{"q": "Past tense of spela:", "a": "spelade", "why": "Group 1 adds -ade."}, {"q": "Past tense of läsa (stem läs):", "a": "läste", "why": "The stem ends in s, so -te."}, {"q": "Past tense of stänga:", "a": "stängde", "why": "The stem ends in g, so -de."}, {"q": "Past tense of bo:", "a": "bodde", "why": "Group 3 uses -dde."}, {"q": "Supinum of skriva: Jag har ___ ett brev.", "a": "skrivit", "why": "Group 4: skriva, skrev, skrivit."}]}, {"id": "hos", "title": "Hem or hemma? Going there versus being there", "level": "B1", "hook": "You will be able to choose between pairs like hem and hemma, hit and här, till and hos. English lets one word do both jobs, and Swedish does not, so learning this will make your sentences sound clearly Swedish.", "steps": [{"h": "Moving or staying?", "t": "In English <i>home<\/i> works for both <i>I am going home<\/i> and <i>I am at home<\/i>. Swedish uses two different words depending on whether something is <b>moving<\/b> (going to a place) or <b>staying<\/b> (being in a place). <i>Jag går <b>hem<\/b>.<\/i> (movement) versus <i>Jag är <b>hemma<\/b>.<\/i> (position). The key skill is to ask yourself: is somebody travelling, or just sitting still?"}, {"h": "The basic pairs: hem, hit, dit and where", "t": "The same split exists for <i>here<\/i> and <i>there<\/i>. <b>Hit<\/b> means <i>to here<\/i> and <b>här<\/b> means <i>here<\/i>: <i>Kom <b>hit<\/b>!<\/i> versus <i>Jag är <b>här<\/b>.<\/i> <b>Dit<\/b> means <i>to there<\/i> and <b>där<\/b> means <i>there<\/i>: <i>Vi åker <b>dit<\/b>.<\/i> versus <i>Vi bor <b>där<\/b>.<\/i> Questions also split: <b>vart<\/b> asks about movement (<i>Vart går du?<\/i>) and <b>var<\/b> asks about position (<i>Var är du?<\/i>). In everyday speech many people use <i>var<\/i> for both."}, {"h": "In, out, up, down, away", "t": "The same idea works for the direction words. Movement: <b>in<\/b> (into), <b>ut<\/b> (out), <b>upp<\/b> (up), <b>ner<\/b> (down), <b>bort<\/b> (away). Position: <b>inne<\/b> (inside), <b>ute<\/b> (outside), <b>uppe<\/b> (up), <b>nere<\/b> (down), <b>borta<\/b> (away, gone). <i>Hon går <b>ut<\/b>.<\/i> versus <i>Hon är <b>ute<\/b>.<\/i> Handy pattern: the staying words end in <b>-e<\/b> or <b>-a<\/b> (<i>inne, ute, uppe, nere, borta, hemma<\/i>), while the moving words are short and snappy."}, {"h": "Going to a person: till and hos", "t": "With people the split is <b>till<\/b> for movement and <b>hos<\/b> for position. <i>Jag går <b>till<\/b> Leo.<\/i> (I am going to Leo's.) <i>Jag är <b>hos<\/b> Leo.<\/i> (I am at Leo's place.) <b>Hos<\/b> also works for professionals: <i>hos tandläkaren<\/i> (at the dentist's) and <i>hos frisören<\/i> (at the hairdresser's). English has no single word for <i>hos<\/i>, so you have to remember it. <i>Från<\/i> (from) is used for leaving: <i>Jag kommer från Leo.<\/i>"}, {"h": "Let the verb help you", "t": "The verb often tells you which word you need. Verbs of movement, like <i>gå<\/i> (walk or go), <i>åka<\/i> (travel), <i>springa<\/i> (run), <i>komma<\/i> (come) and <i>flytta<\/i> (move), go with the movement words (<i>hem, hit, dit, in, ut<\/i>). Verbs of staying, like <i>vara<\/i> (be), <i>bo<\/i> (live), <i>sitta<\/i> (sit), <i>ligga<\/i> (lie) and <i>stanna<\/i> (stay), go with the position words (<i>hemma, här, där, inne, ute<\/i>). <i>Stanna hemma!<\/i> means <i>Stay at home!<\/i>, because you are staying."}], "tables": [{"caption": "Movement (going to) versus position (being at)", "head": ["Movement →", "Position •"], "rows": [["Jag går <b>hem<\/b>.", "Jag är <b>hemma<\/b>."], ["Kom <b>hit<\/b>!", "Jag är <b>här<\/b>."], ["Vi åker <b>dit<\/b>.", "Vi bor <b>där<\/b>."], ["Hon går <b>ut<\/b>.", "Hon är <b>ute<\/b>."], ["Han går <b>in<\/b>.", "Han är <b>inne<\/b>."], ["Katten klättrar <b>upp<\/b>.", "Katten är <b>uppe<\/b>."], ["Boken åker <b>ner<\/b>.", "Boken är <b>nere<\/b>."], ["Jag går <b>till<\/b> Leo.", "Jag är <b>hos<\/b> Leo."]]}, {"caption": "Verbs and the words they like", "head": ["Verbs of movement", "Verbs of staying"], "rows": [["<i>gå, åka, springa, komma, flytta<\/i>", "<i>vara, bo, sitta, ligga, stanna<\/i>"], ["→ <b>hem, hit, dit, in, ut<\/b>", "→ <b>hemma, här, där, inne, ute<\/b>"]]}], "examples": [["Jag går hem när lektionen är slut.", "I go home when the lesson is over."], ["Mormor är hemma och bakar bullar.", "Grandma is at home baking buns."], ["Kom hit, så visar jag dig något!", "Come here, and I will show you something!"], ["Vi har bott där i många år.", "We have lived there for many years."], ["Ska du åka dit i sommar?", "Are you going to go there this summer?"], ["Hunden är ute i trädgården just nu.", "The dog is outside in the garden right now."], ["Vill du följa med ut och cykla?", "Do you want to come outside and cycle?"], ["Jag sover hos Leo på lördag.", "I am sleeping at Leo's on Saturday."], ["Imorgon går vi till farmor och farfar.", "Tomorrow we are going to Grandma and Grandpa's."], ["Katten är uppe på skåpet, så jag klättrar upp.", "The cat is up on the cupboard, so I climb up."]], "mistakes": [{"wrong": "Jag går hemma efter skolan.", "right": "Jag går hem efter skolan.", "why": "You are travelling, so you need <i>hem<\/i>. <i>Hemma<\/i> is only for being at home. English <i>home<\/i> covers both."}, {"wrong": "Kom här!", "right": "Kom hit!", "why": "<i>Kom<\/i> is a movement verb, so you need the movement word <i>hit<\/i>, not <i>här<\/i>."}, {"wrong": "Jag är till Leo i kväll.", "right": "Jag är hos Leo i kväll.", "why": "Being at someone's place is <i>hos<\/i>. <i>Till<\/i> means going toward."}, {"wrong": "Kom inne, det regnar!", "right": "Kom in, det regnar!", "why": "Coming means movement, so <i>in<\/i>. <i>Inne<\/i> is for being inside."}], "trick": "The staying words are lazy and end in <b>-e<\/b> or <b>-a<\/b> (<i>inne, ute, uppe, nere, hemma<\/i>), while the moving words are short and snappy (<i>in, ut, upp, ner, hem<\/i>). And <b>hos<\/b> means at the home of someone.", "check": [{"q": "Kom ___ till mig! (here, movement)", "a": "hit", "why": "<i>Kom<\/i> shows movement, so use <i>hit<\/i>."}, {"q": "Jag är ___ nu. (at home)", "a": "hemma", "why": "Position, not movement."}, {"q": "Vi sover ___ mormor i helgen. (at Grandma's)", "a": "hos", "why": "At a person's place."}, {"q": "Barnen leker ___ i trädgården. (outside, position)", "a": "ute", "why": "Position word with <i>-e<\/i>."}, {"q": "Vi ska åka ___ i sommar. (there, movement)", "a": "dit", "why": "Movement toward there."}]}, {"id": "idiom", "title": "Swedish idioms: sayings with a hidden meaning", "level": "C1", "hook": "You will learn what an idiom is, how to read Swedish ones, and ten to fifteen of the most useful sayings, including cows on ice. They make you sound natural, and they stop you being confused when Swedes say something that makes no sense word for word.", "steps": [{"h": "What is an idiom?", "t": "An <b>idiom<\/b> is a fixed saying whose meaning is not found by adding up the words. English has plenty: 'it's raining cats and dogs' has nothing to do with animals, it means heavy rain. Swedish has its own set, and they mostly come from farms, food, animals and weather."}, {"h": "Learn the whole phrase, not the parts", "t": "If you translate an idiom word by word you will get something funny but useless. <i>Det är ingen ko på isen<\/i> is literally 'there is no cow on the ice', and it means 'no problem, nothing to worry about' (a cow on ice would be an emergency). So treat each idiom as one long word. Learn the meaning together with a picture: a cow on the ice, a shrimp sandwich, an ice cube in your stomach."}, {"h": "The wording is fixed", "t": "You cannot change the words. You say <i>på isen<\/i> (with the ending -en), not 'på is', and <i>kasta in handduken<\/i>, not 'a towel'. Body parts and familiar things usually take the <b>definite<\/b> ending (the ending that means 'the', like -en, -n or -arna): <i>hålla tummarna<\/i> (keep your thumbs, not 'your own thumbs'). So copy the phrase exactly, including these little endings."}, {"h": "When to use them", "t": "Idioms live mostly in relaxed speech and informal writing. A few well-timed ones sound lively and natural. A lot of them in a row sound odd, and in very formal writing they are usually out of place. Aim for one idiom in the right moment, with the right tone, rather than many."}, {"h": "Twins and strangers", "t": "Some Swedish idioms have an English twin: <i>ta med en nypa salt<\/i> is 'take with a pinch of salt', and <i>slå två flugor i en smäll<\/i> is 'kill two birds with one stone' (but with flies, and one bang). Others have no English twin at all and you must simply learn them, like <i>glida in på en räkmacka<\/i> (glide in on a shrimp sandwich = have life easy). Spotting twins makes the first group quick to learn."}], "tables": [{"caption": "Favourites to learn first", "head": ["Swedish idiom", "Word by word", "Real meaning"], "rows": [["<b>Det är ingen ko på isen<\/b>", "there is no cow on the ice", "no problem, no rush"], ["<b>Glida in på en räkmacka<\/b>", "glide in on a shrimp sandwich", "have it easy, get something without effort"], ["<b>Ta det med en nypa salt<\/b>", "take it with a pinch of salt", "do not take it too seriously"], ["<b>Ha is i magen<\/b>", "have ice in the stomach", "keep calm under pressure"], ["<b>Kasta in handduken<\/b>", "throw in the towel", "give up"], ["<b>Inte för allt smör i Småland<\/b>", "not for all the butter in Småland", "not for anything, never"], ["<b>Skägget i brevlådan<\/b>", "the beard in the letterbox", "caught in an awkward spot"], ["<b>Ont krut förgås inte så lätt<\/b>", "bad gunpowder does not perish easily", "bad things last (or: troublemakers survive)"]]}, {"caption": "More everyday sayings", "head": ["Swedish idiom", "Meaning"], "rows": [["<b>Hålla tummarna<\/b>", "keep your fingers crossed"], ["<b>Vara ute och cykla<\/b>", "be completely wrong, be way off"], ["<b>Bita i det sura äpplet<\/b>", "do the unpleasant thing you must do"], ["<b>Slå två flugor i en smäll<\/b>", "kill two birds with one stone"], ["<b>Det ligger en hund begraven<\/b>", "there is something fishy going on"]]}], "examples": [["Ingen brådska, det är ingen ko på isen, vi hinner gott.", "No rush, it is no problem, we have plenty of time."], ["Hon fick jobbet direkt och gled in på en räkmacka.", "She got the job right away and had it easy."], ["Ta det han säger med en nypa salt, han överdriver ofta.", "Take what he says with a pinch of salt, he often exaggerates."], ["Trots all stress behöll hon lugnet och hade is i magen.", "Despite all the stress she stayed calm and kept a cool head."], ["Efter tre förlorade matcher ville han kasta in handduken.", "After three lost matches he wanted to throw in the towel."], ["Jag håller tummarna för dig inför provet i morgon!", "I am keeping my fingers crossed for you for the test tomorrow!"], ["Du är helt ute och cyklar, mötet är på torsdag, inte onsdag.", "You are totally off, the meeting is on Thursday, not Wednesday."], ["Vi måste bita i det sura äpplet och städa hela garaget.", "We have to bite the bullet and clean the whole garage."], ["Jag slog två flugor i en smäll och handlade på vägen hem.", "I killed two birds with one stone and did the shopping on the way home."], ["Inte för allt smör i Småland skulle jag hoppa från tian.", "Not for anything would I jump from the ten-metre diving board."]], "mistakes": [{"wrong": "Det är ingen ko på is.", "right": "Det är ingen ko på isen.", "why": "The idiom is frozen with the definite ending <i>-en<\/i>. Changing small details makes it sound wrong to Swedes."}, {"wrong": "Jag håller mina tummar för dig.", "right": "Jag håller tummarna för dig.", "why": "English says 'my thumbs'. Swedish uses the definite form (<i>tummarna<\/i>) for body parts when it is clear whose they are."}, {"wrong": "Han kastade in en handduk.", "right": "Han kastade in handduken.", "why": "It is a fixed phrase with <i>handduken<\/i> (the towel). Say it exactly as the idiom has it."}, {"wrong": "Ta det med lite salt.", "right": "Ta det med en nypa salt.", "why": "Do not shorten or reword idioms: the full phrase is <i>en nypa salt<\/i> (a pinch of salt)."}], "trick": "Turn each idiom into a silly cartoon in your head: a cow standing calmly on a frozen lake means 'no worries'. The odder the picture, the better you will remember the meaning, and the picture reminds you of the exact words.", "check": [{"q": "Det är ingen ___ på isen. (no problem)", "a": "ko", "why": "The cow on the ice: <i>ingen ko på isen<\/i>."}, {"q": "Ha ___ i magen. (keep calm)", "a": "is", "why": "<i>ha is i magen<\/i>, with no article."}, {"q": "Han ville kasta in ___. (give up)", "a": "handduken", "why": "<i>kasta in handduken<\/i>, definite form."}, {"q": "Jag håller ___ för dig! (fingers crossed)", "a": "tummarna", "why": "Body part in the definite form: <i>hålla tummarna<\/i>."}, {"q": "What does 'glida in på en räkmacka' mean?", "a": "to have it easy, to get something without effort", "why": "Nothing to do with food: a shrimp sandwich is an easy ride."}]}, {"id": "imper", "title": "Orders, infinitive and modal verbs", "level": "A2", "hook": "You will be able to give an instruction ('Come here!'), say what you can, want, must or are allowed to do, and know when to use att. These are the most useful verb tools in everyday Swedish.", "steps": [{"h": "The infinitive", "t": "A <b>verb<\/b> is an action word. Its basic form, the one in the dictionary, is the <b>infinitiv<\/b>, the 'to ...' form: <i>spela<\/i> (to play), <i>gå<\/i> (to go), <i>komma<\/i> (to come). It usually ends in <i>-a<\/i> (or another vowel like <i>-å<\/i>, <i>-o<\/i>). The little word <b>att<\/b> is Swedish 'to' in front of it: <i>att spela<\/i>."}, {"h": "Giving an order: the imperative", "t": "The <b>imperativ<\/b> is the form for orders, advice and instructions. For most verbs just cut off the final <i>-a<\/i>: <i>skriva<\/i> becomes <i>skriv!<\/i>, <i>stänga<\/i> becomes <i>stäng!<\/i>, <i>komma<\/i> becomes <i>kom!<\/i>. Verbs that end in a vowel other than -a keep it: <i>gå!<\/i>, <i>bo!<\/i>. A group of verbs (like <i>spela, laga, titta<\/i>) keep the -a: <i>Spela!<\/i>, <i>Titta!<\/i>. For 'do not', add <i>inte<\/i> after: <i>Stäng inte dörren!<\/i> Add <i>snälla<\/i> (please) to be polite."}, {"h": "Modal verbs: can, want, must...", "t": "A <b>modal verb<\/b> is a helper that adds a feeling: ability, wish, duty, permission. The main ones are <b>kan<\/b> (can, know how), <b>vill<\/b> (want), <b>ska<\/b> (shall, will, is supposed to), <b>måste<\/b> (must), <b>får<\/b> (may, am allowed) and <b>brukar<\/b> (usually do). They look the same for all people (<i>jag kan, hon kan, vi kan<\/i>), and the next verb goes in the infinitive <b>without att<\/b>: <i>Jag kan simma<\/i>."}, {"h": "Position of inte", "t": "In a normal sentence <i>inte<\/i> goes right after the modal: <i>Jag kan inte komma<\/i>, <i>Du får inte röka här<\/i>, <i>Vi måste inte gå<\/i> (we do not have to go). Be careful: <i>får inte<\/i> means 'not allowed', while <i>måste inte<\/i> means 'do not need to'."}, {"h": "When you need att", "t": "Use <b>att<\/b> before the infinitive in most other cases: after adjectives (<i>Det är kul att dansa<\/i>), after verbs like <i>glömma<\/i> (forget), <i>lova<\/i> (promise) and <i>tycka om<\/i> (like), and after prepositions (<i>för att<\/i> = in order to, <i>utan att<\/i> = without). Quick test: if the verb before is kan, vill, ska, måste, får or brukar, there is no att."}], "tables": [{"caption": "Making the imperative", "head": ["Infinitive", "Order", "English"], "rows": [["skriva", "skriv!", "write!"], ["stänga", "stäng!", "close!"], ["komma", "kom!", "come!"], ["gå", "gå!", "go!"], ["vara", "var!", "be!"], ["spela", "spela!", "play!"], ["titta", "titta!", "look!"]]}, {"caption": "Modal verbs", "head": ["Verb", "Meaning", "Example"], "rows": [["kan", "can / know how to", "Jag <b>kan<\/b> cykla."], ["vill", "want to", "Hon <b>vill<\/b> resa."], ["ska", "will / is going to / supposed to", "Vi <b>ska<\/b> äta nu."], ["måste", "must / have to", "Du <b>måste<\/b> sova."], ["får", "may / is allowed to", "Barn <b>får<\/b> vara med."], ["brukar", "usually does", "Han <b>brukar<\/b> stiga upp tidigt."]]}], "examples": [["Kom hit och hjälp mig!", "Come here and help me!"], ["Var snäll och stäng fönstret.", "Please close the window."], ["Rör inte den, den är varm!", "Do not touch it, it is hot!"], ["Jag kan inte komma på mötet imorgon.", "I cannot come to the meeting tomorrow."], ["Vill du dricka te eller kaffe?", "Do you want to drink tea or coffee?"], ["Man måste visa biljetten vid dörren.", "You have to show your ticket at the door."], ["Här får man inte parkera.", "You are not allowed to park here."], ["Jag brukar ta bussen till jobbet.", "I usually take the bus to work."], ["Det är roligt att lära sig nya ord.", "It is fun to learn new words."], ["Hon glömde att stänga av lampan.", "She forgot to turn off the lamp."], ["Vi ska träffas klockan fem.", "We are meeting at five."], ["Han gick ut utan att säga hej.", "He went out without saying hello."]], "mistakes": [{"wrong": "Jag kan att simma.", "right": "Jag kan simma.", "why": "After kan, vill, ska, måste, får and brukar there is no att."}, {"wrong": "Jag älskar läsa böcker.", "right": "Jag älskar att läsa böcker.", "why": "After most other verbs and after adjectives you need att."}, {"wrong": "Du måste går nu.", "right": "Du måste gå nu.", "why": "After a modal the next verb is the plain infinitive, with no ending."}, {"wrong": "Stänga dörren, tack!", "right": "Stäng dörren, tack!", "why": "For an order you cut off the final -a: stäng, not stänga."}], "trick": "Six helpers (kan, vill, ska, måste, får, brukar) take a bare verb: no att, no ending. Everything else you check: usually att.", "check": [{"q": "Imperative of 'skriva':", "a": "skriv", "why": "Drop the final -a."}, {"q": "Du måste ___ nu. (gå / går)", "a": "gå", "why": "Infinitive after a modal."}, {"q": "Det är roligt ___ simma.", "a": "att", "why": "After an adjective you need att."}, {"q": "Jag ___ inte komma ikväll. (can)", "a": "kan", "why": "Modal verb for ability."}, {"q": "Man ___ inte röka här. (is not allowed)", "a": "får", "why": "får inte = not allowed."}, {"q": "Jag ___ ta bussen. (usually do)", "a": "brukar", "why": "brukar = usually."}]}, {"id": "indef", "title": "Some, no one, all: någon, ingen, alla", "level": "B1", "hook": "You will be able to talk about people and things in general, 'someone', 'nobody' and 'everything', without knowing exactly who or what. These little words make you sound natural.", "steps": [{"h": "man: 'you' or 'people' in general", "t": "<b>Man<\/b> means 'people in general' or 'you' when you do not mean one particular person: <i>Man får inte röka här<\/i> (You may not smoke here). It is only used as the doer of a sentence. Do not confuse it with <i>en man<\/i> (a man, a male person) or <i>mannen<\/i> (the man)."}, {"h": "någon, något, några: some / any", "t": "These words say 'some' or 'any' and must match what they describe. <b>Någon<\/b> goes with an <i>en<\/i>-word (<i>någon bil<\/i>), <b>något<\/b> with an <i>ett<\/i>-word (<i>något hus<\/i>), and <b>några<\/b> with plurals (<i>några bilar<\/i>). On their own, <i>någon<\/i> means 'someone' and <i>något<\/i> means 'something': <i>Någon ringde<\/i>, <i>Jag har något åt dig<\/i>."}, {"h": "ingen, inget, inga: no / none", "t": "The negative family works the same way: <b>ingen<\/b> (en-words), <b>inget<\/b> (ett-words), <b>inga<\/b> (plurals). <i>Jag har ingen bil<\/i> means 'I have no car'. Do not add <i>inte<\/i> as well: Swedish does not say 'I do not have no car'. Alone, <i>ingen<\/i> means 'nobody' and <i>inget<\/i> means 'nothing'."}, {"h": "all, alla, allt and varje", "t": "<b>Alla<\/b> is 'all of them' and goes with plurals: <i>alla barn<\/i>. <b>Allt<\/b> means 'everything' on its own: <i>Allt är bra<\/i>. Before a single thing that you cannot count it changes to <b>all<\/b> (<i>all mat<\/i>), <b>allt<\/b> (<i>allt vatten<\/i>) or <b>alla<\/b> and goes in front of the <i>the<\/i>-form: <i>all maten<\/i>, <i>allt vattnet<\/i>. <b>Varje<\/b> means 'every' or 'each', never changes, and is followed by a single thing: <i>varje dag<\/i>, <i>varje barn<\/i>."}, {"h": "vissa: some, but not all", "t": "<b>Vissa<\/b> means 'certain' or 'some' in the sense of 'only some, not all'. It is always plural: <i>Vissa människor gillar kyla<\/i> (Some people like cold). Compare <i>några människor<\/i>, which just means 'a few' without the idea that others are different."}], "tables": [{"caption": "Some, no, all: which form?", "head": ["Meaning", "en-word (en bil)", "ett-word (ett hus)", "plural"], "rows": [["some / any", "någon", "något", "några"], ["no / none", "ingen", "inget", "inga"], ["all / the whole", "all", "allt", "alla"], ["every / each", "varje", "varje", "-"]]}, {"caption": "On their own (no noun after)", "head": ["Word", "Meaning", "Example"], "rows": [["man", "you / people", "<b>Man<\/b> äter middag sent i Spanien."], ["någon", "someone", "<b>Någon<\/b> knackar på dörren."], ["något", "something", "Jag vill säga <b>något<\/b>."], ["ingen", "nobody", "<b>Ingen<\/b> är hemma."], ["inget", "nothing", "Jag ser <b>inget<\/b>."], ["allt", "everything", "<b>Allt<\/b> är klart."]]}], "examples": [["Man behöver ett pass för att resa till Turkiet.", "You need a passport to travel to Turkey."], ["Har du några frågor?", "Do you have any questions?"], ["Det finns något gott i kylen.", "There is something tasty in the fridge."], ["Någon har glömt sin jacka här.", "Someone has forgotten their jacket here."], ["Jag har ingen aning om var nyckeln är.", "I have no idea where the key is."], ["Vi har inget bröd kvar, men vi har inga bullar heller.", "We have no bread left, and no buns either."], ["Ingen visste svaret på frågan.", "Nobody knew the answer to the question."], ["Alla barn i klassen fick en bok.", "All the children in the class got a book."], ["Hon har ätit upp all maten och allt godis.", "She has eaten all the food and all the sweets."], ["Varje morgon dricker han en stor kopp kaffe.", "Every morning he drinks a big cup of coffee."], ["Vissa dagar är jag väldigt trött.", "Some days I am very tired."], ["Vissa gillar jul, andra står inte ut med den.", "Some like Christmas, others cannot stand it."]], "m
