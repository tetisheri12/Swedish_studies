istakes": [{"wrong": "Jag har inte inga pengar.", "right": "Jag har inga pengar.", "why": "<i>Inga<\/i> already says 'no'. Adding <i>inte<\/i> makes a double negative."}, {"wrong": "Vi behöver någon vatten.", "right": "Vi behöver något vatten.", "why": "<i>Vatten<\/i> is an ett-word, so you need <i>något<\/i>, not <i>någon<\/i>."}, {"wrong": "Alla maten var god.", "right": "All maten var god.", "why": "With one single, uncountable thing you use <i>all<\/i> (<i>allt<\/i> for an ett-word), not <i>alla<\/i>."}, {"wrong": "Varje dagar går jag ut.", "right": "Varje dag går jag ut.", "why": "<i>Varje<\/i> is always followed by a single thing, never a plural."}], "trick": "Pick the family by the noun: en-word = någon / ingen / all, ett-word = något / inget / allt, plural = några / inga / alla. Varje never changes and is always followed by one thing.", "check": [{"q": "Är ___ hemma? (anyone)", "a": "någon", "why": "Used alone as a person: någon."}, {"q": "Jag ser ___ hus här. (no)", "a": "inget", "why": "Hus is an ett-word, so inget."}, {"q": "Vi har ___ katter. (no, plural)", "a": "inga", "why": "Plural: inga."}, {"q": "___ dag går vi på promenad. (every)", "a": "Varje", "why": "Varje never changes."}, {"q": "Hon bjöd ___ sina vänner. (all of)", "a": "alla", "why": "Plural 'all of them' is alla."}, {"q": "I Sverige får ___ ta ledigt på midsommarafton. (people in general)", "a": "man", "why": "Man means 'one' or 'people in general'."}]}, {"id": "inte", "title": "Where does inte go?", "level": "A2", "hook": "You will be able to make Swedish sentences negative (say what you do <i>not<\/i> do) and put <i>inte<\/i> in the right spot every time. No “do not” helper is needed, which makes it easier than English.", "steps": [{"h": "What inte does", "t": "<b>Inte<\/b> means “not”. You use it to turn a sentence around: <i>Jag spelar tennis<\/i> (I play tennis) becomes <i>Jag spelar <b>inte<\/b> tennis<\/i> (I do not play tennis). Notice that Swedish does not need “do”. English says “I do not play”, but Swedish just says “I play not”."}, {"h": "The basic rule: inte comes right after the verb", "t": "A <b>verb<\/b> is an action word, like <i>spelar<\/i> (plays) or <i>äter<\/i> (eats). In a normal sentence, <i>inte<\/i> goes straight after the verb: <i>Jag <b>spelar inte<\/b> tennis. Hon <b>äter inte<\/b> fisk.<\/i> A good way to remember it is to find the verb first, then put <i>inte<\/i> behind it."}, {"h": "Two verbs: inte goes after the first one", "t": "Many sentences have two verbs, such as <i>vill äta<\/i> (wants to eat) or <i>har sett<\/i> (has seen). <i>Inte<\/i> goes after the <b>first<\/b> verb, so it ends up between the two: <i>Hon vill <b>inte<\/b> äta fisk.<\/i> <i>Vi har <b>inte<\/b> sett filmen.<\/i> The second verb stays together with the rest of the sentence."}, {"h": "When the subject comes after the verb", "t": "The <b>subject<\/b> is the person or thing that does the action. Sometimes the subject comes after the verb, for example when the sentence starts with a time word, like in <i>Idag regnar det<\/i> (see the word-order lesson). Then <i>inte<\/i> comes after the subject: <i>Idag regnar det <b>inte<\/b>. I morgon ska vi <b>inte<\/b> träna.<\/i> The same happens in questions: <i>Spelar du <b>inte<\/b> fotboll?<\/i> (Don’t you play football?)."}, {"h": "A small warning for later", "t": "In small extra sentences that start with words like <i>att<\/i> (that) or <i>om<\/i> (if), <i>inte<\/i> goes <b>before<\/b> the verb: <i>Jag vet att läraren <b>inte<\/b> kommer idag.<\/i> You do not need to master this yet, but it is good to notice it when you read."}], "tables": [{"caption": "Where inte stands", "head": ["Situation", "Example"], "rows": [["One verb", "Jag <b>spelar inte<\/b> tennis."], ["Two verbs", "Hon <b>vill inte<\/b> äta fisk."], ["Has + verb", "Vi <b>har inte<\/b> sett filmen."], ["Subject after verb", "Idag <b>regnar det inte<\/b>."], ["Question", "<b>Förstår du inte<\/b> frågan?"]]}, {"caption": "English versus Swedish", "head": ["English", "Swedish"], "rows": [["I do not play tennis", "Jag spelar <b>inte<\/b> tennis"], ["She does not want to eat fish", "Hon vill <b>inte<\/b> äta fisk"], ["We have not seen the film", "Vi har <b>inte<\/b> sett filmen"]]}], "examples": [["Jag gillar inte fisk till middag.", "I don't like fish for dinner."], ["Hon spelar inte piano längre.", "She doesn't play the piano any more."], ["Vi har inte sett den nya filmen än.", "We haven't seen the new film yet."], ["Idag regnar det inte.", "It isn't raining today."], ["I morgon ska vi inte träna.", "Tomorrow we are not going to train."], ["Han kan inte simma, men han lär sig.", "He can't swim, but he is learning."], ["Min bror äter inte kött.", "My brother doesn't eat meat."], ["Förstår du inte frågan?", "Don't you understand the question?"], ["På söndagar går jag inte i skolan.", "On Sundays I don't go to school."], ["Jag vet att läraren inte kommer idag.", "I know that the teacher isn't coming today."]], "mistakes": [{"wrong": "Jag inte spelar tennis.", "right": "Jag spelar inte tennis.", "why": "In English “not” sits before the main verb (“I do not play”). In Swedish <i>inte<\/i> follows the verb."}, {"wrong": "Jag gör inte spela tennis.", "right": "Jag spelar inte tennis.", "why": "There is no “do not” in Swedish. Use the normal verb and add <i>inte<\/i> after it."}, {"wrong": "Idag inte regnar det.", "right": "Idag regnar det inte.", "why": "The subject (<i>det<\/i>) comes after the verb here, so <i>inte<\/i> goes after the subject."}, {"wrong": "Vi har sett inte filmen.", "right": "Vi har inte sett filmen.", "why": "With two verbs, <i>inte<\/i> goes after the <b>first<\/b> one (<i>har<\/i>)."}], "trick": "Find the verb, then put <i>inte<\/i> right behind it. If the subject follows the verb, <i>inte<\/i> goes behind the subject. Swedish never says “do not”.", "check": [{"q": "Add inte: Jag äter fisk.", "a": "Jag äter inte fisk.", "why": "Inte goes right after the verb."}, {"q": "Add inte: Hon vill äta fisk.", "a": "Hon vill inte äta fisk.", "why": "Inte goes after the first verb."}, {"q": "Add inte: Imorgon ska vi träna.", "a": "Imorgon ska vi inte träna.", "why": "The subject (vi) follows the verb, so inte goes after vi."}, {"q": "Add inte: Vi har sett filmen.", "a": "Vi har inte sett filmen.", "why": "After the first verb (har)."}, {"q": "Say: I don't play tennis.", "a": "Jag spelar inte tennis.", "why": "No “do”, and inte follows the verb."}]}, {"id": "komp", "title": "Bra, bättre, bäst: comparing things", "level": "B1", "hook": "You'll be able to say that something is bigger, faster or best, and to compare two things with <i>än<\/i>. You'll use this every day to describe, choose and argue about things.", "steps": [{"h": "Three levels of an adjective", "t": "An adjective is a describing word, like fast, big or good. Each one has three levels. The <b>positive<\/b> is the plain word (fast). The <b>komparativ<\/b> (comparative) compares two things (faster). The <b>superlativ<\/b> (superlative) picks out the top one (fastest). English adds -er and -est, and Swedish does almost the same."}, {"h": "The regular pattern: -are and -ast", "t": "Most adjectives just add <b>-are<\/b> and <b>-ast<\/b>: <i>snabb, snabbare, snabbast<\/i>. To say 'than' use <b>än<\/b>: <i>Leo är längre än jag<\/i> (Leo is taller than me). The comparative looks the same for en-words, ett-words and plurals: <i>en större hund, ett större hus, större hundar<\/i>. No extra endings to worry about."}, {"h": "Irregular ones and vowel changes", "t": "Some very common adjectives change their vowel or become a different word, just like English good, better, best. <i>stor<\/i> becomes <b>större, störst<\/b> (the o turns into ö). Learn these by heart: <b>bra, bättre, bäst<\/b>; <b>dålig, sämre, sämst<\/b>; <b>gammal, äldre, äldst<\/b>; <b>liten, mindre, minst<\/b>. Also <i>lång, längre, längst<\/i> and <i>hög, högre, högst<\/i>."}, {"h": "The superlative: with and without den", "t": "After <i>är<\/i> (is) the superlative stays short: <b>Hon är snabbast.<\/b> Right before a noun you need <b>den / det / de<\/b> and the ending <b>-aste<\/b>, and the noun gets its 'the' form too: <b>den snabbaste pojken<\/b>, <b>det största huset<\/b>, <b>de bästa kompisarna<\/b>. For adverbs (words describing how someone does something) use the short form: <i>Han springer snabbast.<\/i>"}, {"h": "Many, much and long words", "t": "For countable things use <b>fler / flest<\/b> (many): <i>fler vänner<\/i>. For things you can't count use <b>mer / mest<\/b> (much): <i>mer tid<\/i>. Some adjectives take <b>mer / mest<\/b> in front instead of an ending, especially those ending in <i>-isk<\/i> and ones like <i>spännande<\/i>: <i>mer spännande, mest spännande<\/i>. For 'as ... as' use <b>lika ... som<\/b>: <i>lika snabb som du<\/i>."}], "tables": [{"caption": "Comparing adjectives", "head": ["Plain", "Comparative", "Superlative", "With den"], "rows": [["snabb", "snabb<b>are<\/b>", "snabb<b>ast<\/b>", "den snabb<b>aste<\/b>"], ["stor", "st<b>ö<\/b>rre", "st<b>ö<\/b>rst", "den största"], ["bra", "bättre", "bäst", "den bästa"], ["dålig", "sämre", "sämst", "den sämsta"], ["gammal", "äldre", "äldst", "den äldsta"], ["liten", "mindre", "minst", "den minsta"], ["många", "fler", "flest", "(no den form)"], ["mycket", "mer", "mest", "(no den form)"]]}, {"caption": "Which pattern?", "head": ["Situation", "Pattern", "Example"], "rows": [["two things", "comparative + <b>än<\/b>", "<i>Tåget är snabbare än bussen.<\/i>"], ["equal", "<b>lika<\/b> + plain + <b>som<\/b>", "<i>Hon är lika lång som jag.<\/i>"], ["after <i>är<\/i>", "short superlative", "<i>Hon är snabbast.<\/i>"], ["before a noun", "<b>den<\/b> + -aste + noun", "<i>den snabbaste pojken<\/i>"]]}], "examples": [["Min kusin är äldre än jag men yngre än min bror.", "My cousin is older than me but younger than my brother."], ["Det här är det bästa pizzastället i hela stan.", "This is the best pizza place in the whole town."], ["Ett lejon är starkare än en hund.", "A lion is stronger than a dog."], ["Mount Everest är det högsta berget i världen.", "Mount Everest is the highest mountain in the world."], ["Jag har fler kompisar i klassen än i fotbollslaget.", "I have more friends in class than on the football team."], ["Hon åt mest glass av alla på kalaset.", "She ate the most ice cream of everyone at the party."], ["Tåget går snabbare än bussen men det är dyrare.", "The train is faster than the bus but it is more expensive."], ["Den här boken är mer spännande än filmen.", "This book is more exciting than the film."], ["Det var den sämsta dagen i hela veckan.", "It was the worst day of the whole week."], ["Hon är lika duktig som sin storasyster.", "She is as skilled as her big sister."]], "mistakes": [{"wrong": "Leo är mer snabb än jag.", "right": "Leo är snabbare än jag.", "why": "English uses 'more' with long words, but short Swedish adjectives take the ending -are."}, {"wrong": "Han är längre som jag.", "right": "Han är längre än jag.", "why": "'Than' is än. The word som is only used with lika ('as ... as')."}, {"wrong": "Jag har mer vänner än du.", "right": "Jag har fler vänner än du.", "why": "Friends can be counted, so use fler. Mer is for things you can't count, like time."}, {"wrong": "Han är den snabbast pojken.", "right": "Han är den snabbaste pojken.", "why": "After den and before a noun the superlative needs the ending -aste."}], "trick": "<b>-are<\/b> = -er and <b>-ast<\/b> = -est. For the top one in front of a noun, add an <b>e<\/b> and the word <b>den<\/b>: <i>den snabbaste<\/i>. And <b>än<\/b> is 'than': the n is the same as in 'than'.", "check": [{"q": "Elefanten är ___ än musen. (stor)", "a": "större", "why": "stor becomes större (o turns into ö)."}, {"q": "Det här är det ___ huset på gatan. (liten, superlative)", "a": "minsta", "why": "liten, mindre, minst, and det minsta before a noun."}, {"q": "Jag har ___ böcker än du. (many)", "a": "fler", "why": "Countable things use fler."}, {"q": "Leo springer ___ i klassen. (snabb, the most)", "a": "snabbast", "why": "Short superlative with an adverb, no den."}, {"q": "bra, ___, bäst", "a": "bättre", "why": "Irregular: bra, bättre, bäst."}]}, {"id": "kond", "title": "Om jag vore...: if and would", "level": "B1", "hook": "You'll be able to talk about dreams and things that didn't happen ('If I had money, I would...'), and ask for things politely. This is how you sound natural when you imagine, regret or request.", "steps": [{"h": "Sentences about what isn't real", "t": "We sometimes talk about things that are not true, only imagined: 'If I had a dog, I would walk it every day.' A verb is an action word, and the form of the verb used for imagined things is called the conditional. In Swedish you need just two little words. <b>om<\/b> means 'if' and <b>skulle<\/b> means 'would'."}, {"h": "Dreams about now or the future", "t": "The recipe is <b>om + hade<\/b> (the if-part) and <b>skulle + infinitive<\/b> (the result). The infinitive is the basic form of a verb, like <i>köpa<\/i> (to buy). Example: <b>Om jag hade pengar, skulle jag köpa en hund.<\/b> Notice that after the comma the verb comes first: <i>skulle jag<\/i>, not <i>jag skulle<\/i>. Swedish wants the verb in second place in the sentence, and the whole if-part counts as place one."}, {"h": "Vore: a special 'were'", "t": "For 'were' Swedish has the special form <b>vore<\/b>: <i>Om jag vore rik, skulle jag resa jorden runt.<\/i> It sounds a bit more careful than everyday speech. In normal talk many people simply say <i>Om jag var rik...<\/i>, and you will hear both. For other verbs, such as <i>kunna<\/i> (can), you just use the normal past form: <i>Om jag kunde flyga...<\/i>."}, {"h": "What didn't happen in the past", "t": "To talk about the past ('If I had trained, we would have won') use <b>hade<\/b> in both halves, and the supine in the second. The supine is the form you use after <i>har<\/i> or <i>hade<\/i>: <i>tränat, vunnit<\/i>. So: <b>Om jag hade tränat, hade vi vunnit.<\/b> You can also say <i>skulle ha vunnit<\/i> in the result part. Do not put <i>skulle<\/i> in the if-part, and never use the infinitive after <i>hade<\/i>."}, {"h": "Skulle for being polite", "t": "<b>Skulle<\/b> also makes requests softer, just like English 'would'. <i>Jag skulle vilja ha en glass<\/i> sounds nicer than <i>Jag vill ha en glass<\/i>. <i>Skulle du kunna hjälpa mig?<\/i> means 'Would you be able to help me?'. Finally, <i>skulle<\/i> is used when you tell what you expected earlier: <i>Jag trodde att det skulle regna<\/i> (I thought it would rain)."}], "tables": [{"caption": "Three kinds of sentences", "head": ["Situation", "Pattern", "Example"], "rows": [["Dream, now or later", "<b>om<\/b> + hade / vore, <b>skulle<\/b> + infinitive", "<i>Om jag hade pengar, skulle jag köpa en hund.<\/i>"], ["Past, didn't happen", "<b>hade<\/b> + supine, <b>hade<\/b> + supine", "<i>Om jag hade tränat, hade vi vunnit.<\/i>"], ["Polite request", "<b>skulle<\/b> + vilja / kunna", "<i>Skulle du kunna hjälpa mig?<\/i>"]]}, {"caption": "The key words", "head": ["Swedish", "English", "Remember"], "rows": [["<b>om<\/b>", "if", "starts the dream"], ["<b>hade<\/b>", "had", "if-part (also past dreams)"], ["<b>skulle<\/b>", "would", "result part"], ["<b>vore<\/b>", "were", "special form of vara"]]}], "examples": [["Om jag hade mer tid, skulle jag lära mig gitarr.", "If I had more time, I would learn guitar."], ["Om det vore sommar, skulle vi bada i sjön.", "If it were summer, we would swim in the lake."], ["Om jag hade tränat mer, hade jag vunnit loppet.", "If I had trained more, I would have won the race."], ["Skulle du kunna hjälpa mig med läxan?", "Would you be able to help me with the homework?"], ["Jag skulle gärna vilja ha en glass, tack.", "I would really like an ice cream, please."], ["Om vi hade haft en hund, hade vi gått längre promenader.", "If we had had a dog, we would have gone on longer walks."], ["Om hon hade vetat det, skulle hon ha ringt dig.", "If she had known it, she would have called you."], ["Vad skulle du göra om du vore osynlig?", "What would you do if you were invisible?"], ["Jag trodde att det skulle regna, men solen sken.", "I thought it would rain, but the sun was shining."], ["Om jag kunde flyga, skulle jag besöka alla länder.", "If I could fly, I would visit every country."]], "mistakes": [{"wrong": "Om jag skulle ha pengar, skulle jag köpa en bil.", "right": "Om jag hade pengar, skulle jag köpa en bil.", "why": "English speakers want 'would' in the if-part. In Swedish the if-part uses hade, and only the result gets skulle."}, {"wrong": "Om jag hade pengar, jag skulle köpa en hund.", "right": "Om jag hade pengar, skulle jag köpa en hund.", "why": "After the if-part the verb must come first, so skulle goes before jag."}, {"wrong": "Om jag hade tränat, hade vi vinna.", "right": "Om jag hade tränat, hade vi vunnit.", "why": "After hade you need the supine (vunnit), not the basic form."}, {"wrong": "Vi skulle vunnit matchen.", "right": "Vi skulle ha vunnit matchen.", "why": "Skulle needs ha before the supine in careful writing."}], "trick": "Swedish mirrors English dreams: <b>hade<\/b> = had, <b>skulle<\/b> = would. For things in the past, say <b>hade ... hade<\/b>, a double hade, and then the supine: <i>hade tränat, hade vunnit<\/i>.", "check": [{"q": "Om jag ___ pengar, skulle jag köpa en hund.", "a": "hade", "why": "The if-part of a dream uses hade."}, {"q": "Om jag hade pengar, ___ jag köpa en hund.", "a": "skulle", "why": "The result part uses skulle and puts it before jag."}, {"q": "Om vi hade tränat, ___ vi vunnit.", "a": "hade", "why": "A past dream is hade + supine in both halves."}, {"q": "___ du kunna hjälpa mig? (polite)", "a": "Skulle", "why": "Skulle makes a request polite."}, {"q": "Om det ___ sommar nu, skulle vi bada.", "a": "vore", "why": "vore is the special 'were' (var is also heard in speech)."}]}, {"id": "konj", "title": "Linking words: och, men, så, eftersom", "level": "B1", "hook": "You will be able to join two ideas into one sentence and know which linking words change the word order and which do not. It is the difference between sounding like a list of short sentences and sounding fluent.", "steps": [{"h": "What a linking word does", "t": "A <b>clause<\/b> is a chunk of language with a subject (who or what does something) and a verb (an action word like <i>play<\/i> or <i>go<\/i>). <i>Jag är trött<\/i> is one clause. A linking word (a <b>conjunction<\/b>) glues two clauses together, like <i>and<\/i>, <i>but<\/i> or <i>because<\/i> in English. Swedish has two kinds of linking words, and they behave differently."}, {"h": "The five flat linkers: och, men, eller, för, så", "t": "These five join two <b>main clauses<\/b>, meaning two clauses that could each stand alone as a full sentence. After them, nothing changes: you just keep the normal order, subject first and then the verb. <i>Jag är trött, men jag spelar ändå.<\/i> (I am tired, but I play anyway.) Note that <b>för<\/b> here means <i>because<\/i>, and <b>så<\/b> means <i>so<\/i>: <i>Det regnar, så vi stannar inne.<\/i>"}, {"h": "The tail-makers: eftersom, när, om, att …", "t": "The second group makes a <b>subordinate clause<\/b> (Swedish: <b>bisats<\/b>), which is a clause that cannot stand alone and hangs onto the main clause like a tail. The common ones are <b>att<\/b> (that), <b>eftersom<\/b> (because), <b>när<\/b> (when), <b>om<\/b> (if or whether), <b>fast<\/b> (although), <b>medan<\/b> (while), <b>innan<\/b> (before), <b>tills<\/b> (until) and <b>därför att<\/b> (because). Inside this tail the word order is special: little words like <i>inte<\/i> jump in front of the verb, so you say <i>eftersom jag <b>inte<\/b> var sjuk<\/i>."}, {"h": "Two ways to say because", "t": "Swedish gives you two choices. <b>För<\/b> is a flat linker, so the order stays normal: <i>Jag stannade hemma, för jag var sjuk.<\/i> <b>Eftersom<\/b> starts a tail, so the order changes when you add <i>inte<\/i>: <i>Jag stannade hemma eftersom jag inte var frisk.<\/i> In writing and careful speech <i>eftersom<\/i> is the safer, more common choice, and <i>för<\/i> sounds a bit more casual."}, {"h": "Finer points", "t": "<b>Om<\/b> means <i>if<\/i> (<i>Om det regnar …<\/i>) but also <i>whether<\/i> (<i>Jag vet inte om han kommer<\/i>). <b>Fast<\/b> and <b>fastän<\/b> mean <i>although<\/i>, and <b>medan<\/b> means <i>while<\/i> or <i>whereas<\/i>. Do not mix up <b>därför<\/b> (an adverb meaning <i>therefore<\/i>, which causes the verb to come next: <i>Därför kom jag sent<\/i>) with <b>därför att<\/b> (a tail-maker meaning <i>because<\/i>). When a tail clause comes first in the sentence, the main verb follows it directly: <i>Eftersom jag var sjuk, stannade jag hemma.<\/i>"}], "tables": [{"caption": "Flat linkers: normal word order afterwards", "head": ["Word", "Meaning", "Example"], "rows": [["<b>och<\/b>", "and", "<i>Jag läser och han skriver.<\/i>"], ["<b>men<\/b>", "but", "<i>Jag vill, men jag kan inte.<\/i>"], ["<b>eller<\/b>", "or", "<i>Tar du te eller kaffe?<\/i>"], ["<b>för<\/b>", "because", "<i>Jag sov, för jag var trött.<\/i>"], ["<b>så<\/b>", "so", "<i>Det regnar, så vi är inne.<\/i>"]]}, {"caption": "Tail-makers: the clause that follows is a bisats", "head": ["Word", "Meaning", "Example"], "rows": [["<b>att<\/b>", "that", "<i>Jag tror att du har rätt.<\/i>"], ["<b>eftersom<\/b>", "because", "<i>…eftersom jag inte hade tid.<\/i>"], ["<b>när<\/b>", "when", "<i>…när det blir mörkt.<\/i>"], ["<b>om<\/b>", "if / whether", "<i>…om han inte kommer.<\/i>"], ["<b>fast<\/b>", "although", "<i>…fast hon var trött.<\/i>"], ["<b>medan<\/b>", "while", "<i>…medan vi åt.<\/i>"], ["<b>innan / tills<\/b>", "before / until", "<i>…innan du går.<\/i>"]]}], "examples": [["Jag vill gå ut, men det regnar just nu.", "I want to go out, but it is raining right now."], ["Vi stannade hemma eftersom Lisa var sjuk.", "We stayed home because Lisa was ill."], ["Det regnade, så vi lekte inne hela dagen.", "It rained, so we played inside all day."], ["Vill du ha te eller kaffe till frukosten?", "Do you want tea or coffee for breakfast?"], ["Jag åt middag medan han tittade på tv.", "I ate dinner while he watched TV."], ["Ring mig innan du går hemifrån i morgon.", "Call me before you leave home tomorrow."], ["Hon gick till skolan fast hon var trött.", "She went to school although she was tired."], ["Jag vet att du är duktig på att simma.", "I know that you are good at swimming."], ["Om det är soligt imorgon cyklar vi till sjön.", "If it is sunny tomorrow, we will cycle to the lake."], ["Vi väntar här tills bussen kommer klockan tre.", "We wait here until the bus comes at three."]], "mistakes": [{"wrong": "Jag stannade hemma eftersom jag var inte frisk.", "right": "Jag stannade hemma eftersom jag inte var frisk.", "why": "<i>Eftersom<\/i> starts a tail clause, so <i>inte<\/i> goes before the verb. In English the order never changes, so this is easy to forget."}, {"wrong": "Eftersom jag var sjuk, jag stannade hemma.", "right": "Eftersom jag var sjuk stannade jag hemma.", "why": "The whole tail clause counts as the first piece of the sentence, so the main verb must come right after it."}, {"wrong": "Jag var sjuk, därför jag stannade hemma.", "right": "Jag var sjuk, så jag stannade hemma. / Jag var sjuk, därför stannade jag hemma.", "why": "<i>Därför<\/i> is not a linker, it is an adverb, so the verb must follow it. For a real linker use <i>så<\/i> or <i>därför att<\/i>."}, {"wrong": "Jag tror om han kommer.", "right": "Jag tror att han kommer.", "why": "<i>Att<\/i> means <i>that<\/i>. <i>Om<\/i> only means <i>if<\/i> or <i>whether<\/i>, so it fits after words like <i>undra<\/i> or <i>undra<\/i>."}], "trick": "Think of five flat little words, <b>och, men, eller, för, så<\/b>: after them the sentence just carries on as normal. Every other linking word builds a tail, and inside the tail <i>inte<\/i> sneaks in front of the verb.", "check": [{"q": "Det regnar, ___ vi stannar inne. (so)", "a": "så", "why": "<i>Så<\/i> is a flat linker meaning so, followed by normal order."}, {"q": "Jag stannade hemma ___ jag var sjuk. (because, starts a tail clause)", "a": "eftersom", "why": "<i>Eftersom<\/i> means because and begins a bisats."}, {"q": "Vill du ha glass ___ kaka? (or)", "a": "eller", "why": "<i>Eller<\/i> joins two choices."}, {"q": "Jag vet ___ du är hungrig. (that)", "a": "att", "why": "<i>Att<\/i> introduces what you know."}, {"q": "Fix the order: Jag är glad eftersom jag har inte ont längre.", "a": "Jag är glad eftersom jag inte har ont längre.", "why": "Inside the tail clause <i>inte<\/i> comes before the verb."}]}, {"id": "lagga", "title": "Ligger or lägger? Being there versus putting it there", "level": "B2", "hook": "You will be able to choose correctly between står/ställer, ligger/lägger and sitter/sätter. English gets by with 'is' and 'put', but Swedish insists on saying how things are placed, so these six verbs are used every single day.", "steps": [{"h": "Two ideas: 'it is there' and 'I put it there'", "t": "English often says 'the book <i>is<\/i> on the table' and 'I <i>put<\/i> the book on the table'. Swedish is more picky. There are two families of verbs. One family says <b>where something is<\/b> (a position). The other says <b>that somebody moves it there<\/b> (an action). Each family has three members, chosen by how the thing is placed: standing, lying or sitting."}, {"h": "The position verbs: står, ligger, sitter", "t": "Use <b>står<\/b> for things that stand upright on their base: glasses, bottles, cars, people on their feet. Use <b>ligger<\/b> for things lying flat: books, phones, papers, a person or cat in bed. Use <b>sitter<\/b> for things fixed or attached: a picture on the wall, a button on a shirt, a hat on a head, a person on a chair. These verbs have no thing being moved: Glaset <b>står<\/b> på bordet."}, {"h": "The action verbs: ställer, lägger, sätter", "t": "The action verbs need an <b>object<\/b>, which is the thing that you move (<i>glaset<\/i>, <i>boken<\/i>). Jag <b>ställer<\/b> glaset på bordet. Jag <b>lägger<\/b> boken på bordet. Jag <b>sätter<\/b> tavlan på väggen. The pairs match: what <i>står<\/i> after the action is something you <i>ställer<\/i>; what <i>ligger<\/i> is something you <i>lägger<\/i>; what <i>sitter<\/i> is something you <i>sätter<\/i>."}, {"h": "Yourself as the object", "t": "You can move yourself too, with <i>mig<\/i>. <b>Jag lägger mig<\/b> = I lie down. <b>Jag sätter mig<\/b> = I sit down. <b>Jag ställer mig<\/b> = I stand up / go and stand. Then you are <b>ligger / sitter / står<\/b> afterwards: Jag <b>sitter<\/b> på stolen. Clothes use <b>sätta på<\/b>: Jag <b>sätter på mig<\/b> mössan = I put my hat on."}, {"h": "The forms (both families are irregular-looking)", "t": "Position verbs are strong and change their vowel: <b>står, stod, stått<\/b>; <b>ligger, låg, legat<\/b>; <b>sitter, satt, suttit<\/b>. Action verbs are regular-ish: <b>ställer, ställde, ställt<\/b>; <b>lägger, lade (or <i>la<\/i>), lagt<\/b>; <b>sätter, satte, satt<\/b>. Watch out: <i>satt<\/i> is both 'sat' (from <i>sitta<\/i>) and 'put' in <i>har satt<\/i>. The helper word decides: <i>Han satt här<\/i> (sat), <i>Han har satt boken här<\/i> (has put)."}], "tables": [{"caption": "The two families", "head": ["Where it IS (position)", "Past / perfect", "You PUT it (action)", "Past / perfect"], "rows": [["<b>står<\/b>", "stod / har stått", "<b>ställer<\/b>", "ställde / har ställt"], ["<b>ligger<\/b>", "låg / har legat", "<b>lägger<\/b>", "lade (la) / har lagt"], ["<b>sitter<\/b>", "satt / har suttit", "<b>sätter<\/b>", "satte / har satt"]]}, {"caption": "What goes with which", "head": ["Thing", "Position", "Action"], "rows": [["glass, bottle, car, bike", "<i>står<\/i>", "<i>ställer<\/i>"], ["book, phone, paper, a person in bed", "<i>ligger<\/i>", "<i>lägger<\/i>"], ["picture on a wall, button, hat, a person on a chair", "<i>sitter<\/i>", "<i>sätter<\/i>"]]}], "examples": [["Boken ligger på bordet, men jag ser inte min penna.", "The book is on the table, but I can't see my pen."], ["Jag lägger boken på bordet innan vi äter middag.", "I put the book on the table before we eat dinner."], ["Glaset står på hyllan bredvid de blå tallrikarna.", "The glass is on the shelf next to the blue plates."], ["Kan du ställa glaset i skåpet när du är klar?", "Can you put the glass in the cupboard when you are done?"], ["Tavlan sitter på väggen över soffan.", "The picture hangs on the wall above the sofa."], ["Jag sätter mig här bredvid dig om det går bra.", "I'll sit down here next to you if that's alright."], ["Katten ligger i soffan och sover hela dagen.", "The cat lies on the sofa and sleeps all day."], ["Hon la nyckeln i väskan och gick ut.", "She put the key in the bag and went out."], ["Han stod vid dörren och väntade på sin kompis.", "He stood by the door and waited for his friend."], ["Ställ skorna i hallen och häng jackan på kroken.", "Put the shoes in the hall and hang the jacket on the hook."]], "mistakes": [{"wrong": "Boken lägger på bordet.", "right": "Boken ligger på bordet.", "why": "Nobody is moving the book, it simply is there. A position needs <b>ligger<\/b>. <i>Lägger<\/i> needs somebody doing it."}, {"wrong": "Jag ligger boken på bordet.", "right": "Jag lägger boken på bordet.", "why": "There is an object (<i>boken<\/i>) being moved, so you need the action verb <b>lägger<\/b>."}, {"wrong": "Hon satte bilen i garaget.", "right": "Hon ställde bilen i garaget.", "why": "Cars, like glasses, <i>stå<\/i>. English 'put' or 'set' makes people use <i>sätta<\/i> for everything."}, {"wrong": "Jag sitter på mig mössan.", "right": "Jag sätter på mig mössan.", "why": "Putting on clothes is an action, so <b>sätter<\/b>. <i>Sitter<\/i> only describes where something already is."}], "trick": "Look for the letter ä: lägger, ställer, sätter all contain ä, and ä = action. The verbs without ä (ligger, står, sitter) just describe where something is.", "check": [{"q": "Telefonen ___ på bordet. (it is lying there)", "a": "ligger", "why": "A position, flat on the table."}, {"q": "Jag ___ glaset på bordet. (I put it there; it will stand)", "a": "ställer", "why": "An action with an object that stands upright."}, {"q": "Tavlan ___ på väggen. (it hangs there)", "a": "sitter", "why": "A position, attached to something."}, {"q": "Jag ___ mig i soffan. (I sit down)", "a": "sätter", "why": "Moving yourself into a sitting position uses sätter + mig."}, {"q": "Vi har ___ nycklarna i lådan. (we have put, the lie-family)", "a": "lagt", "why": "The perfect form of lägga is lagt."}]}, {"id": "ordbild", "title": "Building words: Swedish word Lego", "level": "C1", "hook": "You will learn the small pieces (o-, -het, -ning, -bar, -lös and friends) that Swedish sticks onto words. With them you can understand hundreds of new words at a glance and even build correct ones yourself.", "steps": [{"h": "Words are built from pieces", "t": "Swedish loves to build words from smaller parts. A <b>prefix<\/b> is a piece stuck on the front of a word, and a <b>suffix<\/b> is a piece stuck on the end. English does it too: <i>un<\/i>-happy, kind-<i>ness<\/i>, eat-<i>able<\/i>, hope-<i>less<\/i>. Once you know the Swedish pieces, a word like <i>hopplöshet<\/i> is no longer scary: hopp + lös + het."}, {"h": "The negative prefix o-", "t": "The piece <b>o-<\/b> turns a word into its opposite, like English 'un-': <i>ärlig<\/i> (honest) becomes <i>oärlig<\/i>, <i>möjlig<\/i> (possible) becomes <i>omöjlig<\/i>, <i>tydlig<\/i> (clear) becomes <i>otydlig<\/i>. Be careful though: you cannot put o- on every word. Not all opposites work this way (the opposite of <i>glad<\/i> is <i>ledsen<\/i>, not 'oglad'), so check in a dictionary before inventing one."}, {"h": "Suffixes that make nouns", "t": "A <b>noun<\/b> is a naming word for a thing or idea. <b>-het<\/b> turns an adjective (a describing word) into a noun for the quality: <i>fri<\/i> to <i>frihet<\/i>, <i>säker<\/i> to <i>säkerhet<\/i>, <i>ärlig<\/i> to <i>ärlighet<\/i>. <b>-ning<\/b> turns a verb into a noun for the action: <i>tävla<\/i> to <i>tävling<\/i>, <i>öppna<\/i> to <i>öppning<\/i>. Drop the -a of the verb before adding it. <b>-skap<\/b> gives a state or group: <i>vän<\/i> to <i>vänskap<\/i>, <i>land<\/i> to <i>landskap<\/i>. <b>-are<\/b> names a person who does something: <i>spela<\/i> to <i>spelare<\/i>. All of -het, -ning and -are words are <i>en<\/i>-words; -skap words can be <i>en<\/i> or <i>ett<\/i>, so learn the gender (<i>en vänskap<\/i>, <i>ett landskap<\/i>)."}, {"h": "Suffixes that make adjectives", "t": "<b>-bar<\/b> means 'can be done': <i>äta<\/i> to <i>ätbar<\/i> (edible), <i>läsa<\/i> to <i>läsbar<\/i> (readable). <b>-lös<\/b> means 'without': <i>hopp<\/i> to <i>hopplös<\/i>, <i>hem<\/i> to <i>hemlös<\/i>. Sometimes an extra <i>s<\/i> joins the parts: <i>arbete<\/i> + s + <i>lös<\/i> = <i>arbetslös<\/i>. <b>-ig<\/b> means 'having the quality of': <i>sol<\/i> to <i>solig<\/i> (sunny), <i>smuts<\/i> to <i>smutsig<\/i> (dirty), <i>regn<\/i> to <i>regnig<\/i> (rainy)."}, {"h": "Stack the pieces", "t": "You can stack pieces to make longer words: <i>hopp<\/i> (hope), <i>hopplös<\/i> (hopeless), <i>hopplöshet<\/i> (hopelessness). Or <i>äta<\/i>, <i>ätbar<\/i>, <i>oätbar<\/i> (inedible). Read from the inside out: start with the base word, then add one piece at a time and let each one change the meaning or the word type. Finally, check the pieces have not been used in a way that Swedish does not allow: if you are unsure, look the new word up."}], "tables": [{"caption": "The main building blocks", "head": ["Piece", "What it does", "Example"], "rows": [["<b>o-<\/b>", "not, opposite", "<i>ärlig<\/i> to <b>o<\/b><i>ärlig<\/i>, <i>möjlig<\/i> to <b>o<\/b><i>möjlig<\/i>"], ["<b>-het<\/b> (en)", "adjective to noun (quality)", "<i>fri<\/i> to <i>fri<\/i><b>het<\/b>, <i>säker<\/i> to <i>säker<\/i><b>het<\/b>"], ["<b>-ning<\/b> (en)", "verb to noun (action)", "<i>tävla<\/i> to <i>tävl<\/i><b>ing<\/b>, <i>öppna<\/i> to <i>öppn<\/i><b>ing<\/b>"], ["<b>-bar<\/b>", "can be done", "<i>äta<\/i> to <i>ät<\/i><b>bar<\/b>, <i>läsa<\/i> to <i>läs<\/i><b>bar<\/b>"], ["<b>-lös<\/b>", "without", "<i>hopp<\/i> to <i>hopp<\/i><b>lös<\/b>, <i>arbete<\/i> to <i>arbets<\/i><b>lös<\/b>"], ["<b>-skap<\/b>", "state, group", "<i>vän<\/i> to <i>vän<\/i><b>skap<\/b>, <i>land<\/i> to <i>land<\/i><b>skap<\/b>"], ["<b>-are<\/b> (en)", "person who does it", "<i>spela<\/i> to <i>spel<\/i><b>are<\/b>, <i>lära<\/i> to <i>lär<\/i><b>are<\/b>"], ["<b>-ig<\/b>", "having the quality", "<i>sol<\/i> to <i>sol<\/i><b>ig<\/b>, <i>smuts<\/i> to <i>smuts<\/i><b>ig<\/b>"]]}, {"caption": "Swedish piece and English twin", "head": ["Swedish", "English twin"], "rows": [["<b>o-<\/b>", "un-, in-"], ["<b>-het<\/b>", "-ness"], ["<b>-ning<\/b>", "-ing"], ["<b>-bar<\/b>", "-able"], ["<b>-lös<\/b>", "-less"], ["<b>-skap<\/b>", "-ship"], ["<b>-are<\/b>", "-er"], ["<b>-ig<\/b>", "-y"]]}, {"caption": "One root, many words", "head": ["Word", "Pieces", "Meaning"], "rows": [["<i>hopp<\/i>", "base", "hope"], ["<i>hopplös<\/i>", "hopp + lös", "hopeless"], ["<i>hopplöshet<\/i>", "hopp + lös + het", "hopelessness"], ["<i>spelare<\/i>", "spel + are", "player"], ["<i>läsbar<\/i>", "läs + bar", "readable"]]}], "examples": [["Hans handstil är nästan oläsbar, så jag fick fråga honom.", "His handwriting is almost unreadable, so I had to ask him."], ["Frihet är viktigt för alla barn, men det finns också regler.", "Freedom is important for all children, but there are rules too."], ["Tävlingen i simning börjar klockan tio i morgon förmiddag.", "The swimming competition starts at ten tomorrow morning."], ["Är svampen ätbar, eller är den giftig? Fråga en vuxen!", "Is the mushroom edible, or is it poisonous? Ask an adult!"], ["Han är arbetslös just nu, men han är inte hopplös alls.", "He is unemployed right now, but he is not hopeless at all."], ["Vänskap är något man får genom att vara en bra kompis.", "Friendship is something you get by being a good friend."], ["Landskapet är vackert på hösten, när alla träd är gula.", "The landscape is beautiful in the autumn, when all the trees are yellow."], ["Hon är en duktig spelare och en snäll, tålmodig lärare.", "She is a skilled player and a kind, patient teacher."], ["Det var smutsigt i hallen, så barnen fick ta av stövlarna.", "It was dirty in the hall, so the children had to take off their boots."], ["Ärlighet är viktigare än att alltid ha rätt, tycker många.", "Honesty is more important than always being right, many think."]], "mistakes": [{"wrong": "Det är inmöjligt.", "right": "Det är omöjligt.", "why": "English speakers reach for in-/un-. Swedish uses <b>o-<\/b> for most everyday opposites: <i>omöjlig, oärlig, otydlig<\/i>."}, {"wrong": "Friheten är viktigt.", "right": "Friheten är viktig.", "why": "Words ending in -het are <i>en<\/i>-words, so the describing word takes no -t: <i>viktig<\/i>."}, {"wrong": "Tävlaning börjar nu.", "right": "Tävlingen börjar nu.", "why": "Drop the -a of the verb before -ning: <i>tävla<\/i> to <i>tävling<\/i>. It is an <i>en<\/i>-word, so 'the competition' is <i>tävlingen<\/i>."}, {"wrong": "Han är arbetlös.", "right": "Han är arbetslös.", "why": "Many compounds need a joining <i>s<\/i>: <i>arbete + s + lös<\/i>. There is no rule for every case, so learn it with the word."}], "trick": "Think of Lego bricks and use the English twins: o- = un-, -het = -ness, -ning = -ing, -bar = -able, -lös = -less, -skap = -ship, -are = -er, -ig = -y. If you know the English twin, you can usually decode the Swedish word.", "check": [{"q": "ärlig = honest. 'Not honest' = ___", "a": "oärlig", "why": "o- gives the opposite."}, {"q": "säker (safe) to the noun 'safety': säker___", "a": "säkerhet", "why": "-het turns an adjective into a noun."}, {"q": "tävla (compete) to the noun 'competition': tävl___", "a": "tävling", "why": "Drop the -a, add -ning."}, {"q": "Something that can be eaten: ät___", "a": "ätbar", "why": "-bar = can be done."}, {"q": "A person with no hope is ___ (hopp + ?)", "a": "hopplös", "why": "-lös = without."}]}, {"id": "part", "title": "Participles: stängd and gråtande", "level": "B2", "hook": "You'll be able to turn verbs into describing words: a closed door, a crying boy, an exciting game. It makes your Swedish shorter and more natural, and you'll understand much more of what you read.", "steps": [{"h": "A verb that acts like an adjective", "t": "A verb is an action word, like close or cry. An adjective is a describing word, like big or red. A <b>particip<\/b> (participle) is a verb form used as an adjective: 'a closed door', 'a crying boy'. Swedish has two kinds. The <b>perfect participle<\/b> says something has been done (closed). The <b>present participle<\/b> says something is going on right now (crying)."}, {"h": "Perfect participle: it changes like an adjective", "t": "Like adjectives it has three forms: for en-words, for ett-words, and for plurals or 'the' forms. <i>Dörren är <b>stängd<\/b><\/i> (en-word). <i>Fönstret är <b>stängt<\/b><\/i> (ett-word). <i>Dörrarna är <b>stängda<\/b><\/i> (plural). The same endings work before a noun: <i>den stängda dörren<\/i>. The endings depend on the verb type: <i>målad, målat, målade<\/i>, then <i>köpt, köpt, köpta<\/i>, and the irregular <i>skriven, skrivet, skrivna<\/i>."}, {"h": "How to find the right form", "t": "For most verbs the ett-form is the same as the form after <i>har<\/i>: <i>har stängt<\/i> gives <b>stängt<\/b>, <i>har målat<\/i> gives <b>målat<\/b>, <i>har köpt<\/i> gives <b>köpt<\/b>. Then swap -t for <b>-d<\/b> to get the en-form (<i>stängd<\/i>) and add <b>-a<\/b> for the plural (<i>stängda<\/i>). Verbs like <i>måla<\/i> end in -ad and -ade instead. Strong verbs like <i>skriva<\/i> end in -en / -et / -na and must be learned one by one."}, {"h": "Present participle: -ande or -ende", "t": "For something happening now, take the verb and add <b>-ande<\/b>: <i>skratta<\/i> (laugh) becomes <b>skrattande<\/b>, <i>gråta<\/i> becomes <b>gråtande<\/b>, <i>spännande<\/i> means exciting. Short verbs ending in a vowel without -a add <b>-ende<\/b>: <i>gå<\/i> becomes <i>gående<\/i>, <i>stå<\/i> becomes <i>stående<\/i>. The best news: this form never changes. <i>en skrattande tjej, ett skrattande barn, skrattande tjejer<\/i>."}, {"h": "Don't copy English -ing", "t": "English uses '-ing' everywhere: 'I am running'. Swedish does not use the present participle that way. 'I am running' is just <b>Jag springer<\/b>. Use the participle only as a describing word before a noun (<i>en springande hund<\/i>), or after words like <i>kom<\/i> (came): <i>Han kom springande<\/i> (He came running). With <i>har<\/i> you use the supine, not the participle: <i>Jag har stängt dörren.<\/i>"}], "tables": [{"caption": "Perfect participle", "head": ["Verb", "en-word", "ett-word", "plural / the"], "rows": [["stänga", "stängd", "stängt", "stängda"], ["måla", "målad", "målat", "målade"], ["köpa", "köpt", "köpt", "köpta"], ["skriva", "skriven", "skrivet", "skrivna"]]}, {"caption": "Present participle (never changes)", "head": ["Verb", "Participle", "Example"], "rows": [["skratta", "skratt<b>ande<\/b>", "<i>en skrattande tjej<\/i>"], ["gråta", "gråt<b>ande<\/b>", "<i>en gråtande pojke<\/i>"], ["spänna", "spänn<b>ande<\/b>", "<i>ett spännande spel<\/i>"], ["gå", "gå<b>ende<\/b>", "<i>gående trafik<\/i>"]]}], "examples": [["Dörren är stängd, så vi kan inte gå in.", "The door is closed, so we can't go in."], ["Fönstret är stängt eftersom det är kallt ute.", "The window is closed because it is cold outside."], ["Alla dörrarna är stängda på natten.", "All the doors are closed at night."], ["Den målade väggen i köket är min favorit.", "The painted wall in the kitchen is my favourite."], ["Jag älskar nybakade kanelbullar med varm mjölk.", "I love freshly baked cinnamon buns with warm milk."], ["Den gråtande pojken fick en kram av sin mamma.", "The crying boy got a hug from his mum."], ["Ett spännande spel väntar på oss efter skolan.", "An exciting game is waiting for us after school."], ["Boken är skriven av en känd svensk författare.", "The book is written by a famous Swedish author."], ["Vi hörde skrattande barn på lekplatsen.", "We heard laughing children at the playground."], ["Det borttappade kortet låg under soffan hela tiden.", "The lost card was under the sofa the whole time."]], "mistakes": [{"wrong": "Fönstret är stängd.", "right": "Fönstret är stängt.", "why": "Fönster is an ett-word, so the participle gets -t, just like an adjective."}, {"wrong": "Dörrarna är stängd.", "right": "Dörrarna är stängda.", "why": "Plural needs -da, so the participle agrees with the noun."}, {"wrong": "den stängd dörren", "right": "den stängda dörren", "why": "After den / det / de the participle takes the 'the' ending, -a."}, {"wrong": "Jag är springande.", "right": "Jag springer.", "why": "Swedish doesn't use -ande for 'am doing'. Use the normal present tense."}], "trick": "For most verbs: <b>har stängt → stängt<\/b> (ett), swap -t for <b>-d<\/b> (en), add <b>-a<\/b> (plural). And <b>-ande<\/b> is the Swedish '-ing' but only as a describing word, and it never changes.", "check": [{"q": "Dörren (an en-word) är ___ . (stänga)", "a": "stängd", "why": "En-word gets -d."}, {"q": "Fönstret är ___ . (stänga)", "a": "stängt", "why": "Ett-word gets -t."}, {"q": "Dörrarna är ___ . (stänga)", "a": "stängda", "why": "Plural gets -da."}, {"q": "en ___ pojke (gråta, happening now)", "a": "gråtande", "why": "Present participle: -ande, never changes."}, {"q": "Brevet är ___ . (skriva, ett-word)", "a": "skrivet", "why": "Strong verb: skriven / skrivet / skrivna."}]}, {"id": "partikel", "title": "Partikelverb: verbs with a small word that changes everything", "level": "B2", "hook": "You will be able to recognise and use the Swedish version of 'give up', 'turn off' and 'come up with'. These verb-plus-small-word pairs are everywhere in everyday talk, and getting the word order right makes you sound much more fluent.", "steps": [{"h": "What a particle verb is", "t": "A <b>particle<\/b> is a short word like <i>upp<\/i>, <i>på<\/i>, <i>ut<\/i>, <i>med<\/i> or <i>av<\/i> that sits after the verb and changes its meaning. In English these are phrasal verbs: 'give up', 'turn off', 'come up with'. Swedish has the same thing: <b>ge upp<\/b>, <b>stänga av<\/b>, <b>komma på<\/b>. You cannot work out the meaning from the parts: <i>ge<\/i> is 'give' and <i>upp<\/i> is 'up', yet <i>ge upp<\/i> is 'quit'. So learn each one as one chunk, particle included."}, {"h": "The particle is stressed", "t": "In speech the particle carries the emphasis: ge UPP, hålla MED, komma PÅ. That is how you tell it apart from a normal preposition (a small word that links a verb to a place or noun). Compare: Jag sitter <i>på<\/i> stolen (<i>på<\/i> is weak, it is a preposition) with Jag sätter <b>PÅ<\/b> musiken (<i>på<\/i> is strong, it is a particle, meaning 'turn on'). If the little word is stressed and changes the meaning, it is part of the verb."}, {"h": "Word order: the particle stays glued to the verb", "t": "In English you can say 'turn it off', splitting the verb from the particle. Swedish does not split them. The particle stays right behind the verb, and the object comes after it: Jag stänger <b>av<\/b> datorn. Jag stänger <b>av<\/b> den. Not <i>stänger den av<\/i>. When you add <i>inte<\/i>, it goes before the particle: Jag ger <b>inte<\/b> upp. Ge <b>inte<\/b> upp! The same applies in the past: Jag gav upp."}, {"h": "One verb, many particles", "t": "The same verb with a different particle gives a different meaning. <b>ta upp<\/b> = bring up, <b>ta av<\/b> = take off, <b>ta med<\/b> = bring along, <b>ta bort<\/b> = remove. So never learn the verb alone: <i>komma<\/i> is just 'come', but <i>komma på<\/i> is 'think of / remember', <i>komma ut<\/i> is 'come out'. Another useful family: <i>stänga av<\/i> (turn off) against <i>sätta på<\/i> (turn on)."}, {"h": "Small differences from English", "t": "Some particle verbs have a word in the middle in English but not in Swedish: <b>se ut<\/b> works like 'look' and the adjective goes between: Du ser trött <b>ut<\/b>. Some Swedish particle verbs look like English ones but use a different small word: English 'come up with an idea' is <b>komma på<\/b> en idé (not <i>komma upp med<\/i>). And <b>tycka om<\/b> = 'like', while <i>tycka<\/i> alone means 'think'. Always check the particle."}], "tables": [{"caption": "Useful particle verbs", "head": ["Swedish", "English", "Example"], "rows": [["<b>hålla med<\/b>", "agree", "<i>Jag håller med dig.<\/i>"], ["<b>ge upp<\/b>", "give up", "<i>Ge inte upp!<\/i>"], ["<b>komma på<\/b>", "think of, remember", "<i>Jag kom på en idé.<\/i>"], ["<b>känna igen<\/b>", "recognise", "<i>Jag känner igen sången.<\/i>"], ["<b>stänga av / sätta på<\/b>", "turn off / turn on", "<i>Stäng av lampan.<\/i>"], ["<b>hitta på<\/b>", "make up", "<i>Han hittade på en historia.<\/i>"], ["<b>tycka om<\/b>", "like", "<i>Jag tycker om dig.<\/i>"], ["<b>hålla på<\/b>", "be busy doing", "<i>Vi håller på att äta.<\/i>"]]}, {"caption": "Same verb, new particle (ta)", "head": ["Swedish", "English"], "rows": [["<b>ta upp<\/b>", "bring up / pick up"], ["<b>ta av<\/b>", "take off"], ["<b>ta med<\/b>", "bring along"], ["<b>ta bort<\/b>", "remove"]]}], "examples": [["Jag håller med dig, det här är en bra idé.", "I agree with you, this is a good idea."], ["Ge inte upp, du är nästan framme!", "Don't give up, you are almost there!"], ["Plötsligt kom jag på var jag hade lagt nycklarna.", "Suddenly I remembered where I had put the keys."], ["Kan du stänga av datorn innan vi äter?", "Can you turn off the computer before we eat?"], ["Hon tog upp sin mobil och ringde sin mamma.", "She took out her phone and called her mum."], ["Du ser trött ut i dag, sov du dåligt?", "You look tired today, did you sleep badly?"], ["Jag känner igen den där sången från radion.", "I recognise that song from the radio."], ["Barnen håller på att bygga en koja i skogen.", "The kids are busy building a hut in the forest."], ["Han hittade på en rolig historia för att trösta henne.", "He made up a funny story to comfort her."], ["Vi sätter på musiken och dansar i köket.", "We turn on the music and dance in the kitchen."]], "mistakes": [{"wrong": "Jag stänger den av.", "right": "Jag stänger av den.", "why": "In English 'turn it off' splits the verb. In Swedish the particle stays directly behind the verb."}, {"wrong": "Jag ger upp inte.", "right": "Jag ger inte upp.", "why": "<i>inte<\/i> comes before the particle, not after it."}, {"wrong": "Jag tycker dig.", "right": "Jag tycker om dig.", "why": "'Like' is the whole chunk <b>tycka om<\/b>. Without <i>om<\/i> it means 'think' and sounds wrong."}, {"wrong": "Jag kom upp med en idé.", "right": "Jag kom på en idé.", "why": "This is a word-for-word copy of 'come up with'. The Swedish particle is <b>på<\/b>."}], "trick": "Treat the particle as the end of the verb: 'ge-upp', 'stänga-av', 'komma-på'. Stress it, and keep inte and objects after it or in front of it, never in the middle.", "check": [{"q": "Jag kan inte ___ upp. (give)", "a": "ge", "why": "Use the infinitive after kan inte: ge upp."}, {"q": "Du ser glad ___. (look)", "a": "ut", "why": "se ut = look, with the adjective between."}, {"q": "Rätta ordföljden: Jag tog den upp.", "a": "Jag tog upp den.", "why": "Particle stays glued to the verb."}, {"q": "Vilken partikel? Jag känner ___ dig från skolan. (recognise)", "a": "igen", "why": "känna igen = recognise."}, {"q": "Jag ___ med dig. (agree, present tense of hålla)", "a": "håller", "why": "hålla med = agree."}]}, {"id": "passiv", "title": "S-passive: Huset byggdes 1902", "level": "B2", "hook": "You'll be able to say that something was done without saying who did it ('The house was built in 1902'). Swedish does this with one tiny letter, -s, and you'll see it on signs, in news and in books.", "steps": [{"h": "Who does what: active and passive", "t": "The subject is the thing the sentence is about, usually at the start. In an <b>active<\/b> sentence the subject does the action: <i>Man byggde huset<\/i> (Someone built the house). In a <b>passive<\/b> sentence the subject is the thing that receives the action: <i>Huset byggdes<\/i> (The house was built). Use it when you don't know who did it, or it isn't important."}, {"h": "The -s on the verb", "t": "A verb is an action word, like build or sell. English makes the passive with 'is' or 'was' plus a verb ('is sold', 'was built'). Swedish simply adds <b>-s<\/b> to the verb: <i>säljer<\/i> becomes <b>säljs<\/b> (is sold). The thing that was affected moves to the front: <i>Glass säljs här.<\/i> You do not add <i>är<\/i> or <i>var<\/i>."}, {"h": "Present tense: how to build the -s", "t": "Present tense means what happens now. Verbs ending in <b>-ar<\/b> drop the r and add s: <i>målar<\/i> becomes <b>målas<\/b>. Verbs ending in <b>-er<\/b> drop the whole ending: <i>stänger<\/i> becomes <b>stängs<\/b>, <i>säljer<\/i> becomes <b>säljs<\/b>. Exception: if the stem already ends in s, keep the e: <i>läser<\/i> becomes <b>läses<\/b>."}, {"h": "Other tenses", "t": "For past tense (preteritum) add -s to the past form: <i>byggde<\/i> becomes <b>byggdes<\/b>, <i>skrev<\/i> becomes <b>skrevs<\/b>. For 'has/have been done' use <b>har<\/b> + the supine with -s. The supine is the form that follows <i>har<\/i>: <i>har målat<\/i> becomes <b>har målats<\/b>. After <i>ska<\/i> or <i>kan<\/i> use the basic form (infinitive) with -s: <i>ska stängas<\/i> (will be closed)."}, {"h": "Saying who did it, and bli", "t": "If you do want to say who did it, add <b>av<\/b> (by): <i>Boken skrevs av Astrid Lindgren.<\/i> There is another way: <b>bli<\/b> (become) plus a participle, which is a verb form used like an adjective. <i>Han blev gripen<\/i> (He was caught) stresses that something happened to him. Careful: a few verbs end in -s without being passive, such as <i>hoppas<\/i> (to hope) and <i>finnas<\/i> (to exist)."}], "tables": [{"caption": "Active and passive", "head": ["Tense", "Active", "Passive"], "rows": [["presens", "man säljer", "det <b>säljs<\/b>"], ["preteritum", "man byggde", "det <b>byggdes<\/b>"], ["supinum", "man har målat", "det har <b>målats<\/b>"], ["infinitiv", "man ska stänga", "det ska <b>stängas<\/b>"]]}, {"caption": "Making the present passive", "head": ["Verb ends in", "Active", "Passive"], "rows": [["<b>-ar<\/b>", "målar", "mål<b>as<\/b>"], ["<b>-er<\/b>", "stänger", "stäng<b>s<\/b>"], ["<b>-er<\/b> (stem ends in s)", "läser", "läs<b>es<\/b>"], ["short verbs", "gör", "gör<b>s<\/b>"]]}], "examples": [["Huset byggdes för över hundra år sedan.", "The house was built over a hundred years ago."], ["Glass säljs i kiosken vid stranden.", "Ice cream is sold at the kiosk by the beach."], ["Pippi Långstrump skrevs av Astrid Lindgren.", "Pippi Longstocking was written by Astrid Lindgren."], ["Dörren stängs klockan sex varje kväll.", "The door is closed at six o'clock every evening."], ["Det talas många språk i vår klass.", "Many languages are spoken in our class."], ["Tavlan har målats om flera gånger.", "The painting has been repainted several times."], ["Pizzan åts upp på bara tio minuter.", "The pizza was eaten up in just ten minutes."], ["Skolan ska renoveras nästa sommar.", "The school will be renovated next summer."], ["Dörren stängdes av vinden.", "The door was closed by the wind."], ["Hon blev uppringd av sin mormor under lunchen.", "She got a call from her grandmother during lunch."]], "mistakes": [{"wrong": "Huset byggs 1902.", "right": "Huset byggdes 1902.", "why": "1902 is the past, so use the past form byggde and add -s. Byggs is present."}, {"wrong": "Dörren är stängs klockan sex.", "right": "Dörren stängs klockan sex.", "why": "The -s already means 'is done'. Don't add är like English 'is closed'."}, {"wrong": "Glass säljer här.", "right": "Glass säljs här.", "why": "Ice cream receives the action, so the verb needs -s. Säljer would mean the ice cream sells things."}, {"wrong": "Allt har äts upp.", "right": "Allt har ätits upp.", "why": "Use the supine ätit and add -s: ätits. Äts is the present."}], "trick": "Think of <b>-s<\/b> as 'something happened to it'. Take the verb, put an s at the end (fix the ending first), and move the thing that received the action to the front: <i>Man säljer glass → Glass säljs.<\/i>", "check": [{"q": "Man säljer glass → Glass ___ här.", "a": "säljs", "why": "Present passive: säljer loses -er and gets -s."}, {"q": "Man byggde huset → Huset ___ .", "a": "byggdes", "why": "Past form byggde plus -s."}, {"q": "Man läser boken → Boken ___ .", "a": "läses", "why": "The stem ends in s, so keep the e: läses."}, {"q": "Fönstret ska ___ i kväll. (stänga)", "a": "stängas", "why": "After ska, use the infinitive plus -s."}, {"q": "Boken skrevs ___ Astrid Lindgren.", "a": "av", "why": "Av means 'by' for the one who did it."}]}, {"id": "plural", "title": "Making plurals", "level": "A2", "hook": "You will be able to say more than one of something, from two cats to two apples, by choosing the right one of five plural endings. Most of the time the last letter of the word tells you which.", "steps": [{"h": "What is a plural?", "t": "A <b>plural<\/b> means more than one: one car, two cars. English nearly always adds -s. Swedish has <b>five<\/b> main plural endings, and which one a noun takes depends on its last letter and on whether it is an en-word or an ett-word (see the lesson on en and ett). After a number or a word like 'many', the noun is plural: <i>en bil → två bilar<\/i>, <i>många bilar<\/i>."}, {"h": "En-words: -or, -ar and -er", "t": "En-words ending in <b>-a<\/b> take <b>-or<\/b>: <i>en flicka → flickor<\/i>, <i>en gata → gator<\/i>. Many other en-words take <b>-ar<\/b>: <i>en bil → bilar<\/i>, <i>en stol → stolar<\/i>. En-words ending in -e also take -ar, and the -e drops off: <i>en pojke → pojkar<\/i>. A third group takes <b>-er<\/b>: <i>en katt → katter<\/i>, <i>en telefon → telefoner<\/i>, <i>en elev → elever<\/i>. There is no perfect rule to choose between -ar and -er, so learn the plural with each new noun."}, {"h": "Ett-words: -n or nothing", "t": "Ett-words are simpler. If an ett-word ends in a <b>vowel<\/b>, add <b>-n<\/b>: <i>ett äpple → äpplen<\/i>. If it ends in a <b>consonant<\/b>, the plural looks exactly like the singular: <i>ett hus → hus<\/i>, <i>ett barn → barn<\/i>, <i>ett ägg → ägg<\/i>. So 'two houses' is <i>två hus<\/i>, with no ending at all. The same is true of en-words ending in <b>-are<\/b>: <i>en lärare → lärare<\/i>."}, {"h": "Words that change their vowel", "t": "A few very common nouns change their vowel in the plural, much like English 'foot → feet'. Learn these as a small group: <i>en bok → böcker<\/i>, <i>en hand → händer<\/i>, <i>en fot → fötter<\/i>, <i>en man → män<\/i>, <i>en bror → bröder<\/i>, <i>en stad → städer<\/i>. Some nouns also lose an unstressed -e- before the ending: <i>en syster → systrar<\/i>, <i>en cykel → cyklar<\/i>."}, {"h": "Bonus: 'the ...' in the plural", "t": "To say 'the cars', add a second ending to the plural: <i>bilar → bilarna<\/i>. The pattern is -or → <b>-orna<\/b>, -ar → <b>-arna<\/b>, -er → <b>-erna<\/b>, -n → <b>-na<\/b>, and ett-words with no ending add <b>-en<\/b>: <i>hus → husen<\/i>. So <i>flickorna, katterna, äpplena, husen<\/i>. If you can make the plural, you can make this form as well."}], "tables": [{"caption": "The five plural endings", "head": ["ending", "typical words", "one → many"], "rows": [["<b>-or<\/b>", "en-words ending in -a", "en flicka → flick<b>or<\/b>"], ["<b>-ar<\/b>", "many en-words", "en bil → bil<b>ar<\/b>, en pojke → pojk<b>ar<\/b>"], ["<b>-er<\/b>", "many en-words, loanwords", "en katt → katt<b>er<\/b>, en telefon → telefon<b>er<\/b>"], ["<b>-n<\/b>", "ett-words ending in a vowel", "ett äpple → äpple<b>n<\/b>"], ["<b>no ending<\/b>", "ett-words ending in a consonant, words in -are", "ett hus → hus, en lärare → lärare"]]}, {"caption": "Common vowel-changers", "head": ["one", "many"], "rows": [["en bok", "böcker"], ["en hand", "händer"], ["en fot", "fötter"], ["en man", "män"], ["en bror", "bröder"], ["en stad", "städer"]]}, {"caption": "Bonus: the same nouns with 'the'", "head": ["plural", "the ... (plural)"], "rows": [["flickor", "flickorna"], ["bilar", "bilarna"], ["katter", "katterna"], ["äpplen", "äpplena"], ["hus", "husen"]]}], "examples": [["Det finns tre flickor och två pojkar i gruppen.", "There are three girls and two boys in the group."], ["Jag har två bröder och tre systrar.", "I have two brothers and three sisters."], ["Vi köpte fyra biljetter till filmen.", "We bought four tickets for the film."], ["Hon har två katter och en hund hemma.", "She has two cats and a dog at home."], ["Jag åt två äpplen och några ägg till frukost.", "I ate two apples and some eggs for breakfast."], ["Det finns många hus och bilar på vår gata.", "There are many houses and cars on our street."], ["Läraren har trettio elever i klassen.", "The teacher has thirty pupils in the class."], ["Vi har två barn och två katter.", "We have two children and two cats."], ["Hon plockade blommor och bär i skogen.", "She picked flowers and berries in the forest."], ["Mina fötter är kalla och mina händer också.", "My feet are cold and my hands too."]], "mistakes": [{"wrong": "två bilor", "right": "två bilar", "why": "-or is only for en-words ending in -a (flickor). Bil does not end in -a, so it takes -ar."}, {"wrong": "två huser", "right": "två hus", "why": "English always wants an ending. Ett-words ending in a consonant stay the same in the plural."}, {"wrong": "två äpplar", "right": "två äpplen", "why": "Ett-words ending in a vowel add -n, not -ar."}, {"wrong": "tre bokar", "right": "tre böcker", "why": "Bok is one of the vowel-changers: o becomes ö and the ending is -er. Learn it with its plural."}], "trick": "A gets O: flick-a → flick-or. Ett + vowel gets N: äpple → äpplen. Ett + consonant gets nothing: hus → hus.", "check": [{"q": "en flicka → två ___", "a": "flickor", "why": "En-word ending in -a takes -or."}, {"q": "ett hus → två ___", "a": "hus", "why": "Ett-word ending in a consonant has no plural ending."}, {"q": "ett äpple → två ___", "a": "äpplen", "why": "Ett-word ending in a vowel takes -n."}, {"q": "en bok → två ___", "a": "böcker", "why": "Vowel change o → ö, plus -er."}, {"q": "en katt → två ___", "a": "katter", "why": "Many en-words ending in a consonant take -er."}]}, {"id": "prep", "title": "Time words: om, för sedan, i and på", "level": "B1", "hook": "You will be able to say when something happens, how long it lasts and how long it took, without translating word for word from English. Time phrases are in almost every conversation, and this is where English speakers slip most often.", "steps": [{"h": "What a preposition is", "t": "A <b>preposition<\/b> is a small word that goes before a noun or a time phrase and tells you how it relates to the rest of the sentence. English examples are <i>in<\/i>, <i>on<\/i>, <i>for<\/i> and <i>at<\/i>. Swedish time prepositions do not match English one to one. <i>In a week<\/i> and <i>in May<\/i> both use <i>in<\/i> in English, but they use two different Swedish words. So learn them by the question they answer."}, {"h": "Future and past: om and för … sedan", "t": "To say how far ahead something is, use <b>om<\/b>: <i>Vi ses <b>om<\/b> en vecka.<\/i> (We will see each other in a week.) To say how long ago something was, use <b>för … sedan<\/b>, which wraps around the time like a pair of brackets: <i>Jag träffade henne <b>för<\/b> en månad <b>sedan<\/b>.<\/i> (I met her a month ago.) You need <b>both<\/b> words for <i>ago<\/i>."}, {"h": "How long: i", "t": "For a stretch of time that goes on or went on, use <b>i<\/b>: <i>Jag väntade <b>i<\/b> två timmar.<\/i> <i>Hon har bott här <b>i<\/b> tre år.<\/i> The same little word is used for <i>this<\/i> day or season: <i>i kväll<\/i> (this evening), <i>i år<\/i> (this year), <i>i sommar<\/i> (this summer) and <i>i går<\/i> (yesterday). Compare <b>sedan<\/b> used on its own, meaning <i>since<\/i> a point in time: <i>Vi har känt varandra sedan 2018.<\/i>"}, {"h": "The word på", "t": "<b>På<\/b> has three jobs. It goes with weekdays: <i>på måndag<\/i> (on Monday) and <i>på måndagar<\/i> (on Mondays). It goes with parts of the day and the weekend: <i>på morgonen<\/i>, <i>på kvällen<\/i>, <i>på helgen<\/i>. And it tells how long something <b>took<\/b> to finish: <i>Jag cyklade dit <b>på<\/b> tio minuter.<\/i> Note the difference: <i>Jag simmade <b>i<\/b> en timme<\/i> (I swam for an hour) versus <i>Jag simmade en kilometer <b>på<\/b> en timme<\/i> (I swam a kilometre in an hour)."}, {"h": "Months, decades, seasons and during", "t": "Months use <b>i<\/b>: <i>i maj<\/i>, <i>i juli<\/i>. Decades use <b>på<\/b>: <i>på 1990-talet<\/i> (in the 1990s). Seasons in general use <b>på<\/b>: <i>på sommaren<\/i> means <i>in the summer<\/i> as a habit, while <i>i somras<\/i> means <i>last summer<\/i>. <b>Under<\/b> means <i>during<\/i> and goes with an event or a period: <i>under matchen<\/i>, <i>under lovet<\/i> (the school holiday)."}], "tables": [{"caption": "Which small word answers which question?", "head": ["Question", "Word", "Example"], "rows": [["In how long from now?", "<b>om<\/b>", "<i>om en vecka<\/i> (in a week)"], ["How long ago?", "<b>för … sedan<\/b>", "<i>för en vecka sedan<\/i> (a week ago)"], ["For how long?", "<b>i<\/b>", "<i>i två timmar<\/i> (for two hours)"], ["Since when?", "<b>sedan<\/b>", "<i>sedan 2018<\/i> (since 2018)"], ["How long did it take?", "<b>på<\/b>", "<i>på tio minuter<\/i> (in ten minutes)"], ["During what?", "<b>under<\/b>", "<i>under matchen<\/i> (during the game)"]]}, {"caption": "Day, month and period", "head": ["Kind of time", "Word", "Example"], "rows": [["Weekday", "<b>på<\/b>", "<i>på måndag, på måndagar<\/i>"], ["Part of day / weekend", "<b>på<\/b>", "<i>på morgonen, på helgen<\/i>"], ["This day or season", "<b>i<\/b>", "<i>i kväll, i år, i sommar<\/i>"], ["Month", "<b>i<\/b>", "<i>i maj, i juli<\/i>"], ["Decade", "<b>på<\/b>", "<i>på 1990-talet<\/i>"]]}], "examples": [["Vi åker på semester om två veckor.", "We are going on holiday in two weeks."], ["Jag träffade henne för en månad sedan.", "I met her a month ago."], ["Hon har bott i Göteborg i tre år.", "She has lived in Gothenburg for three years."], ["På måndag har vi prov i matte.", "On Monday we have a test in maths."], ["Jag cyklade till skolan på tio minuter.", "I cycled to school in ten minutes."], ["Min födelsedag är i maj, och din är i juli.", "My birthday is in May, and yours is in July."], ["På 1990-talet fanns det inga smarta telefoner.", "In the 1990s there were no smartphones."], ["Under matchen åt vi chips och drack läsk.", "During the match we ate crisps and drank soda."], ["På morgonen äter jag gröt, men i kväll äter vi pizza.", "In the morning I eat porridge, but tonight we are eating pizza."], ["Vi har känt varandra sedan 2018.", "We have known each other since 2018."]], "mistakes": [{"wrong": "Jag träffade henne en vecka sedan.", "right": "Jag träffade henne för en vecka sedan.", "why": "English <i>ago<\/i> is one word, but Swedish needs both <i>för<\/i> and <i>sedan<\/i>."}, {"wrong": "Vi ses i en vecka.", "right": "Vi ses om en vecka.", "why": "English says <i>in a week<\/i>, but for a point in the future Swedish uses <i>om<\/i>. <i>I<\/i> would mean <i>for a week<\/i>."}, {"wrong": "Jag har bott här för tre år.", "right": "Jag har bott här i tre år.", "why": "<i>For<\/i> in the sense of duration is <i>i<\/i> in Swedish. <i>För<\/i> only appears in <i>för … sedan<\/i>."}, {"wrong": "Jag sprang milen i femtio minuter.", "right": "Jag sprang milen på femtio minuter.", "why": "When you say how long it took to complete something, use <i>på<\/i>. <i>I<\/i> only says how long it went on."}], "trick": "<b>Om<\/b> looks forward, <b>för … sedan<\/b> looks back. <b>I<\/b> is how long you stay, and <b>på<\/b> is how fast you finish.", "check": [{"q": "Vi ses ___ två dagar. (in two days)", "a": "om", "why": "Future point in time."}, {"q": "Hon flyttade hit ___ ett år ___. (a year ago)", "a": "för ... sedan", "why": "<i>Ago<\/i> needs both words."}, {"q": "Jag har väntat ___ en timme. (for an hour)", "a": "i", "why": "<i>I<\/i> shows duration."}, {"q": "Jag städade rummet ___ tio minuter. (it took ten minutes)", "a": "på", "why": "<i>På<\/i> says how long it took to finish."}, {"q": "Jag fyller år ___ juli. (in July)", "a": "i", "why": "Months use <i>i<\/i>."}]}, {"id": "prepverb", "title": "Verbs that need a small word: verb + preposition", "level": "C1", "hook": "After this lesson you will know why Swedish says 'wait on the bus' and 'long after summer', and you will have a method for picking the right little word after a verb. It matters because the wrong one is the most common thing that makes advanced Swedish sound foreign.", "steps": [{"h": "What is a preposition?", "t": "A <b>preposition<\/b> is a small word that links a verb or adjective to the thing it is about: in English <i>about<\/i>, <i>for<\/i>, <i>of<\/i>, <i>in<\/i>, <i>on<\/i>. Think of 'I wait <i>for<\/i> the bus' or 'I am afraid <i>of<\/i> dogs'. Swedish does exactly the same, but its choice of little word is often different from English."}, {"h": "The verb and its word are a team", "t": "Many verbs and adjectives come with one fixed preposition, and you cannot swap it. English does this too: you 'look at' a picture, never 'look on' it. So learn the pair as one block: not <i>vänta<\/i> but <b>vänta på<\/b> (wait for), not <i>rädd<\/i> but <b>rädd för<\/b> (afraid of). The word that follows is the preposition, and the noun comes after it: <i>Jag väntar <b>på<\/b> bussen.<\/i>"}, {"h": "Do not translate the English word", "t": "Here is the trap. Your brain wants to translate 'wait <i>for<\/i>' as <i>vänta för<\/i>. But Swedish chose <i>på<\/i> (literally 'on'). It is arbitrary, just like English 'interested <i>in<\/i>' versus Swedish <i>intresserad <b>av<\/b><\/i> (literally 'of'). The fix is simple: when you meet a new verb, always write down the preposition with it, and never trust the English one."}, {"h": "Little groups help you remember", "t": "There are some loose patterns. <b>på<\/b> often goes with thinking, trusting and waiting (<i>tänka på, lita på, vänta på<\/i>). <b>efter<\/b> means 'going after something': <i>leta efter, längta efter<\/i>. <b>om<\/b> is about a topic: <i>handla om, drömma om<\/i>. <b>för<\/b> goes with feelings like fear, shame and thanks. <b>av<\/b> and <b>i<\/b> go with interest and love: <i>intresserad av, kär i<\/i>. Patterns are not rules, but they give you something to hang words on."}, {"h": "One verb, different words, different meanings", "t": "Changing the preposition can change the meaning. <i>fråga <b>om<\/b><\/i> means to ask about something ('ask the time'), while <i>fråga <b>efter<\/b><\/i> means to ask for a person or thing ('ask for Anna'). If you add a whole action after the preposition, use <b>att<\/b> + verb: <i>Jag är intresserad <b>av att<\/b> lära mig svenska.<\/i> And in questions the preposition stays at the end, as in English: <i>Vad tänker du <b>på<\/b>?<\/i>"}], "tables": [{"caption": "Common pairs, sorted by preposition", "head": ["Preposition", "Verb or adjective + it", "English"], "rows": [["<b>på<\/b>", "<i>tänka på, lita på, vänta på, svara på, bero på, arg på<\/i>", "think about, trust, wait for, answer, depend on, angry at"], ["<b>efter<\/b>", "<i>längta efter, leta efter, fråga efter<\/i>", "long for, look for, ask for"], ["<b>om<\/b>", "<i>handla om, drömma om, be om, bry sig om, ta hand om<\/i>", "be about, dream of, ask for (a favour), care about, take care of"], ["<b>för<\/b>", "<i>tacka för, skämmas för, rädd för<\/i>", "thank for, be ashamed of, afraid of"], ["<b>av / i / vid<\/b>", "<i>intresserad av, kär i, vänja sig vid<\/i>", "interested in, in love with, get used to"]]}, {"caption": "English trap: the little word does not match", "head": ["English", "Swedish", "Do NOT say"], "rows": [["wait <b>for<\/b>", "<i>vänta <b>på<\/b><\/i>", "<i>vänta för<\/i>"], ["look <b>for<\/b>", "<i>leta <b>efter<\/b><\/i>", "<i>leta för<\/i>"], ["interested <b>in<\/b>", "<i>intresserad <b>av<\/b><\/i>", "<i>intresserad i<\/i>"], ["depend <b>on<\/b>", "<i>bero <b>på<\/b><\/i>", "<i>bero av<\/i>"], ["afraid <b>of<\/b>", "<i>rädd <b>för<\/b><\/i>", "<i>rädd av<\/i>"], ["in love <b>with<\/b>", "<i>kär <b>i<\/b><\/i>", "<i>kär med<\/i>"]]}, {"caption": "Same verb, different preposition", "head": ["Phrase", "Meaning"], "rows": [["<i>fråga <b>om<\/b> vägen<\/i>", "ask about the way (get information)"], ["<i>fråga <b>efter<\/b> Anna<\/i>", "ask for Anna (want to speak to her)"], ["<i>be <b>om<\/b> hjälp<\/i>", "ask for help (a request)"]]}], "examples": [["Barnen väntar på bussen vid skolan varje morgon.", "The children wait for the bus at the school every morning."], ["Hon längtar efter sommaren och långa dagar vid havet.", "She longs for summer and long days by the sea."], ["Om vi kan cykla i morgon beror på vädret.", "Whether we can cycle tomorrow depends on the weather."], ["Efter en månad hade jag vant mig vid det kalla vädret.", "After a month I had got used to the cold weather."], ["Min syster är väldigt intresserad av rymden och planeter.", "My sister is very interested in space and planets."], ["Pojken är rädd för mörkret men inte för hundar.", "The boy is afraid of the dark but not of dogs."], ["Vi tackade läraren för hjälpen efter lektionen.", "We thanked the teacher for the help after the lesson."], ["Boken handlar om en flicka som drömmer om att flyga.", "The book is about a girl who dreams of flying."], ["Jag har letat efter mina nycklar i en hel timme.", "I have been looking for my keys for a whole hour."], ["Kan du ta hand om katten medan vi är borta?", "Can you take care of the cat while we are away?"]], "mistakes": [{"wrong": "Jag väntar för bussen.", "right": "Jag väntar på bussen.", "why": "English 'wait for' tempts you to use <i>för<\/i>. Swedish uses <i>på<\/i> (literally 'on'). Learn <i>vänta på<\/i> as one block."}, {"wrong": "Jag är intresserad i musik.", "right": "Jag är intresserad av musik.", "why": "'Interested in' feels like <i>i<\/i>, but Swedish says <i>intresserad av<\/i>. <i>Kär i<\/i> (in love with) is where <i>i<\/i> belongs."}, {"wrong": "Det beror av vädret.", "right": "Det beror på vädret.", "why": "<i>bero<\/i> always takes <i>på<\/i>. The English 'depends on' is a good clue: on = <i>på<\/i>."}, {"wrong": "Jag letar för mina nycklar.", "right": "Jag letar efter mina nycklar.", "why": "Looking 'for' something is 'going after' it in Swedish: <i>leta efter<\/i>, <i>längta efter<\/i>."}], "trick": "Never memorise a verb alone. Say it as a three-word chant with an object: 'vänta PÅ bussen', 'längta EFTER sommaren', 'kär I någon'. The chant sticks, and the English preposition cannot sneak in.", "check": [{"q": "Hon längtar ___ sommaren.", "a": "efter", "why": "<i>längta efter<\/i> = long for."}, {"q": "Han är kär ___ en tjej i klassen.", "a": "i", "why": "<i>kär i<\/i> = in love with."}, {"q": "Du lär dig snart att vänja dig ___ kylan.", "a": "vid", "why": "<i>vänja sig vid<\/i> = get used to."}, {"q": "Vi vill tacka er ___ maten.", "a": "för", "why": "<i>tacka för<\/i> = thank for."}, {"q": "Det beror ___ hur mycket tid vi har.", "a": "på", "why": "<i>bero på<\/i> = depend on."}]}, {"id": "pron", "title": "Pronouns: jag or mig, han or honom", "level": "A2", "hook": "You will be able to pick the right little word for I/me, he/him and they/them, and say 'wash myself' correctly with mig, dig and sig. These words are in almost every sentence you will ever say.", "steps": [{"h": "Two jobs, two forms", "t": "A <b>pronoun<\/b> is a short word that stands in for a person or thing, like <i>I<\/i>, <i>him<\/i> or <i>they<\/i>. English has two forms for many of them (I/me, he/him, they/them), and so does Swedish. The <b>subject<\/b> form is for the one who does the action: <i>Jag ser<\/i>. The <b>object<\/b> form is for the one who receives it: <i>Han ser mig<\/i>."}, {"h": "The pairs to learn", "t": "Look at the first table. Most pairs are easy to remember because English does the same: <i>jag/mig<\/i>, <i>han/honom<\/i>, <i>vi/oss<\/i>. Two of them look the same in both columns: <i>den<\/i> and <i>det<\/i> (it). Also notice <i>de<\/i> (they, the doers) and <i>dem<\/i> (them, the receivers). In speech both are said 'dom', but in writing you must keep them apart."}, {"h": "After a small word like med or till", "t": "Words like <i>med<\/i> (with), <i>till<\/i> (to), <i>för<\/i> (for) and <i>av<\/i> (of/by) always take the <b>object<\/b> form: <i>med mig<\/i>, <i>till honom<\/i>, <i>för dem<\/i>. This matters most for 'me': English speakers say 'Anna and me' by habit, but Swedish writes <i>Anna och jag<\/i> when the two of you do something, and <i>till Anna och mig<\/i> when the two of you receive something."}, {"h": "Doing something to yourself: mig, dig, sig", "t": "When the person who receives the action is the same person who does it, Swedish uses a <b>reflexive<\/b> pronoun ('-self' word): <i>Jag tvättar mig<\/i> (I wash myself). For jag, du, vi and ni it is just the object form. For <i>han, hon, den, det<\/i> and <i>de<\/i> there is one special word, <b>sig<\/b>: <i>Hon tvättar sig<\/i>."}, {"h": "Why sig matters", "t": "Compare <i>Hon ser henne<\/i> (she sees another woman) with <i>Hon ser sig i spegeln<\/i> (she sees herself in the mirror). The word <i>sig<\/i> tells your listener that it is the same person. Never use <i>sig<\/i> after jag, du, vi or ni, and never use <i>honom<\/i> or <i>henne<\/i> or <i>dem<\/i> when you mean the doer."}], "tables": [{"caption": "Doer and receiver forms", "head": ["Doer (subject)", "Receiver (object)", "English"], "rows": [["jag", "mig", "I / me"], ["du", "dig", "you / you"], ["han", "honom", "he / him"], ["hon", "henne", "she / her"], ["den, det", "den, det", "it / it"], ["vi", "oss", "we / us"], ["ni", "er", "you (plural) / you"], ["de", "dem", "they / them"]]}, {"caption": "Reflexive: doing it to yourself", "head": ["Who", "Example with <i>tvätta<\/i> (wash)"], "rows": [["jag", "Jag tvättar <b>mig<\/b>."], ["du", "Du tvättar <b>dig<\/b>."], ["han / hon", "Han tvättar <b>sig<\/b>."], ["vi", "Vi tvättar <b>oss<\/b>."], ["ni", "Ni tvättar <b>er<\/b>."], ["de", "De tvättar <b>sig<\/b>."]]}], "examples": [["Min granne känner mig inte, men jag känner honom.", "My neighbour does not know me, but I know him."], ["Kan du ringa oss ikväll?", "Can you call us tonight?"], ["Barnen är trötta, så vi följer dem hem.", "The children are tired, so we are walking them home."], ["De bor långt bort, men vi besöker dem ofta.", "They live far away, but we visit them often."], ["Läraren gav henne en bok och bad henne läsa den.", "The teacher gave her a book and asked her to read it."], ["Vill du sitta bredvid mig?", "Do you want to sit next to me?"], ["Anna och jag har lagat middag åt er.", "Anna and I have cooked dinner for you."], ["Jag kliar mig på armen, den är röd.", "I am scratching my arm, it is red."], ["Han ser sig själv i spegeln och ler.", "He sees himself in the mirror and smiles."], ["Ni måste skynda er, bussen går snart!", "You have to hurry, the bus leaves soon!"], ["Kalle och Lisa skyddar sig mot regnet med ett paraply.", "Kalle and Lisa shelter from the rain with an umbrella."], ["Hon gillar honom, och han gillar henne.", "She likes him, and he likes her."]], "mistakes": [{"wrong": "Jag ser han på bussen.", "right": "Jag ser honom på bussen.", "why": "After a verb the receiver form is needed. <i>Han<\/i> is only for the one who does the action."}, {"wrong": "Han tvättar honom varje morgon.", "right": "Han tvättar sig varje morgon.", "why": "If he washes himself, use <i>sig<\/i>. <i>Honom<\/i> would mean a different man."}, {"wrong": "Mig och Anna ska åka till Lund.", "right": "Anna och jag ska åka till Lund.", "why": "'Anna and I' are the doers, so you need <i>jag<\/i>, and it is polite to name the other person first."}, {"wrong": "Jag pratar med de om saken.", "right": "Jag pratar med dem om saken.", "why": "After <i>med<\/i> the receiver form <i>dem<\/i> is used, not <i>de<\/i>."}], "trick": "Ask 'who is doing it?' (jag, han, de) and 'who gets it?' (mig, honom, dem). If the doer and the getter are the same person, use mig/dig/sig/oss/er, with sig for han, hon, den, det and de.", "check": [{"q": "Jag älskar henne. Hon älskar ___. (jag)", "a": "mig", "why": "'Me' receives the love, so the receiver form."}, {"q": "Vi väntar på ___. (they, as receiver)", "a": "dem", "why": "After <i>på<\/i> use the receiver form of de."}, {"q": "Han kammar ___ före skolan. (himself)", "a": "sig", "why": "Same person doing and receiving, third person: sig."}, {"q": "Du måste skynda ___! (yourself)", "a": "dig", "why": "Reflexive for du is dig."}, {"q": "Kan du hjälpa ___? Vi är nya här. (us)", "a": "oss", "why": "The receiver form of vi is oss."}, {"q": "Hon ger ___ en present. (him)", "a": "honom", "why": "Receiver form of han is honom."}]}, {"id": "register", "title": "Formal or everyday Swedish: choosing the right word", "level": "C1", "hook": "You will be able to pick the formal word for a letter, an essay or a work email, and the relaxed one for a chat with friends. It matters because the same idea can sound polite and professional or too casual, depending on the word you choose.", "steps": [{"h": "Two kinds of Swedish", "t": "<b>Register<\/b> is just how formal your language sounds. Swedish has everyday spoken language (<i>talspråk<\/i>) and careful written language (<i>skriftspråk<\/i>). English works the same way: 'gonna' and 'kids' in speech, 'going to' and 'children' in an essay. The everyday word is not wrong. It just has a different place to live."}, {"h": "When to use which", "t": "Use the <b>formal<\/b> choice for school essays, official letters, job applications, ne
