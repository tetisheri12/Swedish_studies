ws and polite work emails. Use the <b>everyday<\/b> choice with friends, family and in text messages. A good rule: if you would wear smart clothes for it, use formal words. If you would wear jeans, everyday words are fine. Do not mix styles in one text."}, {"h": "Four kinds of difference", "t": "First, <b>short forms<\/b>: <i>sen<\/i> becomes <i>sedan<\/i>, and <i>mej, dej<\/i> become <i>mig, dig<\/i>. Second, <b>casual verbs<\/b> that become precise ones: <i>kolla<\/i> becomes <i>kontrollera<\/i>, <i>fixa<\/i> becomes <i>ordna<\/i> or <i>åtgärda<\/i>, <i>snacka<\/i> becomes <i>prata<\/i> or <i>samtala<\/i>. Third, <b>vague words<\/b>: <i>typ<\/i> (like, sort of) and <i>grej<\/i> (thing) become <i>ungefär<\/i> and <i>sak<\/i>. Fourth, <b>strong everyday words<\/b> like <i>jättebra<\/i> become <i>mycket bra<\/i> or <i>utmärkt<\/i>."}, {"h": "De and dem", "t": "In speech, almost everyone says <i>dom<\/i> for 'they' and 'them'. In writing you must choose. Use <b>de<\/b> when 'they' do the action (the <i>subject<\/i>, the doer of the verb): <i>De kom i tid.<\/i> Use <b>dem<\/b> when 'them' receive the action (the <i>object<\/i>): <i>Jag såg dem.<\/i> It is the same split as English 'they' and 'them'."}, {"h": "Greetings and finer points", "t": "In emails, <i>Hej<\/i> is fine almost everywhere, even at work. For a more formal ending, <i>Med vänlig hälsning<\/i> is the standard. In formal text you also avoid slang, filler words like <i>typ<\/i>, and spoken spellings. Finally, do not overshoot: using stiff words with a friend (<i>samtala<\/i> instead of <i>snacka<\/i>) sounds as strange as the opposite mistake."}], "tables": [{"caption": "Everyday and formal pairs", "head": ["Everyday (vardagligt)", "Formal (formellt)", "English"], "rows": [["<i>kolla<\/i>", "<b>kontrollera, undersöka<\/b>", "check, examine"], ["<i>fixa<\/i>", "<b>ordna, åtgärda<\/b>", "sort out, take action on"], ["<i>typ<\/i>", "<b>ungefär, till exempel<\/b>", "about, for example"], ["<i>jättebra<\/i>", "<b>mycket bra, utmärkt<\/b>", "very good, excellent"], ["<i>funka<\/i>", "<b>fungera<\/b>", "work (function)"], ["<i>sen<\/i>", "<b>sedan<\/b>", "then, since"], ["<i>snacka<\/i>", "<b>prata, samtala<\/b>", "talk, converse"], ["<i>grej<\/i>", "<b>sak<\/b>", "thing"]]}, {"caption": "Pronouns: spoken and written", "head": ["Spoken", "Written", "Use"], "rows": [["<i>dom<\/i>", "<b>de<\/b>", "they (doing the action)"], ["<i>dom<\/i>", "<b>dem<\/b>", "them (receiving the action)"], ["<i>mej<\/i>", "<b>mig<\/b>", "me"], ["<i>dej<\/i>", "<b>dig<\/b>", "you (object)"]]}, {"caption": "The same message in two styles", "head": ["Everyday", "Formal"], "rows": [["<i>Jag kollar om det funkar, sen ringer jag.<\/i>", "<b>Jag kontrollerar om det fungerar och ringer sedan.<\/b>"], ["<i>Dom fixar det typ i morgon.<\/i>", "<b>De åtgärdar det ungefär i morgon.<\/b>"]]}], "examples": [["Jag kollar bara om grejen funkar, sen ringer jag dig.", "I am just checking if the thing works, then I will call you. (everyday)"], ["Jag kontrollerar att apparaten fungerar och ringer sedan till dig.", "I am checking that the device works and will then call you. (formal)"], ["Dom snackar typ hela tiden om fotboll.", "They talk about football basically all the time. (everyday)"], ["De samtalar ofta om fotboll under rasterna på skolan.", "They often talk about football during the breaks at school. (formal)"], ["Det var jättebra, tack för att du hjälpte mej!", "That was really good, thanks for helping me! (everyday)"], ["Det var utmärkt, tack för att du hjälpte mig.", "That was excellent, thank you for helping me. (formal)"], ["Vi måste fixa problemet innan fredag, annars blir det rörigt.", "We have to sort out the problem before Friday, or it gets messy. (everyday)"], ["Vi måste åtgärda problemet innan fredag, annars uppstår förseningar.", "We must remedy the problem before Friday, otherwise delays will occur. (formal)"], ["Läraren bad dem lämna in uppgiften före lunch.", "The teacher asked them to hand in the assignment before lunch. (de/dem)"], ["De som kommer för sent får vänta utanför klassrummet.", "Those who arrive late have to wait outside the classroom. (de as subject)"]], "mistakes": [{"wrong": "Dom kom för sent till mötet.", "right": "De kom för sent till mötet.", "why": "<i>dom<\/i> is spoken spelling. In writing, use <i>de<\/i> when they do the action."}, {"wrong": "Jag såg de i parken.", "right": "Jag såg dem i parken.", "why": "'Them' receives the action, so written Swedish needs <i>dem<\/i>. English speakers copy 'they' to <i>de<\/i> everywhere."}, {"wrong": "Tack för hjälpen, jag mejlar dej sen. (in a formal email)", "right": "Tack för hjälpen, jag mejlar dig sedan.", "why": "<i>dej<\/i> and <i>sen<\/i> are spoken forms. A formal email wants <i>dig<\/i> and <i>sedan<\/i>."}, {"wrong": "Vill du samtala om fotboll? (to a friend)", "right": "Vill du snacka fotboll?", "why": "Formal words with friends sound stiff. Match the word to the situation, in both directions."}], "trick": "Dress code test: would you text it to a friend in jeans, or put it in a letter in a suit? Also, spelling helps: the formal pronouns keep the letter <b>g<\/b> (<i>mig, dig<\/i>), while spoken ones drop it (<i>mej, dej<\/i>).", "check": [{"q": "Formal word for 'kolla' (check):", "a": "kontrollera", "why": "<i>kontrollera<\/i> or <i>undersöka<\/i> are the written forms."}, {"q": "Written form of spoken 'Dom kom tidigt' (they came early): ___ kom tidigt.", "a": "De", "why": "They are the doers, so <i>de<\/i>."}, {"q": "Hon hälsade på ___ (them) igår.", "a": "dem", "why": "'Them' receives the action: <i>dem<\/i>."}, {"q": "Formal word for 'typ' (about, roughly):", "a": "ungefär", "why": "<i>typ<\/i> is slang filler, <i>ungefär<\/i> is neutral and formal."}, {"q": "Write 'Tack för hjälpen, mej' correctly in a letter:", "a": "Tack för hjälpen, mig", "why": "Written Swedish uses <i>mig<\/i>, not <i>mej<\/i>."}]}, {"id": "rel", "title": "Som, vars, vilket and där: describing with extra clauses", "level": "B2", "hook": "You will be able to attach a description to any noun ('the boy who plays', 'the town where I live') and to comment on a whole sentence ('..., which made everyone happy'). It is how you stop speaking in short, choppy sentences.", "steps": [{"h": "The basic idea: a describing part", "t": "A <b>relative clause<\/b> is a describing part of a sentence that hangs on a noun and tells you more about it. In English it starts with who, which or that: 'the boy <i>who<\/i> plays football'. In Swedish the all-purpose starter is <b>som<\/b>. Pojken <b>som<\/b> spelar fotboll = 'the boy who plays football'. Whether the English would say who, which or that, Swedish says <b>som<\/b> for people, animals and things."}, {"h": "Som is never dropped and the pronoun is not repeated", "t": "English often drops the little word: 'the book I read'. In Swedish you normally keep it: <b>Boken som jag läste<\/b>. Also, do not add an extra word that repeats the noun: 'the book that I read it' is wrong in both languages. A preposition (a small word like <i>med<\/i>, <i>på<\/i>, <i>till<\/i>) goes at the end of the describing part, just as in everyday English: <b>Flickan som jag pratade med<\/b> = 'the girl I talked to'."}, {"h": "Vars means 'whose'", "t": "When you want to say that the noun owns something, use <b>vars<\/b>: Tjejen <b>vars<\/b> hund är sjuk = 'the girl whose dog is sick'. Note that the thing owned comes straight after <b>vars<\/b> with <b>no article and no <i>hennes<\/i><\/b>. So: <i>vars hund<\/i>, not <i>vars hennes hund<\/i> or <i>vars hunden<\/i>. Often there is a comma before and after the clause when it is extra information."}, {"h": "Vilket comments on the whole sentence", "t": "Sometimes you want to describe a whole situation and not just one noun: 'He won, <i>which<\/i> made everyone happy.' Here 'which' points back at the entire event of winning. Swedish uses <b>vilket<\/b> after a comma: Han vann, <b>vilket<\/b> alla blev glada över. You cannot use <b>som<\/b> here, because <i>som<\/i> needs a noun to attach to. Think of <b>vilket<\/b> as 'and that fact'."}, {"h": "Där and dit for places", "t": "For a place you can use <b>där<\/b> (= where, at a place): Staden <b>där<\/b> jag bor. Swedish also separates 'being at' from 'going to' (the same idea as <i>här/hit<\/i>). If the clause is about movement towards the place, use <b>dit<\/b>: Landet <b>dit<\/b> vi åker = 'the country we are travelling to'. Using <i>där<\/i> for both is a very common slip."}, {"h": "Vad and det som: 'what' and 'the thing that'", "t": "English 'what' can mean 'the thing that'. Swedish <b>vad<\/b> works when nothing comes before it: Gör <b>vad<\/b> du vill. But when there is a word like <i>allt<\/i> (everything), <i>det<\/i> (that) or <i>det enda<\/i> (the only thing), you must use <b>som<\/b>: <b>Det som<\/b> hände var roligt. <b>Allt som<\/b> du behöver finns här. Rule of thumb: a noun-ish word in front means <b>som<\/b>; nothing in front means <b>vad<\/b>."}], "tables": [{"caption": "Which relative word?", "head": ["Swedish", "English", "Use it when ...", "Example"], "rows": [["<b>som<\/b>", "who / which / that", "describing a noun", "<i>Pojken som spelar<\/i>"], ["<b>vars<\/b>", "whose", "the noun owns something", "<i>Tjejen vars hund<\/i>"], ["<b>vilket<\/b>", "which (the whole sentence)", "commenting on an entire fact, after a comma", "<i>Han vann, vilket ...<\/i>"], ["<b>där<\/b>", "where", "place, being there", "<i>Staden där jag bor<\/i>"], ["<b>dit<\/b>", "(to) where", "place, going there", "<i>Landet dit vi åker<\/i>"], ["<b>vad<\/b> / <b>det som<\/b>", "what / the thing that", "no noun before / a word like det, allt before", "<i>Gör vad du vill<\/i> / <i>Det som hände<\/i>"]]}, {"caption": "Som or vilket?", "head": ["Points back at", "Use", "Example"], "rows": [["one noun (a person or thing)", "<b>som<\/b>", "<i>Filmen som vi såg var rolig.<\/i>"], ["the whole sentence before the comma", "<b>vilket<\/b>", "<i>Vi såg filmen, vilket var roligt.<\/i>"]]}], "examples": [["Pojken som sitter bredvid mig heter Omar.", "The boy who sits next to me is called Omar."], ["Boken som jag läste i går var jättespännande.", "The book I read yesterday was really exciting."], ["Tjejen vars hund är sjuk stannar hemma i dag.", "The girl whose dog is sick is staying home today."], ["Vi bor i en stad där det snöar nästan varje vinter.", "We live in a town where it snows almost every winter."], ["Landet dit vi ska åka nästa sommar är mycket varmt.", "The country we are going to next summer is very warm."], ["Hon vann tävlingen, vilket alla i klassen blev glada över.", "She won the competition, which everyone in the class was happy about."], ["Det som hände på festen var faktiskt ganska roligt.", "What happened at the party was actually quite fun."], ["Gör vad du vill, men kom hem före sju.", "Do what you want, but come home before seven."], ["Allt som du behöver finns i den blå lådan.", "Everything you need is in the blue box."], ["Killen som jag pratade med igår är vår nya granne.", "The guy I talked to yesterday is our new neighbour."]], "mistakes": [{"wrong": "Pojken vem spelar fotboll är min bror.", "right": "Pojken som spelar fotboll är min bror.", "why": "English 'who' tempts you to use <i>vem<\/i>, but <i>vem<\/i> is only for questions. Inside a describing clause it is <b>som<\/b>."}, {"wrong": "Tjejen vars hennes hund är sjuk.", "right": "Tjejen vars hund är sjuk.", "why": "<i>vars<\/i> already means 'whose', so the owned noun follows directly. No <i>hennes<\/i> and no article."}, {"wrong": "Han vann, som alla blev glada över.", "right": "Han vann, vilket alla blev glada över.", "why": "<i>som<\/i> needs a noun to point at. To point at a whole event you need <b>vilket<\/b>."}, {"wrong": "Allt vad han sa var sant.", "right": "Allt som han sa var sant.", "why": "After <i>allt<\/i>, <i>det<\/i> or <i>det enda<\/i> Swedish needs <b>som<\/b>. <i>Vad<\/i> is only used with nothing in front of it."}], "trick": "som = the all-rounder for a noun; vilket = 'and that whole thing' after a comma; där = I am there, dit = I am going there. For 'what': if a word like allt or det stands in front, grab som.", "check": [{"q": "Flickan ___ bor bredvid oss spelar piano. (the girl who ...)", "a": "som", "why": "A describing clause about a person starts with som."}, {"q": "Mannen, ___ bil är röd, är min morbror. (whose)", "a": "vars", "why": "vars = whose, followed directly by the noun."}, {"q": "Det regnade, ___ var tråkigt. (which, about the whole situation)", "a": "vilket", "why": "The word points back at the entire sentence, so vilket."}, {"q": "Staden ___ vi ska åka nästa vecka är stor. (we are travelling to)", "a": "dit", "why": "Movement towards a place means dit, not där."}, {"q": "Allt ___ hon sa var sant. (everything she said)", "a": "som", "why": "After allt you must use som, not vad."}]}, {"id": "samband", "title": "Sambandsord: connecting ideas in longer texts", "level": "C1", "hook": "You will be able to link sentences so that your writing flows: adding, contrasting, giving reasons and results, giving examples and summing up. You will also know which connectors change the word order, which is where most mistakes happen.", "steps": [{"h": "What connectors do", "t": "<b>Sambandsord<\/b> ('connection words') are words and phrases that show how two ideas relate: one adds to the other, contrasts with it, or explains it. English has 'because', 'however', 'therefore', 'in addition'. Without them a text is a list of separate sentences. With them it reads like thinking. The relationship is the key: first decide <i>what<\/i> you want to say (add, contrast, cause, result), then choose the word."}, {"h": "Three kinds of connector, three word orders", "t": "A <b>main clause<\/b> can stand alone as a sentence. A <b>bisats<\/b> is a sub-part that cannot stand alone, it hangs on a main clause. Connectors behave differently. (1) Small joiners like <b>och, men, eller, så<\/b> sit between two main clauses and change nothing: Det regnade, <b>men<\/b> vi gick ut. (2) <b>Bisats-words<\/b> like <b>eftersom, trots att, fast, om<\/b> start a sub-part where the subject comes before the verb and any <i>inte<\/i> goes in between: <b>eftersom<\/b> det regnade. (3) <b>Adverbs<\/b> like <b>därför, dessutom, däremot, alltså<\/b> take the first seat in a main clause, so the verb comes straight after them: <b>Därför<\/b> stannade vi inne."}, {"h": "Cause and result", "t": "Cause is the reason: <b>eftersom<\/b> (because) starts a bisats, and <b>på grund av<\/b> goes with a noun (<i>på grund av regnet<\/i>). <b>nämligen<\/b> explains from the back: Jag stannade hemma. Jag var <b>nämligen<\/b> sjuk. Result is the effect: <b>därför<\/b> = 'that's why', then verb first: Jag var sjuk. <b>Därför<\/b> stannade jag hemma. <b>alltså<\/b> = 'so, therefore', a conclusion: Du har inte svarat. <b>Alltså<\/b> är du inte intresserad. Remember that <i>därför<\/i> (result) and <i>därför att<\/i> (cause, like <i>eftersom<\/i>) are different."}, {"h": "Contrast", "t": "<b>men<\/b> is the basic 'but'. <b>däremot<\/b> = 'on the other hand', for comparing two things: Jag gillar sommar. Min syster <b>däremot<\/b> gillar vinter. <b>trots att<\/b> = 'although, despite the fact that', followed by a bisats: Vi gick ut <b>trots att<\/b> det regnade. If you start the sentence with it, the main clause follows with the verb first: <b>Trots att<\/b> det regnade <b>gick<\/b> vi ut. <b>trots<\/b> alone goes with a noun: <i>trots regnet<\/i>. <b>ändå<\/b> = 'still, anyway'. For essays, <b>å ena sidan ... å andra sidan<\/b> weighs two points."}, {"h": "Adding and exemplifying", "t": "To add: <b>dessutom<\/b> (besides), <b>även<\/b> and <b>också<\/b> (also), <b>för det första ... för det andra<\/b> (firstly ... secondly). Remember the verb comes next: <b>Dessutom<\/b> är den snygg. For examples: <b>till exempel<\/b> (t.ex.) = for example, <b>bland annat<\/b> = among other things, <b>såsom<\/b> = such as."}, {"h": "Rounding off", "t": "A good text ends clearly. <b>Slutligen<\/b> = finally, <b>kort sagt<\/b> = in short, <b>sammanfattningsvis<\/b> = to sum up. They are adverbs, so the verb follows: <b>Sammanfattningsvis<\/b> kan man säga att ... Use at most one in a short text, and keep the connectors for real links between ideas, not as decoration."}], "tables": [{"caption": "By meaning", "head": ["Job", "Connectors"], "rows": [["add", "<i>dessutom, även, också, för det första ... för det andra<\/i>"], ["contrast", "<i>men, däremot, å ena sidan ... å andra sidan, ändå, trots att, fast<\/i>"], ["cause", "<i>eftersom, därför att, på grund av, nämligen<\/i>"], ["result", "<i>därför, så, alltså, följaktligen<\/i>"], ["example", "<i>till exempel, bland annat, såsom<\/i>"], ["sum up", "<i>sammanfattningsvis, kort sagt, slutligen<\/i>"]]}, {"caption": "By word order", "head": ["Type", "Examples", "Order after it"], "rows": [["joiner", "<b>och, men, eller, så<\/b>", "subject, verb: <i>..., men vi gick ut.<\/i>"], ["bisats-word", "<b>eftersom, trots att, fast, om<\/b>", "subject, (inte), verb: <i>eftersom det regnade<\/i>"], ["adverb", "<b>därför, dessutom, däremot, alltså<\/b>", "verb, subject: <i>Därför stannade vi.<\/i>"]]}], "examples": [["Det regnade hela dagen. Därför stannade vi inne och spelade spel.", "It rained all day. That's why we stayed in and played games."], ["Vi gick ut trots att det regnade ganska mycket.", "We went out even though it was raining quite a lot."], ["Cykeln är billig. Dessutom är den både lätt och snygg.", "The bike is cheap. Besides, it is both light and good-looking."], ["Jag älskar sommaren. Min syster däremot tycker bäst om vintern.", "I love summer. My sister, on the other hand, likes winter best."], ["Eftersom bussen var sen kom vi försent till skolan.", "Because the bus was late we got to school late."], ["Hon har övat varje dag. Alltså borde hon klara provet.", "She has practised every day. So she should pass the test."], ["Jag vill inte gå, jag är nämligen väldigt trött.", "I don't want to go, because I am very tired, you see."], ["Många tycker om djur, till exempel katter, hundar och kaniner.", "Many people like animals, for example cats, dogs and rabbits."], ["Å ena sidan är staden kul, å andra sidan är den dyr.", "On the one hand the city is fun, on the other it is expensive."], ["Sammanfattningsvis kan man säga att idén är både enkel och bra.", "To sum up, one can say that the idea is both simple and good."]], "mistakes": [{"wrong": "Därför jag var sjuk stannade jag hemma.", "right": "Eftersom jag var sjuk stannade jag hemma.", "why": "<i>därför<\/i> is an adverb meaning 'that's why'. For 'because' at the start of a sub-part use <b>eftersom<\/b>."}, {"wrong": "Dessutom jag gillar glass.", "right": "Dessutom gillar jag glass.", "why": "After an adverb in first place the verb comes next (verb-second rule). English keeps subject first."}, {"wrong": "Eftersom det regnade, vi stannade inne.", "right": "Eftersom det regnade stannade vi inne.", "why": "When a bisats comes first, the main clause that follows has the verb first. The bisats counts as the first 'slot'."}, {"wrong": "Vi gick ut trots det regnade.", "right": "Vi gick ut trots att det regnade.", "why": "<i>trots<\/i> alone goes with a noun (<i>trots regnet<\/i>). Before a whole clause you need <b>trots att<\/b>."}], "trick": "Ask what follows the connector. After därför, dessutom, däremot, alltså: verb next (they take the subject's seat). After eftersom, trots att, fast: subject first, then verb, like a normal bisats. After och, men, så: nothing changes.", "check": [{"q": "Det regnade. ___ stannade vi inne. (that's why)", "a": "Därför", "why": "A result adverb, followed by verb-subject order."}, {"q": "Vi gick ut ___ ___ det regnade. (despite the fact that)", "a": "trots att", "why": "A bisats needs trots att."}, {"q": "Sortera: Dessutom (jag / gillar) glass.", "a": "Dessutom gillar jag glass.", "why": "Verb second after an adverb."}, {"q": "Jag gillar kaffe. Min bror ___ gillar te. (on the other hand)", "a": "däremot", "why": "däremot contrasts two things."}, {"q": "Which starts a bisats meaning 'because': eftersom or därför?", "a": "eftersom", "why": "därför is the 'that's why' adverb."}]}, {"id": "satsadv", "title": "Ju, väl, nog and friends: Swedish mood words", "level": "B2", "hook": "You will be able to add the small feelings that make Swedish sound natural: 'as we both know', 'right?', 'probably', 'actually'. Without them your Swedish is correct but flat.", "steps": [{"h": "What mood words do", "t": "In English we show feelings with tone of voice or little phrases: 'you know', 'I guess', 'surely', 'actually'. Swedish packs the same job into tiny words that sit inside the sentence. They do not change the facts, only the attitude: is this news, a reminder, a hope, a guess? Grammar books call them <b>sentence adverbs<\/b>: small words like <i>inte<\/i>, <i>ju<\/i> or <i>nog<\/i> that say something about the whole sentence rather than about one word."}, {"h": "Where they go: the same seat as inte", "t": "A <b>main clause<\/b> is a sentence that can stand on its own. In a main clause the mood word sits straight after the verb (and after the subject if the subject comes second): Vi har <b>ju<\/b> prov. A <b>bisats<\/b> (a sub-part that cannot stand alone, starting with words like <i>att<\/i>, <i>eftersom<\/i>, <i>om<\/i>) puts the mood word before the verb: ...att vi <b>ju<\/b> har prov. The simplest test: wherever <i>inte<\/i> would go, a mood word can go too. If the sentence starts with something else, such as <i>Idag<\/i>, the verb comes first, then the subject, then the mood word: Idag har vi <b>ju<\/b> prov."}, {"h": "Ju, väl and nog", "t": "<b>ju<\/b> means 'as you know' or 'of course': you remind the other person of something you both already know. Vi har <b>ju<\/b> prov idag! <b>väl<\/b> means 'I suppose / right?': you think something is true and invite agreement. Du kommer <b>väl<\/b>? = 'You are coming, right?' <b>nog<\/b> means 'probably' or 'I bet': Det blir <b>nog<\/b> regn. Careful: <i>nog<\/i> does <b>not<\/b> mean 'enough' when it sits in the middle of a sentence. 'Enough' is <i>tillräckligt<\/i>."}, {"h": "Ändå, faktiskt and visst", "t": "<b>ändå<\/b> = 'anyway, all the same': Det regnade, men vi badade <b>ändå<\/b>. <b>faktiskt<\/b> = 'actually, really', often for something surprising: Jag vann <b>faktiskt<\/b>! <b>visst<\/b> = 'apparently, it seems' when you have heard something: Han har <b>visst<\/b> flyttat. Note that <i>visst<\/i> at the start of a question, <i>Visst är det kallt?<\/i>, means 'it is cold, isn't it?'. The meaning follows the situation."}, {"h": "Using several together", "t": "Mood words team up with <i>inte<\/i>. The mood word usually comes first and <i>inte<\/i> after it: Du har <b>väl<\/b> inte glömt det? = 'You have not forgotten it, have you?' Det är <b>nog<\/b> inte sant = 'It is probably not true.' Do not pile on more than two. And remember the position rule: they are tucked inside the sentence, not stuck at the front like English 'surely'."}], "tables": [{"caption": "What each word adds", "head": ["Word", "Feeling", "English helper", "Example"], "rows": [["<b>ju<\/b>", "you already know this", "as you know", "<i>Vi har ju prov idag!<\/i>"], ["<b>väl<\/b>", "hoping you agree", "right? / I suppose", "<i>Du kommer väl?<\/i>"], ["<b>nog<\/b>", "a guess", "probably / I bet", "<i>Det blir nog regn.<\/i>"], ["<b>ändå<\/b>", "in spite of that", "anyway, still", "<i>Vi badade ändå.<\/i>"], ["<b>faktiskt<\/b>", "surprising truth", "actually", "<i>Jag vann faktiskt!<\/i>"], ["<b>visst<\/b>", "what I have heard", "apparently", "<i>Han har visst flyttat.<\/i>"]]}, {"caption": "Position: the seat of inte", "head": ["Sentence type", "Order", "Example"], "rows": [["Main clause", "verb, then mood word", "<i>Vi har <b>ju<\/b> prov.<\/i>"], ["Starts with another word", "verb, subject, mood word", "<i>Idag har vi <b>ju<\/b> prov.<\/i>"], ["Bisats", "mood word, then verb", "<i>... att vi <b>ju<\/b> har prov.<\/i>"]]}], "examples": [["Vi har ju prov i morgon, så jag måste plugga.", "We have a test tomorrow, as you know, so I have to study."], ["Du kommer väl på min födelsedag på lördag?", "You are coming to my birthday on Saturday, right?"], ["Det blir nog regn i kväll, tror jag.", "It will probably rain tonight, I think."], ["Det regnade hela dagen, men vi badade ändå i sjön.", "It rained all day, but we swam in the lake anyway."], ["Jag klarade faktiskt provet utan att plugga mycket.", "I actually passed the test without studying much."], ["Han har visst flyttat till Göteborg i somras.", "He has apparently moved to Gothenburg this summer."], ["Hon sa att hon ju inte kunde komma.", "She said that, as you know, she could not come."], ["Du har väl inte glömt mina nycklar igen?", "You haven't forgotten my keys again, have you?"], ["Det är ju helt omöjligt att hinna med bussen!", "It is simply impossible to catch the bus, after all!"], ["Maten smakade faktiskt mycket bättre än jag trodde.", "The food actually tasted much better than I thought."]], "mistakes": [{"wrong": "Vi ju har prov idag.", "right": "Vi har ju prov idag.", "why": "In a main clause the mood word comes after the verb, the same place as <i>inte<\/i>. English adverbs often sit before the verb, which tempts you."}, {"wrong": "Jag vet att vi har ju prov.", "right": "Jag vet att vi ju har prov.", "why": "After <i>att<\/i> you are in a bisats, where the mood word jumps in front of the verb."}, {"wrong": "Är du nog stor för att åka?", "right": "Är du tillräckligt stor för att åka?", "why": "<i>nog<\/i> means 'probably', not 'enough'. 'Enough' is <i>tillräckligt<\/i>."}, {"wrong": "Väl, jag vet inte.", "right": "Tja, jag vet inte.", "why": "<i>väl<\/i> is not the filler 'well' at the start of a sentence. It lives inside the sentence and asks for agreement. For the filler use <i>tja<\/i> or <i>nja<\/i>."}], "trick": "Put the word where inte would sit. Then pick the feeling: ju = 'we both know', väl = 'right?', nog = 'I bet', faktiskt = 'whoa, really'.", "check": [{"q": "Vi ___ har prov idag! (as you know, a reminder)", "a": "ju", "why": "ju reminds the listener of something shared."}, {"q": "Det blir ___ snö i kväll. (probably)", "a": "nog", "why": "nog = probably."}, {"q": "Du kommer ___, eller hur? Pick the 'I hope so, right?' word: ju / väl / faktiskt", "a": "väl", "why": "väl invites agreement."}, {"q": "Rätta: Jag tror att han har ju glömt det.", "a": "Jag tror att han ju har glömt det.", "why": "In a bisats the mood word goes before the verb."}, {"q": "Which Swedish word fits 'enough' in 'Är du ___ stor?'", "a": "tillräckligt", "why": "nog does not mean enough here."}]}, {"id": "sin", "title": "Sin, sitt, sina: his own or someone else’s", "level": "B1", "hook": "You will be able to tell the difference between <i>Leo tar sin boll<\/i> (Leo’s own ball) and <i>Leo tar hans boll<\/i> (another boy’s ball). English cannot show this, but Swedish can, so you avoid confusing sentences.", "steps": [{"h": "Words for “whose”", "t": "A <b>possessive<\/b> is a word that shows who owns something, like <i>my<\/i>, <i>his<\/i> or <i>their<\/i>. For “I” and “you”, Swedish is simple: <i>min bok<\/i>, <i>din bok<\/i>, <i>vår bok<\/i>. For “he, she, they” there are two sets of words, and that is where the trouble starts."}, {"h": "Two sets for he, she, they", "t": "English says “Leo takes his ball” whether the ball is Leo’s or someone else’s. Swedish makes you choose. <b>Sin<\/b> means “his <b>own<\/b>” (the ball belongs to Leo): <i>Leo tar <b>sin<\/b> boll.<\/i> <b>Hans<\/b> means “his” but belonging to somebody else: <i>Leo tar <b>hans<\/b> boll<\/i> (another boy’s ball). For girls it is <i>sin<\/i> or <i>hennes<\/i>, and for several people <i>sin/sina<\/i> or <i>deras<\/i>."}, {"h": "The rule: does the subject own it?", "t": "The <b>subject<\/b> is the person or thing doing the action. If the owner is the subject of the <b>same<\/b> clause (a clause is a part of a sentence with its own verb), you use <b>sin<\/b>. In <i>Anna ser sin bror<\/i>, Anna is the subject and the brother is hers. In <i>Anna ser hennes bror<\/i> it is somebody else’s brother. Remember that <i>sin<\/i> is only for he, she, they, never for “I” or “you”: <i>Jag tar min väska.<\/i>"}, {"h": "Sin, sitt or sina?", "t": "Like other Swedish words, <i>sin<\/i> changes to match the <b>thing owned<\/b>, not the owner. An en-word gets <b>sin<\/b>: <i>sin bok<\/i>. An ett-word gets <b>sitt<\/b>: <i>sitt hus<\/i>. A plural gets <b>sina<\/b>: <i>sina skor<\/i>. So a girl can say <i>sitt hus<\/i> (house is an ett-word) and a boy can say <i>sin cykel<\/i>. The owner’s gender makes no difference."}, {"h": "The big exception: never in the subject", "t": "<i>Sin<\/i> can never be part of the subject itself, because it needs an owner that already is the subject. If you say “His mum is a teacher”, <i>his mum<\/i> is the subject, so you must use <b>hans<\/b>: <i>Hans mamma är lärare.<\/i> Saying “Sin mamma är lärare” is wrong."}], "tables": [{"caption": "Sin, sitt, sina", "head": ["en-word", "ett-word", "plural"], "rows": [["<b>sin<\/b> bok", "<b>sitt<\/b> hus", "<b>sina<\/b> skor"], ["Hon tar <b>sin<\/b> jacka.", "Han älskar <b>sitt<\/b> rum.", "De tar <b>sina<\/b> väskor."]]}, {"caption": "Own or someone else’s?", "head": ["Meaning", "Swedish"], "rows": [["Leo’s own ball", "Leo tar <b>sin<\/b> boll."], ["another boy’s ball", "Leo tar <b>hans<\/b> boll."], ["Anna’s own brother", "Anna ser <b>sin<\/b> bror."], ["somebody else’s brother", "Anna ser <b>hennes<\/b> bror."], ["in the subject", "<b>Hans<\/b> mamma är lärare."]]}], "examples": [["Leo tar sin boll och går ut.", "Leo takes his (own) ball and goes out."], ["Anna älskar sin lilla katt.", "Anna loves her (own) little cat."], ["Pojkarna äter sina smörgåsar i skolan.", "The boys eat their (own) sandwiches at school."], ["Min bror målar sitt rum i blått.", "My brother is painting his (own) room blue."], ["Hon ringer sin mormor varje söndag.", "She calls her (own) grandma every Sunday."], ["Alex ser inte hennes mamma i affären.", "Alex doesn't see her (someone else's) mum in the shop."], ["Jag tar min väska och du tar din.", "I take my bag and you take yours."], ["Hans pappa jobbar på sjukhuset.", "His dad works at the hospital."], ["Barnen borstar sina tänder varje kväll.", "The children brush their teeth every evening."]], "mistakes": [{"wrong": "Leo tar hans boll. (his own ball)", "right": "Leo tar sin boll.", "why": "English “his” covers both meanings. When the owner is the subject, Swedish needs <i>sin<\/i>. <i>Hans<\/i> would mean someone else’s ball."}, {"wrong": "Sin mamma är lärare.", "right": "Hans mamma är lärare.", "why": "<i>Sin<\/i> cannot stand in the subject. Use <i>hans<\/i>, <i>hennes<\/i> or <i>deras<\/i> there."}, {"wrong": "Hon älskar sin hus.", "right": "Hon älskar sitt hus.", "why": "<i>Sin/sitt/sina<\/i> agrees with the thing owned: <i>hus<\/i> is an ett-word."}, {"wrong": "Jag tar sin väska.", "right": "Jag tar min väska.", "why": "<i>Sin<\/i> is only for he, she, they. For “I” use <i>min/mitt/mina<\/i>."}], "trick": "Ask: “his <b>OWN<\/b>?” If you can add the word “own” and the owner is the subject, say <b>sin/sitt/sina<\/b>. If it is someone else’s, or the owner is inside the subject, say hans/hennes/deras.", "check": [{"q": "Leo tar ___ cykel. (his own)", "a": "sin", "why": "Owner is the subject, cykel is an en-word."}, {"q": "Sara älskar ___ hus. (her own)", "a": "sitt", "why": "Hus is an ett-word."}, {"q": "Barnen tar ___ skor. (their own)", "a": "sina", "why": "Skor is plural."}, {"q": "___ pappa är snäll. (Leo’s dad)", "a": "Hans", "why": "Sin is never used in the subject."}, {"q": "Leo ser ___ boll. (it is Max’s ball)", "a": "hans", "why": "It belongs to someone else."}]}, {"id": "tal", "title": "Numbers, dates, clock and prices", "level": "A1", "hook": "You will be able to count, say the date, tell the time (careful: halv tre is NOT half past three!) and ask what something costs. This is survival Swedish for shops, trains and appointments.", "steps": [{"h": "Counting", "t": "The numbers 1 to 12 are separate words (<i>ett, två, tre, fyra, fem, sex, sju, åtta, nio, tio, elva, tolv<\/i>). The 'teens' end in <i>-ton<\/i>: <i>tretton, fjorton, femton, sexton, sjutton, arton, nitton<\/i>. Tens end in <i>-tio<\/i> or <i>-go<\/i>: <i>tjugo, trettio, fyrtio, femtio, sextio, sjuttio, åttio, nittio<\/i>. Put them together without a gap: <i>tjugotre<\/i> (23). One is <b>en<\/b> with an en-word and <b>ett<\/b> with an ett-word: <i>en bil, ett hus<\/i>."}, {"h": "Ordinal numbers: first, second...", "t": "An <b>ordinal<\/b> says the order (1st, 2nd, 3rd), not the amount. The first ones are special: <i>första, andra, tredje, fjärde, femte, sjätte, sjunde, åttonde, nionde, tionde<\/i>. Many later ones add <i>-de<\/i>: <i>tjugonde<\/i> (20th), <i>trettionde<\/i>. In writing you can use a number plus a colon: <i>1:a, 2:a, 3:e<\/i>."}, {"h": "Dates", "t": "Swedish uses day first, then month: <i>den femte mars<\/i> or in numbers <i>5/3<\/i> (5 March). Months are not capitalised: <i>januari, februari, mars, april, maj, juni, juli, augusti, september, oktober, november, december<\/i>. Say the year in two halves or fully: <i>2026<\/i> = <i>tjugo tjugosex<\/i> or <i>tvåtusen tjugosex<\/i>."}, {"h": "Telling the time", "t": "Ask <i>Hur mycket är klockan?<\/i> and answer <i>Klockan är tre<\/i>. Now the tricky part: <b>halv tre<\/b> is half an hour <i>before<\/i> three, so it is <b>2:30<\/b>. Swedes count towards the next full hour. <i>Kvart över tre<\/i> is 3:15, <i>kvart i tre<\/i> is 2:45, <i>fem över tre<\/i> is 3:05. For 'at' a time, say <i>klockan<\/i>: <i>Vi ses klockan åtta<\/i>. In writing, 24-hour time is common: <i>14.30<\/i>."}, {"h": "Prices", "t": "Ask <i>Hur mycket kostar det?<\/i> and answer <i>Det kostar 50 kronor<\/i>. Money words: <i>krona<\/i> (singular), <i>kronor<\/i> (plural, written kr) and <i>öre<\/i> (cents). Swedes use a comma for decimals and a space for thousands: <i>12,50 kr<\/i>, <i>1 200 kr<\/i>. Say <i>femtio kronor<\/i>, not <i>femtio krona<\/i>."}], "tables": [{"caption": "Cardinal and ordinal numbers", "head": ["Number", "Count", "Order (1st...)"], "rows": [["1", "ett / en", "första"], ["2", "två", "andra"], ["3", "tre", "tredje"], ["4", "fyra", "fjärde"], ["5", "fem", "femte"], ["10", "tio", "tionde"], ["12", "tolv", "tolfte"], ["20", "tjugo", "tjugonde"], ["21", "tjugoett / tjugoen", "tjugoförsta"]]}, {"caption": "Clock times (halv = half hour BEFORE)", "head": ["Digital", "Say it", "English"], "rows": [["3.00", "klockan tre", "three o'clock"], ["3.15", "kvart över tre", "quarter past three"], ["2.30", "halv tre", "half past two"], ["2.45", "kvart i tre", "quarter to three"], ["3.30", "halv fyra", "half past three"], ["3.50", "tio i fyra", "ten to four"]]}], "examples": [["Jag har tre syskon och två katter.", "I have three siblings and two cats."], ["Det här huset kostar fyra miljoner kronor.", "This house costs four million kronor."], ["Hon är tjugofem år gammal.", "She is twenty-five years old."], ["Min födelsedag är den tolfte juni.", "My birthday is on the twelfth of June."], ["Det här är hans tredje försök.", "This is his third attempt."], ["Mötet börjar klockan halv tio.", "The meeting starts at 9:30."], ["Tåget går kvart över åtta.", "The train leaves at a quarter past eight."], ["Vi ses halv sju vid stationen.", "We will meet at 6:30 at the station."], ["Hur mycket kostar kaffet? Trettiofem kronor.", "How much is the coffee? Thirty-five kronor."], ["Den första maj är det ledigt.", "The first of May is a day off."], ["Fotbollsmatchen slutade klockan tjugo över nio.", "The football match ended at twenty past nine."], ["Det kostar 12,50 kr.", "It costs 12.50 kr."]], "mistakes": [{"wrong": "Vi ses klockan halv fyra. (meaning 4:30)", "right": "Vi ses klockan halv fem.", "why": "<i>Halv fyra<\/i> is 3:30. Always name the hour you are heading towards."}, {"wrong": "Det är den femte av mars.", "right": "Det är den femte mars.", "why": "No 'of' in Swedish dates: day, then month."}, {"wrong": "Det kostar femtio krona.", "right": "Det kostar femtio kronor.", "why": "After a number, <i>krona<\/i> becomes the plural <i>kronor<\/i>."}, {"wrong": "Jag är tjugo och ett år.", "right": "Jag är tjugoett år.", "why": "Compound numbers are written as one word without 'and'."}], "trick": "Swedish time looks forward: halv = half the way TO the next hour. Halv tre = 2:30, so always say the number of the hour that is coming.", "check": [{"q": "2:30 on the clock is: halv ___", "a": "tre", "why": "Half the way to three."}, {"q": "Say 3:45: kvart ___ fyra", "a": "i", "why": "'Quarter to four' uses <i>i<\/i>."}, {"q": "The third of April: den ___ april", "a": "tredje", "why": "Ordinal for 3 is tredje."}, {"q": "Det kostar hundra ___. (krona)", "a": "kronor", "why": "Plural after a number."}, {"q": "19 in words:", "a": "nitton", "why": "The teens end in -ton."}, {"q": "Hon har ___ bil. (one, en-word)", "a": "en", "why": "Use en with an en-word."}]}, {"id": "tanka", "title": "Tycker, tror, tänker: three ways to think", "level": "B1", "hook": "You'll choose the right Swedish verb when you say 'I think...' whether it is an opinion, a guess or a thought. English uses one word for all three, Swedish uses three, and mixing them up sounds odd.", "steps": [{"h": "One English word, three Swedish verbs", "t": "A verb is an action word, like play, go or think. English uses <i>think<\/i> for everything: 'I think it's good', 'I think it will rain', 'I think about you'. Swedish splits this into <b>tycka<\/b>, <b>tro<\/b> and <b>tänka<\/b>. Before you speak, ask yourself: what kind of thinking is this?"}, {"h": "Tycka: your opinion or taste", "t": "Use <b>tycka<\/b> when you say how you feel about something, such as whether a film is good or a food is tasty. Nobody can prove an opinion wrong. It is usually followed by <b>att<\/b> (that) and a full sentence: <i>Jag tycker att filmen är bra.<\/i> To say you <i>like<\/i> something, add <b>om<\/b>: <i>Jag tycker om pizza.<\/i> Without <i>om<\/i> it is only an opinion, with <i>om<\/i> it means 'like'."}, {"h": "Tro: a guess or a belief", "t": "Use <b>tro<\/b> when you are not sure and it could turn out to be wrong, like the weather tomorrow or where someone is. <i>Jag tror att det blir regn.<\/i> It also means believe or have faith: <i>Jag tror på dig<\/i> (I believe in you). A good test: could you check later and find out you were wrong? Then it is <i>tro<\/i>."}, {"h": "Tänka: thinking in your head, or planning", "t": "<b>Tänka<\/b> is the actual act of thinking, using your brain. With <b>på<\/b> it means 'think about / think of': <i>Jag tänker på dig.<\/i> With another verb in its basic form (for example <i>åka<\/i>, to go) it means 'plan to' or 'intend to': <i>Jag tänker åka hem.<\/i> The present form is <i>tänker<\/i>."}, {"h": "The tricky overlaps", "t": "'What do you think of the film?' asks for an opinion, so it is <b>Vad tycker du om filmen?<\/b> 'I think so' is <b>Jag tror det<\/b>, because you are not sure. Saying <i>Jag tror att filmen är bra<\/i> would mean you have not seen it but guess it is good. And 'I'm thinking about dinner' is <i>Jag tänker på middagen<\/i>."}], "tables": [{"caption": "Which think?", "head": ["Verb", "Meaning", "Ask yourself", "Example"], "rows": [["<b>tycka<\/b>", "opinion, taste", "Is it how I feel?", "<i>Jag tycker att det är gott.<\/i>"], ["<b>tro<\/b>", "guess, believe", "Could I be wrong?", "<i>Jag tror att han kommer.<\/i>"], ["<b>tänka<\/b>", "think, plan", "Is it in my head or a plan?", "<i>Jag tänker åka hem.<\/i>"]]}, {"caption": "Small words that change the meaning", "head": ["Swedish", "English"], "rows": [["<b>tycka om<\/b> pizza", "to like pizza"], ["<b>tro på<\/b> dig", "to believe in you"], ["<b>tänka på<\/b> dig", "to think about you"], ["<b>tänka<\/b> + verb", "to plan to do something"]]}], "examples": [["Jag tycker att matematik är ganska roligt.", "I think maths is quite fun."], ["Jag tror att bussen kommer om fem minuter.", "I think the bus will come in five minutes."], ["Jag tänker ofta på min kusin i Norge.", "I often think about my cousin in Norway."], ["Vi tänker bygga en snögubbe i morgon.", "We are planning to build a snowman tomorrow."], ["Hon tycker om att rita i sin skissbok.", "She likes drawing in her sketchbook."], ["Jag tror att han är hemma nu.", "I think he is at home now."], ["Vad tycker du om den nya skolan?", "What do you think of the new school?"], ["Tror du verkligen på spöken i den gamla skolan?", "Do you really believe in ghosts in the old school?"], ["Min bror tycker att katter är bättre än hundar.", "My brother thinks cats are better than dogs."], ["Jag tänker inte säga något förrän jag har tänkt färdigt.", "I won't say anything until I have finished thinking."]], "mistakes": [{"wrong": "Jag tänker att filmen är bra.", "right": "Jag tycker att filmen är bra.", "why": "An opinion about something is tycka. Tänka is for thinking in your head or planning."}, {"wrong": "Jag tycker att det blir regn i morgon.", "right": "Jag tror att det blir regn i morgon.", "why": "A forecast can turn out wrong, so it is a guess (tro), not an opinion."}, {"wrong": "Jag tänker dig.", "right": "Jag tänker på dig.", "why": "'Think about' needs the little word på. English 'about' becomes på."}, {"wrong": "Jag tycker pizza.", "right": "Jag tycker om pizza.", "why": "To like something you need tycka om. Plain tycka needs an opinion sentence."}], "trick": "Opinion = tycka, maybe = tro, head or plan = tänka. Ask 'Could someone prove me wrong?' If yes, it is <b>tro<\/b>. If it is just my taste, it is <b>tycka<\/b>. And <i>tycka om<\/i> = like.", "check": [{"q": "Jag ___ att det blir snö i morgon. (I'm not sure)", "a": "tror", "why": "A guess about the future is tro."}, {"q": "Jag ___ att den här låten är jättebra. (my opinion)", "a": "tycker", "why": "An opinion or taste is tycka."}, {"q": "Jag ___ på dig. (I'm thinking about you)", "a": "tänker", "why": "Thinking in your head is tänka, with på."}, {"q": "Jag ___ åka till Göteborg i sommar. (I plan to)", "a": "tänker", "why": "Tänka + verb means plan or intend."}, {"q": "Jag tycker ___ glass. (I like ice cream)", "a": "om", "why": "Tycka om = to like."}]}, {"id": "tempus", "title": "Past and perfect: åt, har ätit, hade ätit", "level": "B1", "hook": "You will be able to choose between 'I ate', 'I have eaten' and 'I had eaten', and know why 'Jag har bott här i tre år' is different from 'Jag bodde här i tre år'. This is what makes your timeline clear.", "steps": [{"h": "Four tenses", "t": "<b>Tense<\/b> means the verb form that shows when something happens. Swedish has four to know here: <b>presens<\/b> (<i>äter<\/i>, now), <b>preteritum<\/b> (<i>åt<\/i>, finished past), <b>perfekt<\/b> (<i>har ätit<\/i>, 'have eaten') and <b>pluskvamperfekt<\/b> (<i>hade ätit<\/i>, 'had eaten'). The last two are built with a helper (<i>har<\/i> or <i>hade<\/i>) plus the <b>supinum<\/b>, the special verb form (<i>ätit<\/i>) that only follows those helpers."}, {"h": "Preteritum: a finished moment", "t": "Use the simple past when the time is named or clear, and it is over: <i>Igår åt jag fisk<\/i>, <i>Hon ringde för en timme sedan<\/i> (an hour ago), <i>Vi flyttade 2019<\/i>. If you give a specific past time (igår, förra veckan, 2019, i måndags), the verb is preteritum."}, {"h": "Perfekt: past with a link to now", "t": "Use <b>har<\/b> + supinum when the time is not named, or when it still matters or continues now. <i>Jag har varit i Rom<\/i> (some time in my life, no date). <i>Jag har bott här i tre år<\/i> (and I still live here). Time words that go with the perfect: <i>aldrig, redan, ännu inte, hittills, ofta, sedan 2020, i tre år<\/i>. Never combine the perfect with a named past time: not <i>har ätit igår<\/i>."}, {"h": "Compare the two lives", "t": "<i>Jag har bott i Lund i tre år<\/i> = I still live in Lund. <i>Jag bodde i Lund i tre år<\/i> = I do not live there any more. English does the same with 'have lived' and 'lived'. In Swedish this difference is very important, and it is a place where English speakers sometimes use the wrong form."}, {"h": "Pluskvamperfekt: before another past event", "t": "Use <b>hade<\/b> + supinum for something that happened <i>before<\/i> another thing in the past: <i>När jag kom fram hade tåget redan gått<\/i> (When I arrived, the train had already gone). One event is in the simple past (<i>kom<\/i>) and the earlier one is in the pluperfect (<i>hade gått<\/i>). It is the 'past of the past'."}], "tables": [{"caption": "Four tenses of three verbs", "head": ["Verb", "presens", "preteritum", "perfekt", "pluskvamperfekt"], "rows": [["äta (eat)", "äter", "åt", "har ätit", "hade ätit"], ["se (see)", "ser", "såg", "har sett", "hade sett"], ["bo (live)", "bor", "bodde", "har bott", "hade bott"], ["köpa (buy)", "köper", "köpte", "har köpt", "hade köpt"]]}, {"caption": "Clues for choosing the tense", "head": ["Clue", "Tense", "Example"], "rows": [["nu, idag, varje dag", "presens", "Jag <b>äter<\/b> nu."], ["igår, förra året, 2019, för ... sedan", "preteritum", "Jag <b>åt<\/b> igår."], ["aldrig, redan, hittills, i tre år (still true)", "perfekt", "Jag <b>har<\/b> aldrig <b>ätit<\/b> ostron."], ["redan när ..., innan", "pluskvamperfekt", "Jag <b>hade<\/b> redan <b>ätit<\/b>."]]}], "examples": [["Igår såg vi en film på bio.", "Yesterday we saw a film at the cinema."], ["Har du sett den nya filmen?", "Have you seen the new film?"], ["Jag har aldrig åkt skidor.", "I have never been skiing."], ["Min syster har bott i Berlin sedan 2021.", "My sister has lived in Berlin since 2021."], ["Hon bodde i Paris i fem år och flyttade sedan hem.", "She lived in Paris for five years and then moved home."], ["För tio år sedan köpte vi det här huset.", "Ten years ago we bought this house."], ["När jag ringde hade han redan gått hem.", "When I called, he had already gone home."], ["Vi hade just ätit när gästerna kom.", "We had just eaten when the guests arrived."], ["Har du redan packat väskan?", "Have you already packed the bag?"], ["Förra sommaren reste vi till Grekland.", "Last summer we travelled to Greece."], ["Jag har arbetat här hittills i två månader.", "I have worked here for two months so far."], ["Hon sa att hon hade glömt sina nycklar.", "She said that she had forgotten her keys."]], "mistakes": [{"wrong": "Jag har träffat honom igår.", "right": "Jag träffade honom igår.", "why": "With a named past time like <i>igår<\/i> you need the simple past, not the perfect."}, {"wrong": "Jag bodde här i tre år. (I still live here)", "right": "Jag har bott här i tre år.", "why": "If it is still true, use the perfect. The past form says it is over."}, {"wrong": "När jag kom hade bussen redan gick.", "right": "När jag kom hade bussen redan gått.", "why": "After <i>har<\/i> and <i>hade<\/i> you need the supinum (gått), not the past tense (gick)."}, {"wrong": "Jag har varit aldrig i Rom.", "right": "Jag har aldrig varit i Rom.", "why": "In a main clause <i>aldrig<\/i> goes between <i>har<\/i> and the supinum."}], "trick": "Named time (igår, 2019) = simple past. No named time, or still going = har + supinum. An earlier past inside a story = hade + supinum.", "check": [{"q": "Igår ___ jag pizza. (äta)", "a": "åt", "why": "Named time: simple past."}, {"q": "Jag har ___ den filmen. (se)", "a": "sett", "why": "After har: supinum of se."}, {"q": "När vi kom hade filmen redan ___. (börja)", "a": "börjat", "why": "After hade: supinum."}, {"q": "Min bror ___ bott här i tre år. (still lives)", "a": "har", "why": "Still true now: perfect."}, {"q": "För två år ___ flyttade vi. (ago)", "a": "sedan", "why": "för ... sedan = ago."}, {"q": "Han ___ aldrig ätit sushi. (has)", "a": "har", "why": "aldrig goes with the perfect."}]}, {"id": "tvarv", "title": "Verbs with and without an object: lägga or ligga?", "level": "B1", "hook": "You will be able to tell apart lägga and ligga, sätta and sitta, ställa and stå, and use verbs like känna sig and skynda sig correctly. These are classic traps for English speakers.", "steps": [{"h": "Does the verb take an object?", "t": "The <b>object<\/b> is the thing or person that receives the action. A <b>transitive<\/b> verb needs an object: <i>Jag läser en bok<\/i> (what do I read? a book). An <b>intransitive<\/b> verb does not: <i>Jag sover<\/i>. Many verbs can do both, like <i>äta<\/i> (<i>Jag äter<\/i>, <i>Jag äter frukost<\/i>), but some verbs come as a pair, one for each job."}, {"h": "Pairs: put it or be there?", "t": "Three pairs are very common. The <b>transitive<\/b> one is about <b>putting<\/b> something somewhere: <i>lägga<\/i> (lay down), <i>sätta<\/i> (set), <i>ställa<\/i> (stand something up). The <b>intransitive<\/b> one is about <b>being<\/b> there: <i>ligga<\/i> (lie), <i>sitta<\/i> (sit), <i>stå<\/i> (stand). So <i>Jag lägger boken på bordet<\/i>, then <i>Boken ligger på bordet<\/i>. English uses 'lay/lie' for both and confuses many."}, {"h": "Forms of the pairs", "t": "Learn them together with their forms: <i>lägga, lägger, la(de), lagt<\/i> and <i>ligga, ligger, låg, legat<\/i>. <i>Sätta, sätter, satte, satt<\/i> and <i>sitta, sitter, satt, suttit<\/i>. <i>Ställa, ställer, ställde, ställt<\/i> and <i>stå, står, stod, stått<\/i>. Notice that <i>satt<\/i> is the past of sitta (<i>Jag satt där<\/i>) and also the supinum of sätta (<i>Jag har satt den där<\/i>)."}, {"h": "Reflexive verbs", "t": "A <b>reflexive verb<\/b> comes with a '-self' word (mig, dig, sig, oss, er) that is part of the verb. You must include it: <i>känna sig<\/i> (to feel), <i>skynda sig<\/i> (to hurry), <i>sätta sig<\/i> (to sit down), <i>lägga sig<\/i> (to go to bed), <i>raka sig<\/i> (to shave). <i>Jag känner mig trött<\/i>, <i>Hon skyndar sig<\/i>, <i>Skynda dig!<\/i>"}, {"h": "Which sig?", "t": "Use <i>mig<\/i> after jag, <i>dig<\/i> after du, <i>oss<\/i> after vi, <i>er<\/i> after ni, and <b>sig<\/b> after han, hon, den, det and de. It goes straight after the verb: <i>Vi känner oss glada<\/i>. In a question or after another word the verb comes first: <i>Känner du dig trött?<\/i> Do not drop it: Swedish says <i>Jag känner mig bra<\/i>, not 'jag känner bra'."}], "tables": [{"caption": "Put it there, or be there", "head": ["Putting (needs object)", "Being (no object)", "English"], "rows": [["lägga, lägger", "ligga, ligger", "lay / lie"], ["sätta, sätter", "sitta, sitter", "set / sit"], ["ställa, ställer", "stå, står", "stand something / stand"]]}, {"caption": "Reflexive verb känna sig", "head": ["Who", "Example"], "rows": [["jag", "Jag känner <b>mig<\/b> trött."], ["du", "Du känner <b>dig<\/b> trött."], ["han / hon", "Hon känner <b>sig<\/b> trött."], ["vi", "Vi känner <b>oss<\/b> trötta."], ["ni", "Ni känner <b>er<\/b> trötta."], ["de", "De känner <b>sig<\/b> trötta."]]}], "examples": [["Jag lägger nycklarna på hyllan.", "I am putting the keys on the shelf."], ["Nycklarna ligger på hyllan.", "The keys are lying on the shelf."], ["Hon satte sig vid fönstret och läste.", "She sat down by the window and read."], ["Katten sitter på soffan.", "The cat is sitting on the sofa."], ["Han ställde vasen på bordet.", "He put the vase on the table."], ["Vasen står på bordet.", "The vase is on the table."], ["Jag känner mig trött efter jobbet.", "I feel tired after work."], ["Skynda dig, annars missar vi bussen!", "Hurry up, or we will miss the bus!"], ["Barnen lade sig klockan åtta.", "The children went to bed at eight."], ["Vi har legat på stranden hela dagen.", "We have been lying on the beach all day."], ["Han rakar sig varje morgon.", "He shaves every morning."], ["Hon sover, så vi måste vara tysta.", "She is sleeping, so we have to be quiet."]], "mistakes": [{"wrong": "Boken lägger på bordet.", "right": "Boken ligger på bordet.", "why": "The book is not being put by anyone. It just is there, so you need the 'being' verb ligga."}, {"wrong": "Jag lägger i sängen och läser.", "right": "Jag ligger i sängen och läser.", "why": "You are not putting something, you are lying yourself. Use ligga."}, {"wrong": "Jag känner trött.", "right": "Jag känner mig trött.", "why": "Känna with a feeling needs <i>mig<\/i>: you are feeling yourself tired."}, {"wrong": "Han skyndar inte.", "right": "Han skyndar sig inte.", "why": "The reflexive word is part of the verb and cannot be dropped."}], "trick": "If you can add 'something' (put SOMETHING there), it is lägga / sätta / ställa. If it is just 'be there', it is ligga / sitta / stå. Reflexive verbs always bring their own mig/dig/sig.", "check": [{"q": "Katten ___ på soffan. (ligga)", "a": "ligger", "why": "Being, not putting."}, {"q": "Jag ___ boken på hyllan. (lägga)", "a": "lägger", "why": "Putting something: lägga."}, {"q": "Skynda ___! (yourself)", "a": "dig", "why": "Order to du: dig."}, {"q": "Vasen ___ på bordet. (stå)", "a": "står", "why": "Being there."}, {"q": "Hon ___ sig vid bordet. (sätta, past)", "a": "satte", "why": "Reflexive sätta sig, past satte."}, {"q": "Vi känner ___ glada. (ourselves)", "a": "oss", "why": "Reflexive for vi: oss."}]}, {"id": "v2", "title": "Word order: the verb is in place 2", "level": "A2", "hook": "You will be able to start a Swedish sentence with a time or a place (like <i>idag<\/i> or <i>efter skolan<\/i>) and still build it correctly. This one rule is the biggest difference between English and Swedish sentences.", "steps": [{"h": "Subject and verb", "t": "A <b>verb<\/b> is an action word, like <i>play<\/i>, <i>go<\/i> or <i>eat<\/i>. The <b>subject<\/b> is the person or thing doing the action: in “I play football”, <i>I<\/i> is the subject and <i>play<\/i> is the verb. A <b>statement<\/b> is an ordinary sentence that tells you something (not a question). In a Swedish statement, the verb has a fixed position: it is always the <b>second<\/b> part of the sentence."}, {"h": "Place 2 means second part, not second word", "t": "Think of a sentence as a row of boxes. The verb always goes in box number 2. But a box can hold several words. In <i>Jag spelar fotboll idag<\/i>, box 1 is <i>Jag<\/i> and box 2 is <i>spelar<\/i>. In <i>Efter skolan går vi hem<\/i>, box 1 is <i>Efter skolan<\/i> (two words, but one idea: “when”), and box 2 is <i>går<\/i>. So the verb is the second <b>part<\/b>, not necessarily the second word."}, {"h": "What if the sentence starts with something else?", "t": "In English you can say “Today I play football”, with the subject first and the verb after. In Swedish that is wrong. If you put <i>idag<\/i> (today) in box 1, the verb must still go in box 2, so the subject has to move behind it: <i>Idag <b>spelar<\/b> jag fotboll<\/i>. We call this “flipping” the subject and the verb. Swedes do it all the time: with time words (<i>idag, på lördag, ibland<\/i>) or places (<i>där borta<\/i>)."}, {"h": "Questions and two verbs", "t": "If you start with a question word, the verb comes right after it: <i>Vad <b>gör<\/b> du?<\/i> (What do you do?), <i>Var <b>bor<\/b> du?<\/i> (Where do you live?). With a yes/no question the verb comes first: <i>Spelar du fotboll?<\/i>. If there are two verbs, only the first one has to be in box 2: <i>Imorgon <b>ska<\/b> vi spela fotboll<\/i> (“Tomorrow will we play football”). The second verb goes after the subject, later in the sentence."}, {"h": "A quick check", "t": "To check a sentence, find the verb that shows time (like <i>spelar, går, ska<\/i>) and count the boxes before it. There should be exactly one. Small connecting words like <i>och<\/i> (and) and <i>men<\/i> (but) do not count as a box: <i>Jag är trött, men jag spelar ändå<\/i> still has <i>jag<\/i> in box 1 and <i>spelar<\/i> in box 2 of the second part."}], "tables": [{"caption": "The verb always stays in box 2", "head": ["1", "2 (verb)", "3", "4"], "rows": [["Jag", "<b>spelar<\/b>", "fotboll", "idag."], ["Idag", "<b>spelar<\/b>", "jag", "fotboll."], ["Efter skolan", "<b>går<\/b>", "vi", "hem."], ["Imorgon", "<b>ska<\/b>", "vi", "spela fotboll."], ["Vad", "<b>gör<\/b>", "du", "på lördag?"]]}, {"caption": "English versus Swedish", "head": ["English (fine)", "Swedish (wrong)", "Swedish (right)"], "rows": [["Today I play", "Idag jag spelar", "Idag <b>spelar<\/b> jag"], ["After school we go home", "Efter skolan vi går hem", "Efter skolan <b>går<\/b> vi hem"], ["Tomorrow we will travel", "I morgon vi ska resa", "I morgon <b>ska<\/b> vi resa"]]}], "examples": [["Idag spelar jag fotboll med mina vänner.", "Today I am playing football with my friends."], ["På lördagar sover min pappa länge.", "On Saturdays my dad sleeps late."], ["Efter skolan går vi hem och äter mellanmål.", "After school we go home and have a snack."], ["I morgon åker vi till mormor.", "Tomorrow we are going to grandma's."], ["Ibland tittar hon på film på kvällen.", "Sometimes she watches a film in the evening."], ["Varje morgon dricker jag en kopp te.", "Every morning I drink a cup of tea."], ["Där borta ligger vår nya skola.", "Over there is our new school."], ["I kväll ska jag laga middag.", "Tonight I am going to cook dinner."], ["Om en timme börjar lektionen.", "In an hour the lesson begins."]], "mistakes": [{"wrong": "Idag jag spelar fotboll.", "right": "Idag spelar jag fotboll.", "why": "English allows “Today I play”. In Swedish the verb must be in box 2, so it jumps in front of the subject."}, {"wrong": "Efter skolan vi går hem.", "right": "Efter skolan går vi hem.", "why": "<i>Efter skolan<\/i> is one box, so the verb is next."}, {"wrong": "I morgon vi ska åka till stan.", "right": "I morgon ska vi åka till stan.", "why": "With two verbs, the first one (<i>ska<\/i>) takes box 2."}, {"wrong": "Vad du gör?", "right": "Vad gör du?", "why": "After a question word the verb comes straight away, then the subject."}], "trick": "Verb = second boss. Whatever comes first, the verb takes the second seat, and the subject sits down after it.", "check": [{"q": "Start with “Idag”: jag spelar fotboll.", "a": "Idag spelar jag fotboll.", "why": "The verb stays in box 2, so jag moves behind it."}, {"q": "Efter lektionen ___ vi hem. (gå)", "a": "går", "why": "The verb comes right after the first box."}, {"q": "Correct it: I morgon vi ska åka.", "a": "I morgon ska vi åka.", "why": "The first verb must be in box 2."}, {"q": "Start with “På lördagar”: min pappa sover länge.", "a": "På lördagar sover min pappa länge.", "why": "Time first, then verb, then subject."}, {"q": "In “Varje dag dricker jag te”, how many boxes come before the verb?", "a": "One", "why": "“Varje dag” is a single box, then the verb."}]}, {"id": "v2b", "title": "Longer sentences: the verb stays in place two", "level": "B1", "hook": "You will be able to start a sentence with a time, a reason or a whole clause and still get the verb in the right spot. This is the most important word-order rule in Swedish, and it is what lets you build long, flowing sentences.", "steps": [{"h": "The verb takes the second place", "t": "In a Swedish main clause (a clause that can stand alone) the verb, which is the action word like <i>äter<\/i> (eats) or <i>kom<\/i> (came), always takes the <b>second place<\/b>. Think of the sentence as a row of seats. Seat 1 holds whatever comes first, and the verb must sit in <b>seat 2<\/b>. In a simple sentence the subject (who does the action) is in seat 1: <i>Jag <b>åt<\/b> middag.<\/i>"}, {"h": "If something else comes first, the subject moves behind the verb", "t": "You are free to put another piece in seat 1, for example a time word like <i>igår<\/i> (yesterday) or <i>sedan<\/i> (then). The verb still has to be in seat 2, so the subject moves behind it. <i>Igår <b>åt<\/b> jag middag.<\/i> English does this less often (<i>Yesterday I ate dinner<\/i>), but Swedish does it every time. This swap is called <b>inversion<\/b>."}, {"h": "A whole clause can sit in seat 1", "t": "Seat 1 can hold one word, a few words, or even a whole <b>bisats<\/b> (a subordinate clause, which cannot stand alone, like <i>när jag kom hem<\/i>). The entire bisats counts as <b>one<\/b> piece. So the verb of the main clause comes right after it. <i>När jag kom hem, <b>åt<\/b> jag middag.<\/i> <i>Om det regnar, <b>stannar<\/b> vi inne.<\/i> A comma is common between the two parts."}, {"h": "Adverbs and linking adverbs also take seat 1", "t": "Words like <b>därför<\/b> (therefore), <b>sedan<\/b> (then), <b>då<\/b> (then), <b>nu<\/b> (now), <b>idag<\/b> (today) and <b>ibland<\/b> (sometimes) are adverbs, meaning words that add detail to the verb. When they begin the sentence, the verb follows at once: <i>Därför <b>kom<\/b> jag sent.<\/i> <i>Sedan <b>gick<\/b> vi hem.<\/i> The word <b>kanske<\/b> (maybe) is a little flexible, because you can say <i>Jag kanske kommer<\/i> or <i>Kanske kommer jag<\/i>."}, {"h": "Two verbs: the first one is in seat 2", "t": "When there are two verbs, like <i>ska handla<\/i> (will shop) or <i>har ätit<\/i> (have eaten), only the first one sits in seat 2. The other goes later in the sentence. <i>Imorgon <b>ska<\/b> jag handla.<\/i> <i>Idag <b>har<\/b> jag ätit två smörgåsar.<\/i> Linking words such as <i>och<\/i> and <i>men<\/i> do not take up a seat, so <i>Jag åt, och sedan gick jag hem<\/i> is fine."}], "tables": [{"caption": "The verb always sits in place 2", "head": ["Place 1", "Place 2 (verb)", "Place 3", "The rest"], "rows": [["Jag", "<b>åt<\/b>", "middag", "när jag kom hem."], ["När jag kom hem", "<b>åt<\/b>", "jag", "middag."], ["Om det regnar", "<b>stannar<\/b>", "vi", "inne."], ["Därför", "<b>kom<\/b>", "jag", "sent."], ["Imorgon", "<b>ska<\/b>", "jag", "handla."]]}, {"caption": "Same message, different starts", "head": ["Starts with", "Sentence"], "rows": [["the subject", "Jag <b>går<\/b> hem efter skolan."], ["a time word", "Efter skolan <b>går<\/b> jag hem."], ["a whole clause", "När skolan är slut <b>går<\/b> jag hem."]]}], "examples": [["När jag kom hem åt jag middag.", "When I came home, I ate dinner."], ["Om det regnar imorgon stannar vi inne.", "If it rains tomorrow, we will stay inside."], ["Därför kom jag för sent till skolan.", "That is why I was late for school."], ["Sedan gick vi till parken och lekte.", "Then we went to the park and played."], ["Eftersom Maja var trött gick hon och la sig tidigt.", "Because Maja was tired, she went to bed early."], ["Idag har jag ätit två smörgåsar till lunch.", "Today I have eaten two sandwiches for lunch."], ["Medan pappa lagade mat dukade barnen bordet.", "While Dad cooked, the children set the table."], ["Efter skolan spelar vi ofta fotboll på gården.", "After school we often play football in the yard."], ["Innan du går måste du diska.", "Before you go, you have to do the dishes."], ["Om du är hungrig kan du ta en macka.", "If you are hungry, you can take a sandwich."]], "mistakes": [{"wrong": "När jag kom hem, jag åt middag.", "right": "När jag kom hem, åt jag middag.", "why": "The bisats fills seat 1, so the verb must come next. English keeps <i>I<\/i> before the verb, so this feels wrong at first."}, {"wrong": "Imorgon jag ska handla.", "right": "Imorgon ska jag handla.", "why": "Whenever a time word starts the sentence, the verb jumps to second place and the subject moves behind it."}, {"wrong": "Om det regnar, vi stannar inne.", "right": "Om det regnar, stannar vi inne.", "why": "<i>Om det regnar<\/i> counts as one piece, so the verb is next."}, {"wrong": "Därför jag kom sent.", "right": "Därför kom jag sent.", "why": "<i>Därför<\/i> is an adverb in seat 1, so the verb must follow it."}], "trick": "Picture a bus with the verb always in <b>seat 2<\/b>. Seat 1 can be shared by a whole family of words, like <i>när jag kom hem<\/i>, but it is still only one seat.", "check": [{"q": "När vi kom hem ___ vi middag. (ate)", "a": "åt", "why": "The verb comes straight after the opening bisats."}, {"q": "Om det snöar ___ vi hemma. (stay: stannar)", "a": "stannar", "why": "Verb in seat 2, subject after it."}, {"q": "Fix it: Därför jag kom sent.", "a": "Därför kom jag sent.", "why": "Adverb first, then the verb."}, {"q": "In <i>När jag kom hem åt jag middag<\/i>, how many places does <i>När jag kom hem<\/i> take?", "a": "One (place 1)", "why": "A whole bisats counts as one piece."}, {"q": "Order the words: Imorgon / ska / jag / handla", "a": "Imorgon ska jag handla.", "why": "The first verb sits in seat 2."}]}, {"id": "verb", "title": "Verb forms: now, then and have-done", "level": "A2", "hook": "You will be able to take any verb and make it say now, yesterday, 'have done', or an order, and to talk about the future with ska. This is what lets you talk about when things happen.", "steps": [{"h": "Good news: verbs do not change with the person", "t": "A <b>verb<\/b> is an action word like <i>play<\/i> or <i>go<\/i>. In English the verb changes a bit with who does it (I play, she plays). In Swedish it never does: <i>jag spelar, du spelar, hon spelar, vi spelar, de spelar<\/i>. So for each verb you only need to learn a few forms, not a whole list per person. The forms change only to show <b>when<\/b> something happens. That is called <b>tense<\/b>."}, {"h": "The four key forms", "t": "Every verb has four forms to learn, in this order: the <b>infinitiv<\/b> (the basic 'to ...' form, <i>spela<\/i>), the <b>presens<\/b> (now, <i>spelar<\/i>), the <b>preteritum<\/b> (past, 'yesterday', <i>spelade<\/i>) and the <b>supinum<\/b> (the form after <i>har<\/i> = have, <i>spelat<\/i>). Dictionaries often list them in exactly this order. Look at the table: the endings of regular verbs follow patterns, and only a few verbs, like <i>skriva<\/i>, change their vowel."}, {"h": "Present tense: now, and habits", "t": "The <b>presens<\/b> says what is happening now or what happens regularly: <i>Nu spelar jag<\/i>, <i>Jag spelar varje dag<\/i>. Swedish has no '-ing' form: <i>Jag spelar<\/i> means both 'I play' and 'I am playing'. You never say <i>jag är spelar<\/i>. The ending is <b>-r<\/b> (or -ar / -er): ll mormor.", "She has written a long letter to grandma."], ["Stäng dörren, det är kallt ute!", "Close the door, it is cold outside!"], ["Imorgon ska vi besöka farmor och farfar.", "Tomorrow we will visit grandma and grandpa."], ["Min bror lagade middag igår kväll.", "My brother cooked dinner last night."], ["Jag vill läsa en bok efter skolan.", "I want to read a book after school."], ["Läraren stängde fönstret efter lektionen.", "The teacher closed the window after the lesson."], ["Hon bor nära skolan och går dit varje dag.", "She lives near the school and walks there every day."]], "mistakes": [{"wrong": "Jag spela fotboll varje dag.", "right": "Jag spelar fotboll varje dag.", "why": "English uses the plain verb with I, so we are tempted to do the same. In Swedish the present always needs its ending (-r, -ar, -er)."}, {"wrong": "Jag är bor i Göteborg.", "right": "Jag bor i Göteborg.", "why": "There is no 'I am living' form. The Swedish present covers both 'I live' and 'I am living'."}, {"wrong": "Jag har köpte en bil.", "right": "Jag har köpt en bil.", "why": "After har you need the supinum (köpt), not the past tense (köpte). English 'bought' does both jobs, Swedish does not."}, {"wrong": "Jag ska spelar fotboll.", "right": "Jag ska spela fotboll.", "why": "After ska, kan, vill and måste the verb stays in the infinitive, with no ending and no att."}], "trick": "Nu = -r, igår = -de/-te/-ade, har = -t. Learn the three little tags and the clue word tells you which form to use.", "check": [{"q": "Nu ___ jag fotboll. (spela)", "a": "spelar", "why": "Present tense adds -r (-ar)."}, {"q": "Igår ___ vi glass. (köpa)", "a": "köpte", "why": "Past tense of köpa; the stem ends in p so it takes -te."}, {"q": "Jag har ___ ett brev. (skriva)", "a": "skrivit", "why": "After har the supinum is used: skriva, skrev, skrivit."}, {"q": "Imperative (an order) of 'stänga':", "a": "stäng", "why": "Drop the last -a of the infinitive."}, {"q": "Imorgon ska jag ___ mat. (laga)", "a": "laga",
